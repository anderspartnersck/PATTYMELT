<!DOCTYPE html>
<!-- PATTY MELT — KITCHEN + DINING ROOM.  *** for Christine & Phillip Coleman. ***
     ONE parity-proven game (engine.js) rendered across TWO views: the KITCHEN (the grill you play)
     and the DINING ROOM (the front of house). The trick: Billy's `billy` ATTENTION already IS his
     location — when it drains he wanders out to BUS TABLES in the dining room; "HEY BILLY!" walks him
     back to the kitchen PASS to expo finished orders. So the two-screen drama needs ZERO engine change
     (parity untouched) — the dining room is a pure render of state (orders / wait / combo / buried).
       ?screens=2  (default) two screens side by side  — the 2UP cab
       ?screens=1  one screen, dining as a strip below — the POP-UP 1up experiment ("does it port?")
       ?mode=kids|family|arcade   ?items=full (FULL MENU recipes — legal on 2up/jailbreak)            -->
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>PATTY MELT — KITCHEN + DINING</title>
<style>
  html,body{margin:0;height:100%;background:#140a08;overflow:hidden;font-family:"Saira Condensed","Arial Narrow",sans-serif;}
  #frame{position:absolute;inset:0;display:grid;place-items:center;
    background:repeating-linear-gradient(0deg,rgba(181,53,43,.9) 0 22px,rgba(181,53,43,.5) 22px 44px),
               repeating-linear-gradient(90deg,rgba(181,53,43,.9) 0 22px,rgba(181,53,43,.5) 22px 44px),#7a1f18;}
  body.school #frame{background:repeating-linear-gradient(0deg,rgba(58,92,150,.9) 0 22px,rgba(58,92,150,.5) 22px 44px),
               repeating-linear-gradient(90deg,rgba(58,92,150,.9) 0 22px,rgba(58,92,150,.5) 22px 44px),#1f3a63;}  /* HEROES blue gingham */
  #wrap{position:relative;width:96vw;max-width:1280px;border:14px solid #2a1410;border-radius:10px;
    box-shadow:0 0 0 6px #0a0504,0 18px 60px #000;}
  canvas{display:block;width:100%;height:100%;image-rendering:pixelated;background:#0a0806;border-radius:4px;}
  #tag{position:absolute;bottom:-2.5em;width:100%;text-align:center;color:#f3e6c8;font-weight:600;
    font-size:13px;letter-spacing:.1em;opacity:.85;}
  /* bare mode: the canvas sits in #wrap with the gingham border; the cab art is hidden */
  #cab{display:contents;}
  #cabart,#cabflame{display:none;}
  /* FRAMED mode (?frame=2up-*): the real cab render is the frame, the live screen sits in the cutout */
  body.framed #frame{background:#000;}
  body.framed #wrap{border:none;box-shadow:none;width:auto;aspect-ratio:auto;background:none;}
  body.framed #cab{display:block;position:relative;width:min(98vw,96vh);aspect-ratio:1/1;margin:auto;}
  body.framed #cabart,body.framed #cabflame{display:block;position:absolute;inset:0;width:100%;height:100%;object-fit:fill;}
  body.framed #cabflame{pointer-events:none;animation:flameflicker 1.25s infinite;}
  body.framed #screen{position:absolute;left:var(--sl);top:var(--st);width:var(--sw);height:var(--sh);
    border-radius:0;background:#000;}
  body.framed #tag{bottom:0.4em;}
  @keyframes flameflicker{ 0%,100%{opacity:.92} 12%{opacity:1} 20%{opacity:.66} 28%{opacity:.98}
    42%{opacity:.8} 55%{opacity:1} 63%{opacity:.58} 71%{opacity:.95} 85%{opacity:.86} 93%{opacity:1} }
</style>
</head>
<body>
<div id="frame"><div id="wrap">
  <div id="cab"><img id="cabart" alt=""><img id="cabflame" alt=""><canvas id="screen"></canvas></div>
  <div id="tag">◄ ► move (grill + toaster) · F flip · C cheese · X toast bun · SPACE = HEY BILLY! · CO-OP: G/U handoff · T/O drop · R restart · S sound</div>
</div></div>

<script>
"use strict";
const pm = globalThis.PM, S = pm.Stage;
const Q = new URLSearchParams(location.search);
const SCREENS = Q.get("screens") === "1" ? 1 : 2;
const MODE = Q.get("mode") || "family";
const ITEMS = (Q.get("items") || "").toLowerCase() === "full" ? pm.ITEMS_FULL_MENU : null;
// MELTDOME (?battle or ?mode=meltdome): the FRIENDLY grill-off — the SAME shared grill + one Billy + one diner
// as co-op, but INDIVIDUAL scoring (pure merit, NO sabotage). Most CLEAN orders when the dinner bell rings wins.
const BATTLE = Q.has("battle") || (Q.get("mode") || "").toLowerCase() === "meltdome";
const BATTLE_SECS = Math.max(20, parseInt(Q.get("secs") || "90", 10));   // the service clock (?secs=)
const PLAYERS = BATTLE ? 2 : (Q.get("players") === "2" ? 2 : 1);   // battle is always 2 cooks; 2 = co-op tug-of-war
const GRILL = parseInt(Q.get("grill") || "6", 10);
// HEROES (school cafeteria) skin — base wired. ?skin=school, or auto on the 2up HEROES frame.
const SKIN = (Q.get("skin") || (Q.get("frame") === "2up-heroes" ? "school" : "diner")).toLowerCase();
const SCHOOL = SKIN === "school";
document.body.classList.toggle("school", SCHOOL);
// BUILD tag (?build=mark1) — the airy-engine generation; surfaced on screen, tab title + the deck strip.
// These open as DESKTOP modes (the big gingham deck) — NOT the tiny cab cutout — so they're easy to find
// while iterating, and read JAILBREAK (FULL MENU) out of the gate. (Joe, 2026-06-18.)
const BUILD = (Q.get("build") || "").toUpperCase();
const CAB_NAME = SCHOOL ? "PATTY MELT'S HEROES" : "PATTY'S POP-UP";
document.title = CAB_NAME + (BUILD ? " — " + BUILD : "") + " · JAILBREAK";
{ const tagEl = document.getElementById("tag");           // stamp the deck strip so the desktop build is findable
  if (tagEl && BUILD) tagEl.innerHTML =
    "<b style='color:#ffd27a'>" + CAB_NAME + " — " + BUILD + " · JAILBREAK</b> &nbsp;·&nbsp; " + tagEl.textContent; }
// EXPERIMENT (Joe's call): reuse the big HEROES KITCHEN scene as a DIM ambient backdrop behind the live
// grill (depth-stack trick) — heavily darkened so the live slots stay readable. If it reads cluttered,
// pull it (see docs/NEEDED_SPRITES.md for the clean per-state school grill surface to generate instead).
let heroBg = null;
if (SCHOOL) { heroBg = new Image(); heroBg.src = "assets/sprites/grill/bg-heroes-kitchen.png"; }
// TODO(next session): HEROES polish — (1) tune school GRILL SIZES per edition (cafeteria = bigger line?
//   the 1up arcade rule keeps school burger-only; 2up heroes can vary) — placeholder uses ?grill default 6.
//   (2) real student/lunch-lady sprites for the cafeteria regulars + a lunch-TRAY vessel under items
//   (placeholder: recolored diner bodies + the existing tray-school plate). (3) heroes food sprites if any.

const cv = document.getElementById("screen"), ctx = cv.getContext("2d");
// FRAMED cabs: drop the live two-screen render into the real 2up art's two cutouts (measured % of the
// 1024² render), with the lit Grillscreen FLAME flickering on top. ?frame=2up-diner|popup|heroes (2-screen only).
const FRAMES = {
  "2up-diner":  { art:"cab-2up-diner.png",  flame:"cab-2up-diner-flame.png",  rect:{ sl:30.2, st:40.7, sw:39.2, sh:22.0 } },
  "2up-popup":  { art:"cab-2up-popup.png",  flame:"cab-2up-popup-flame.png",  rect:{ sl:30.2, st:40.7, sw:39.2, sh:22.0 } },
  "2up-heroes": { art:"cab-2up-heroes.png", flame:"cab-2up-heroes-flame.png", rect:{ sl:33.5, st:37.3, sw:37.9, sh:19.1 } },
};
const FRAME = SCREENS === 2 ? FRAMES[(Q.get("frame") || "").toLowerCase()] : null;
const W = SCREENS === 2 ? 1280 : 720;
const H = FRAME ? Math.round(W * FRAME.rect.sh / FRAME.rect.sw) : 600;   // match the cutout aspect (no stretch)
cv.width = W; cv.height = H;
if (FRAME) {
  document.body.classList.add("framed");
  const cab = document.getElementById("cab"), art = document.getElementById("cabart"), flame = document.getElementById("cabflame");
  for (const [k, v] of Object.entries(FRAME.rect)) cab.style.setProperty("--" + k, v + "%");
  art.onload = () => { cab.style.aspectRatio = art.naturalWidth + "/" + art.naturalHeight; };
  art.src = "assets/cab/" + FRAME.art;
  flame.src = "assets/cab/" + FRAME.flame;
} else {
  document.getElementById("wrap").style.aspectRatio = W + "/" + H;
}

// the two view rects (layout-driven so one render serves both cabs)
const KIT = SCREENS === 2 ? { x:0, y:0, w:640, h:H } : { x:0, y:0, w:W, h:372 };
const DIN = SCREENS === 2 ? { x:640, y:0, w:640, h:H } : { x:0, y:372, w:W, h:H-372 };

// ---------- AIRY SPATULA GLIDE (the new engine feel) + the SPATULA SPRITE SEAM ----------
// Render-only air-cushion spring (lineage: cabinet.html springCursors → HIGH TABLE glideKnocker).
// The engine cursor SNAPS between integer slots (parity-locked); the DRAWN spatula GLIDES to it,
// banking + hopping as it whips across the grill. 2D here (the 2up grill is TWO rows, so x AND y).
// Parity-safe: _spat is render-side scratch, never read by the engine / node parity runs.
// Tuned near CRITICAL damping (zeta = DAMP / (2*sqrt(ACCEL)) ≈ 0.97): a hair under critical keeps the
// airy life but the blade settles on the slot with no visible overshoot wobble; ACCEL up = snappier track.
const KGLIDE_ACCEL = 240, KGLIDE_DAMP = 30;
function kitchenSpat(s, geo) {
  const now = performance.now();
  let dt = (now - (kitchenSpat._t == null ? now : kitchenSpat._t)) / 1000;
  kitchenSpat._t = now;
  if (dt > 0.05) dt = 0.05; if (dt < 0) dt = 0;          // tab-stall clamp — catch up, don't warp
  const center = (idx) => {
    if (geo.tcells && idx >= geo.gridN)                 // cursor is on the BUN TOASTER (past the grill slots)
      return geo.tcells[idx - geo.gridN] || { x: geo.ox, y: geo.oy };
    return geo.slotXY(idx); };                          // a grill bay (single-row line)
  if (!s._spat || s._spat.length !== s.players.length)   // (re)seed on a fresh game / grill resize
    s._spat = s.players.map((pl) => { const z = center(pl.cursor); return { x:z.x, y:z.y, vx:0, vy:0 }; });
  for (let pi = 0; pi < s.players.length; pi++) {
    const g = s._spat[pi], t = center(s.players[pi].cursor);
    g.vx += ((t.x - g.x) * KGLIDE_ACCEL - g.vx * KGLIDE_DAMP) * dt;
    g.vy += ((t.y - g.y) * KGLIDE_ACCEL - g.vy * KGLIDE_DAMP) * dt;
    g.x += g.vx * dt; g.y += g.vy * dt;
  }
  return s._spat;
}
// THE SPATULA SPRITE SEAM — incoming art (docs/SPATULA_SHEET.md) drops in here & lights up on reload.
// Absent = the per-player vector spatula (the placeholder) carries it; present = Patty's real spatula.
const SPAT_SPR = {};                                       // (legacy single-spatula art; the pair now lives in lib/spatulas.js)
PMSpat.load("assets/sprites/grill/");
const SPAT_FOOD_IMG = {};
for (const [k, f] of [["cheese", "cheese-fresh"], ["bread", "bread"], ["rye", "bread-rye"], ["raw", "patty-raw"],
                      ["seared", "patty-seared"], ["done", "patty-done"], ["burnt", "patty-burnt"]]) {
  const im = new Image(); im.onload = () => { SPAT_FOOD_IMG[k] = im; }; im.src = "assets/sprites/grill/" + f + ".png";
}
const spatFood = (k) => SPAT_FOOD_IMG[k] || null;
for (const [k, f] of [["level", "spatula-level"], ["flip", "spatula-flip"], ["toast", "spatula-toast"]]) {
  const im = new Image(); im.onload = () => { SPAT_SPR[k] = im; }; im.src = "assets/sprites/grill/spatula/" + f + ".png";
}
// GRILL-STATE BACKGROUND — the flat-top art swaps with buried_index so the desktop grill visibly
// HEATS UP with the rush (empty → cluttered → steaming → overloaded → on fire). Vector fallback if absent.
const GRILL_BG = {};
for (const n of ["empty", "cluttered", "steaming", "overloaded", "disaster"]) {
  const im = new Image(); im.onload = () => { GRILL_BG[n] = im; }; im.src = "assets/sprites/grill/grill-" + n + ".png";
}
function grillBgFor(b) {
  if (b >= pm.BURIED_BARKING)  return GRILL_BG.disaster;    // ≥0.78 — on fire
  if (b >= pm.BURIED_RESTLESS) return GRILL_BG.overloaded;  // ≥0.55 — hot
  if (b >= 0.30) return GRILL_BG.steaming;
  if (b >= 0.15) return GRILL_BG.cluttered;
  return GRILL_BG.empty;
}
// FOOD FX ART — the CHEESE SPLAT (on a cheese drop) + the BURN smoke column (when a patty's lost to
// the grill). Big painterly one-shots; absent = the vector note/ring carries it. (assets/sprites/grill/fx-*)
const FOOD_FX = { burn: [] };
{ const s = new Image(); s.onload = () => { FOOD_FX.splat = s; }; s.src = "assets/sprites/grill/fx-cheese-splat.png";
  for (const n of [1, 2, 3]) { const im = new Image(); im.onload = () => { FOOD_FX.burn[n - 1] = im; };
    im.src = "assets/sprites/grill/fx-burn-" + n + ".png"; } }
// FLIP-POP + FOOD FX — render-only beats keyed to engine state (recipe step advance / a burnt slot),
// so the grill READS. k: "note" (♪ flip), "splat" (cheese drop), "smoke" (a patty burnt away).
let grillPops = [];
function detectFlips(slotXY) {
  const seen = grillPops._seen || (grillPops._seen = []);
  for (let i = 0; i < game.slots.length; i++) {
    const p = game.slots[i], prev = seen[i], c = slotXY(i);
    if (p && prev && prev.born === p.born && p.step > prev.step) {       // same patty, an action just landed
      if (game.flash === "CHEESE!" && FOOD_FX.splat) grillPops.push({ k: "splat", x: c.x, y: c.y, t: 0, life: 18 });
      else grillPops.push({ k: "note", x: c.x, y: c.y, t: 0, life: 22, note: game.flash === "TOAST!" ? "♫" : "♪" });
    } else if (prev && !p && game.flash === "BURNT!") {                  // a patty just BURNED off this slot
      grillPops.push({ k: "smoke", x: c.x, y: c.y, t: 0, life: 46 });
    }
    seen[i] = p ? { born: p.born, step: p.step } : null;
  }
}
// draw one FX pop; returns true while alive
function drawPop(f, rad) {
  const k = f.t++ / f.life;
  if (f.k === "smoke") {                                  // charred patty + a rising, growing, fading smoke column
    const fr = FOOD_FX.burn[Math.min(2, Math.floor(k * 3))] || FOOD_FX.burn[FOOD_FX.burn.length - 1];
    if (fr && fr.width) { const w = rad * 2.4, h = w * fr.height / fr.width, rise = k * rad * 0.6;
      ctx.globalAlpha = k < 0.7 ? 1 : Math.max(0, (1 - k) / 0.3);
      ctx.drawImage(fr, f.x - w / 2, f.y + rad * 0.5 - h - rise, w, h); ctx.globalAlpha = 1; }
  } else if (f.k === "splat" && FOOD_FX.splat) {          // cheese splash blooms then settles
    const sp = FOOD_FX.splat, sc = (0.7 + k * 0.5), w = rad * 2.0 * sc, h = w * sp.height / sp.width;
    ctx.globalAlpha = Math.max(0, 1 - k); ctx.drawImage(sp, f.x - w / 2, f.y + rad * 0.4 - h, w, h); ctx.globalAlpha = 1;
  } else if (f.k === "note") {                            // the singing-spatula note + contact ring
    ctx.globalAlpha = 1 - k;
    txt(f.note, f.x + 12, f.y - 8 - k * 18, 18 + k * 6, COL.cheese, "center", 800);
    ctx.strokeStyle = "rgba(255,210,120," + (1 - k).toFixed(2) + ")"; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(f.x, f.y, 8 + k * 18, 0, 7); ctx.stroke(); ctx.globalAlpha = 1;
  }
  return f.t < f.life;
}
const CURS_HUE = ["#ff5a4d", "#6fb0e0"];                  // P1 red spatula · P2 (Chrissy) blue — vector fallback

// PATTY — the cook herself, a reactive foreground avatar (idle → flip on an action → serve on a
// handoff → cheer at BIG GRILL ENERGY). State-driven show-don't-tell. (TEST placement — tunable.)
const PATTY_SPR = {}, CHRISSY_SPR = {};
// SKIN-AWARE COOK ART: HEROES (school) loads the Cougars cook set; if a school file is missing it falls back
// to the diner art. So the HEROES COOK set (Patty + Chrissy) swaps together; Billy (the runner) is separate.
const COOK_SUFFIX = SCHOOL ? "-school" : "";
// DINER cast = the 0701 masters, re-cut per-pose into assets/chars/cast/ (Patty turnaround: idle/serve/cheer/
// profile; Chrissy action set: idle/flip/cheese/serve/cheer/scrape/run). SCHOOL still loads the top-level
// -school files, falling back to the diner cast when a school pose is missing.
function loadCook(map, base, poses) {
  for (const k of poses) {
    const im = new Image();
    im.onload = () => { map[k] = im; };
    im.onerror = () => { const d = new Image(); d.onload = () => { map[k] = d; }; d.src = "assets/chars/cast/" + base + "-" + k + ".png"; };
    im.src = SCHOOL ? ("assets/chars/" + base + "-school-" + k + ".png")   // patty-school-idle.png
                    : ("assets/chars/cast/" + base + "-" + k + ".png");    // cast/patty-idle.png
  }
}
// PLATERS both use CLEAN, FULL-BODY, griddle-free poses (consistent framing at the assembly). Patty holds the
// plate on a serve; Chrissy (co-op) cheers. The griddle-bearing action frames (flip/cheese/scrape) belong to a
// grill cook, not a plater, so they're intentionally NOT loaded here.
loadCook(PATTY_SPR, "patty", ["idle", "serve", "cheer"]);               // Patty is turnaround-only (idle/serve/cheer)
loadCook(CHRISSY_SPR, "chrissy", ["idle", "cheer"]);                    // full-body, stray-free; serve → cheer via fallback
// BILLY — the runner. A 6-frame COLOR walk cycle (billy-walk-0..5, run-with-tray) cycles while he crosses
// the floor; at the pass he PRESENTS the order (billy-serve). Absent art → the vector kid (drawBillyVec).
const BILLY_WALK = [], BILLY_SPR = {};
for (let i = 0; i < 6; i++) { const im = new Image(); const j = i; im.onload = () => { BILLY_WALK[j] = im; }; im.src = "assets/chars/billy-walk-" + i + ".png"; }
for (const [k, f] of [["serve", "billy-serve"], ["turn", "billy-turn"], ["slack", "billy-slack"]]) {
  const im = new Image(); im.onload = () => { BILLY_SPR[k] = im; }; im.src = "assets/chars/" + f + ".png";
}
let _billyPhase = 0, _billyPrev = 0, _billyFace = 1;     // walk-cycle phase · last pos (for velocity) · facing (1=right)
const PATTY_H = 0.50, PATTY_X = -0.05;                   // fraction of KIT height / x nudge off the left edge
function pickPattyPose() {
  const ov = Q.get("pose"); if (ov && PATTY_SPR[ov]) return ov;   // ?pose=cheer — QA/preview override
  const now = performance.now(), P = pickPattyPose;
  if (P._served == null) P._served = game.served;
  if (game.served > P._served) P._serveT = now;
  P._served = game.served;
  if (game.flash === "CHEESE!") P._cheeseT = now;
  if (game.flash === "FLIP!" || game.flash === "TOAST!") P._flipT = now;
  if (now - (P._serveT  || -9e9) < 650) return "serve";
  if (now - (P._cheeseT || -9e9) < 360) return "cheese";
  if (now - (P._flipT   || -9e9) < 360) return "flip";
  if (game.combo >= pm.FLOW_COMBO) return "cheer";
  return "idle";
}
// pose fallback so a cook missing a given frame degrades gracefully (Patty has no flip/cheese → serve → idle)
function cookSprite(map, pose) {
  const chain = { cheese: ["cheese", "idle"], flip: ["flip", "idle"],   // grill actions → idle for a plater (she's not at the grill)
                  serve: ["serve", "cheer", "idle"], cheer: ["cheer", "idle"], idle: ["idle"] };
  for (const k of (chain[pose] || [pose, "idle"])) if (map[k]) return map[k];
  return map.idle;
}
// A presiding cook, sized to a column and anchored to the kitchen floor. `zone` = {cx (foot x), footY, maxH, face}.
function drawCook(sprMap, zone) {
  const sp = cookSprite(sprMap, pickPattyPose());
  if (!sp || !sp.width) return;
  const h = zone.maxH, w = h * sp.width / sp.height;
  const x = zone.cx - w / 2, ty = zone.footY - h;
  // soft floor shadow so she's planted, not floating
  ctx.fillStyle = "rgba(0,0,0,0.30)"; ctx.beginPath(); ctx.ellipse(zone.cx, zone.footY - 4, w * 0.34, 7, 0, 0, 7); ctx.fill();
  if (zone.face < 0) { ctx.save(); ctx.translate(x + w, ty); ctx.scale(-1, 1); ctx.drawImage(sp, 0, 0, w, h); ctx.restore(); }
  else ctx.drawImage(sp, x, ty, w, h);
}
// THE PLATERS — Patty (+ Chrissy in co-op) stand at the ASSEMBLY end and ACT on every serve (plate/serve pose),
// handing the finished order to Billy at the pass. They're WORKING the line, not decoration.
function drawPlaters(L) {
  const footY = L.SLB - 2, maxH = Math.min((L.SLB - L.SLY) + 20, 280), aw = L.asmX1 - L.asmX0;
  if (L.coop) {
    drawCook(PATTY_SPR,   { cx: L.asmX0 + aw * 0.12, footY, maxH, face: 1 });   // P1 plates the left orders
    drawCook(CHRISSY_SPR, { cx: L.asmX0 + aw * 0.30, footY, maxH, face: 1 });   // P2 beside her
  } else {
    drawCook(PATTY_SPR, { cx: L.asmX0 + aw * 0.18, footY, maxH, face: 1 });     // Patty stands left of the counter, plating right
  }
}
// THE ASSEMBLY station — the prep counter (pass side of the sub-line) where the finished item is plated.
function drawAssembly(x, y, w, h) {
  const now = performance.now();
  const bx = x + w * 0.42, bw = w * 0.58;                  // counter on the PASS side; the cook stands to its left
  const cy = y + h * 0.46, cx = bx + bw * 0.52;
  ctx.fillStyle = "rgba(30,22,14,.6)"; ctx.fillRect(bx, cy - 28, bw, 56);       // stainless prep counter
  ctx.strokeStyle = "rgba(170,130,80,.5)"; ctx.lineWidth = 2; ctx.strokeRect(bx, cy - 28, bw, 56);
  txt(SCHOOL ? "TRAY-UP" : "ASSEMBLY", bx + bw / 2, cy - 36, 12, "rgba(230,180,110,.85)", "center", 800);
  // the TOPPING PANS (Joe 1027): raw onions + Swiss (the melts) left of the plate, American right — the cold line the
  // spatulas work from. Steel hotel pans sitting on the counter; they stay clear of the plate + its prompt.
  PMSpat.drawBin(ctx, "onions", bx + bw * 0.10, cy - 4, Math.min(48, bw * 0.2));
  PMSpat.drawBin(ctx, "swiss", bx + bw * 0.285, cy - 4, Math.min(48, bw * 0.2));
  PMSpat.drawBin(ctx, "american", bx + bw * 0.86, cy - 4, Math.min(48, bw * 0.2));

  const ready = game.slots.some((p) => p && p.stage === S.DONE && (!pm.TOAST_ITEMS.has(p.item) || p.bunned))
    || (game.toaster && game.toaster.some((b) => b && b.stage === S.DONE));
  const bob = ready ? Math.sin(now / 180) * 2 : 0;
  _asmPlate = { x: cx, y: cy };                            // remember where the plate sits (the serve FX launches + builds from here)
  const building = plateBuilding();                        // a just-served order is stacking here — let the FX own the plate
  if (building) {                                           // the counter is busy plating the last order (the build FX draws it)

}

// SHARED scale, keyed to the LEVEL frame's height, so flip/toast keep the same blade size (patty just
// flies higher) — frames don't jump scale on swap. Pivot ≈ the blade contact point (tunable).
const SPAT_TARGET_H = 66, SPAT_AX = 0.42, SPAT_AY = 0.80;
function spatScale() { return (SPAT_SPR.level && SPAT_SPR.level.height) ? SPAT_TARGET_H / SPAT_SPR.level.height : 0.05; }
// draw one player's spatula at its sprung position — Patty's real spatula if present, else the vector placeholder
function drawSpatula(g, pi, flash) {
  const lift = Math.min(7, Math.abs(g.vx) * 0.012);       // hops up as it whips between slots
  const lean = Math.max(-0.32, Math.min(0.32, g.vx * 0.0009));  // banks into the travel direction
  ctx.save(); ctx.translate(g.x, g.y - lift); ctx.rotate(lean);
  const sp = (flash === "FLIP!" && SPAT_SPR.flip) ? SPAT_SPR.flip
           : (flash === "TOAST!" && SPAT_SPR.toast) ? SPAT_SPR.toast : SPAT_SPR.level;
  if (sp && sp.width) {
    const SC = spatScale();
    if (pi === 1) ctx.filter = "hue-rotate(150deg) saturate(1.15) brightness(1.05)";  // Chrissy = bluer
    ctx.drawImage(sp, -sp.width * SPAT_AX * SC, -sp.height * SPAT_AY * SC, sp.width * SC, sp.height * SC);
    ctx.filter = "none";
  } else {                                                 // PLACEHOLDER: the per-player vector spatula
    ctx.fillStyle = CURS_HUE[pi] || CURS_HUE[0];
    ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(-9, -14); ctx.lineTo(9, -14); ctx.closePath(); ctx.fill();
  }
  ctx.restore();
}

// ---------- TIME-OF-DAY MOOD (render-only, parity-safe) ----------
// Each shift carries a clock ("6:00 AM" … "11:30 PM"); that hour washes the whole scene so the campaign
// visibly moves from cool-blue dawn → bright midday → amber dinner → deep night. No art — just a tint.
function shiftHour24() {
  const m = /(\d+):(\d+)\s*(AM|PM)/i.exec(shift().time || "");
  if (!m) return 12;
  let h = parseInt(m[1], 10) % 12; if (/pm/i.test(m[3])) h += 12;
  return h;
}
function todTint(h) {                        // [r,g,b,alpha] full-frame wash (source-over); midday ≈ invisible
  if (h < 6)  return [26, 30, 92, 0.30];     // small hours — deep blue
  if (h < 9)  return [80, 100, 170, 0.15];   // dawn — cool blue-lavender
  if (h < 11) return [255, 214, 150, 0.06];  // morning — soft warm
  if (h < 15) return [255, 238, 205, 0.03];  // midday — bright, barely there
  if (h < 17) return [255, 176, 92, 0.10];   // afternoon — warming
  if (h < 20) return [255, 120, 58, 0.16];   // dinner / golden hour — amber
  if (h < 22) return [48, 50, 122, 0.20];    // evening — blue
  return [30, 32, 96, 0.26];                 // night — deep blue-purple
}
function drawTimeOfDay() {
  const t = todTint(shiftHour24());
  ctx.fillStyle = "rgba(" + t[0] + "," + t[1] + "," + t[2] + "," + t[3] + ")";
  ctx.fillRect(0, 0, W, H);
}

// ---------- AUDIO (shared synth — the canonical build was silent) ----------

// ---------- the fixed-timestep sim loop (the house cadence) ----------
const SIM_DT = 1000 / pm.TPS;
let last = performance.now(), acc = 0;
function loop(now) { let e = now - last; last = now; if (e > 250) e = 250; acc += e; blink += e / 1000;
  while (acc >= SIM_DT) { step(); acc -= SIM_DT; }
  if (phase === "ready") { readyT -= e / 1000; if (readyT <= 0) phase = readyNext; }   // 3·2·1·GO! → play or bonus
  if (phase === "play" && BATTLE) {                    // MELTDOME: the service clock ends it (or a buried diner)
    battleT = Math.max(0, battleT - e / 1000);
    if (battleT <= 0 || game.over) endBattle();
  } else if (phase === "play" && game.over && !game.won) {   // campaign continue (Billy's break countdown)
    if (continueT === -1) continueT = CONTINUE_SECS;
    else if (continueT > 0) continueT = Math.max(0, continueT - e / 1000);
  }
  pollPads();                             // ARCADE STICK + BUTTONS (2-player) — polled once per frame
  audio.setBed(phase === "play" && !game.over && !game.won && !paused, pm.buried_index(game));   // beds only during the shift
  render(); requestAnimationFrame(loop); }

// ---------- 2-PLAYER ARCADE GAMEPAD (self-contained, additive, parity-safe) ----------
// Polled once per frame from loop(). Pad 0 → P1 (pi=0); pad 1 → P2 (pi=1, co-op only).
// Direction is HELD (throttled to match the keyboard cadence); the four face buttons are
// EDGE-detected (fire once per press). All wrapped in try/catch — no pad = no-op.
const PAD_MOVE_IV = 6;                      // frames between held-direction moves (Ghost owns the deadzone)
const _pad = [{ btn: [], moveCD: 0 }, { btn: [], moveCD: 0 }];   // per-pad: prev button-pressed + move throttle
function padDir(gp) {                       // fold stick / right-stick / d-pad / POV hat → -1, 0, +1
  // THE GHOST: one self-calibrating normalizer handles every HID stick (F300 dead
  // axes 2/3, 8BitDo right-stick, POV hat, d-pad). .x is the dead-axis-filtered
  // 8-way X intent in {-1,0,1}; PATTY MELT only steers horizontally, so use it directly.
  return Ghost.read(gp).x;
}
function pressed(gp, i) { return Ghost.btn(gp, i) || (gp.buttons[i] && gp.buttons[i].value > 0.5); }
function pollPads() {
  try {
    const pads = (navigator.getGamepads && navigator.getGamepads()) || [];
    const nP = game.players.length;
    for (let pi = 0; pi < 2 && pi < nP; pi++) {
      const gp = pads[pi]; const st = _pad[pi];
      if (!gp) { st.btn = []; continue; }
      // win / game-over screens: ANY freshly-pressed button advances (mirror the keyboard)
      const anyFresh = (i) => pressed(gp, i) && !st.btn[i];
      let anyEdge = false;
      for (let i = 0; i < gp.buttons.length; i++) if (anyFresh(i)) { anyEdge = true; break; }
      if (phase === "attract") { if (anyEdge) { wakeAudio(); startGame(); } }   // START — any button begins
      else if (phase === "ready") { /* inputs locked during the countdown */ }
      else if (phase === "won_campaign") { if (anyEdge) submitRun(); }
      else if (phase === "battle_over" || phase === "board") { if (anyEdge) toAttract(); }
      else if (phase === "initials" && pi === 0) {   // pad 0 drives the arcade initials entry
        const gg = Ghost.read(gp);
        if (gg.y < 0 && _entryPrev.y >= 0) entryName[entryPos] = (entryName[entryPos] + 1) % ENTRY_CH.length;         // up
        else if (gg.y > 0 && _entryPrev.y <= 0) entryName[entryPos] = (entryName[entryPos] + ENTRY_CH.length - 1) % ENTRY_CH.length; // down
        if (gg.x < 0 && _entryPrev.x >= 0) entryPos = Math.max(0, entryPos - 1);
        else if (gg.x > 0 && _entryPrev.x <= 0) entryPos = Math.min(2, entryPos + 1);
        if (anyEdge) { if (entryPos < 2) entryPos++; else finalizeEntry(); }
        _entryPrev = { x: gg.x, y: gg.y };
      }
      else if (phase === "bonus" && pi === 0) {    // pad 0 drives the bonus cart (held, throttled)
        if (mini.done) { if (anyEdge) endBonus(); }
        else { const d = padDir(gp);
          if (d === 0) st.moveCD = 0;
          else if (st.moveCD <= 0) { pm.mini_move(mini, d); st.moveCD = PAD_MOVE_IV; }
          else st.moveCD--; }
      }
      else if (game.over || game.won) {
        if (anyEdge) {
          if (game.won) nextShift();               // ROUND CLEAR → next shift (or campaign complete)
          else if (continueT > 0) billyBack();
          else submitRun();                        // continue expired → score entry then title
        }
      } else {
        // direction (held, throttled)
        const d = padDir(gp);
        if (d === 0) st.moveCD = 0;
        else if (st.moveCD <= 0) { pm.move(game, d, pi); st.moveCD = PAD_MOVE_IV; }
        else st.moveCD--;
        // face buttons (edge-detected): A=FLIP B=CHEESE X=TOAST Y/RT=HEY BILLY
        if (anyEdge) wakeAudio();
        if (anyFresh(0)) pm.flip(game, pi);
        if (anyFresh(1)) pm.add_cheese(game, pi);
        if (anyFresh(2)) pm.toast(game, pi);
        if (anyFresh(3) || anyFresh(7)) pm.hey_billy(game, pi);
        if (anyEdge) actionSfx();               // action sound for the gamepad path too
      }
      // latch this frame's pressed state for next-frame edge detection
      const cur = []; for (let i = 0; i < gp.buttons.length; i++) cur[i] = pressed(gp, i);
      st.btn = cur;
    }
  } catch (err) { /* absent / flaky gamepad API — no-op */ }
}

const DEMO = Q.has("demo");                 // self-playing (attract / QA) — the real auto-player drives it
function step() {
  if (phase === "bonus") { if (mini && !mini.done) pm.mini_tick(mini); return; }   // done → wait for a press to bank + advance
  if (phase === "ready" || paused || game.over || game.won) return;

  if (phase === "attract") {              // the title-screen demo: the auto-player cooks, loops forever

    if (game.fails > lastFails)  { spawnWalkout();  lastFails = game.fails; }

  if (game.served > lastServed) { spawnServeFX(goneItem(pre)); lastServed = game.served; }

// draw a subway-tile grid inside a clipped rect (grout lines only) — the shared wall/backsplash texture.
function tileGrid(x, y, w, h, grout, rowH, colW, colOff) {

  for (let tx = x + colOff; tx < x + w; tx += colW) { ctx.beginPath(); ctx.moveTo(tx + 0.5, y); ctx.lineTo(tx + 0.5, y + h); ctx.stroke(); }
  ctx.restore();

      rim: pi === 0 ? "rgba(255,110,80,.9)" : "rgba(120,190,255,.9)" });

  drawPlaters({ asmX0, asmX1, SLY, SLB, coop });           // Patty the plater (+ Chrissy in co-op) — acts on every serve
}

// ONE grill item: PMDrawItem's procedural side-view, except where Joe's painted toppings take over (Joe 1027,
// lib/spatulas.js): a melt's ONIONS ride the patty raw ▸ soft ▸ golden ▸ burnt across the Swiss step's window, and
// once the Swiss is on, the draped-slice art (it carries its own patty) is the item: fresh ▸ melting ▸ browned.
// A bunned melt waiting on Billy gets its rye lid. Burgers keep the procedural American cheese. Render-only.
function drawGrillItem(p, x, y, rad, now) {
  if (PMSpat.swissStage(p) && PMSpat.topping("swiss-" + PMSpat.swissStage(p) + "-draped")) {
    ctx.save(); ctx.globalAlpha = 0.30; ctx.fillStyle = "#000";                       // ground contact shadow (PMDrawItem's)
    ctx.beginPath(); ctx.ellipse(x, y + rad * 0.44, rad * 1.1, rad * 0.17, 0, 0, 7); ctx.fill(); ctx.restore();
    PMSpat.drawSwiss(ctx, x, y + rad * 0.02, rad * 2.35, p, "draped");
    if (p.bunned && SPAT_FOOD_IMG.rye) { const w = rad * 2.0, h = w * SPAT_FOOD_IMG.rye.height / SPAT_FOOD_IMG.rye.width;
      ctx.drawImage(SPAT_FOOD_IMG.rye, x - w / 2, y - rad * 0.32 - h / 2, w, h); }
    return;
  }
  PMDrawItem(ctx, p, x, y, rad, pm, now / 1000);
  if (PMSpat.onionsOn(p)) PMSpat.drawOnions(ctx, x, y - rad * 0.3, rad * 1.75, p, game, "top");   // the onions sit on the melt
}

// THE FOOD-SAFETY CARD (Joe 1026) — every shift opens on it: two spatulas, no hands on the food. Told to the audience.
const _safetySeen = new WeakMap();
function drawSafetyCard(x, y, w, h) {
  if (QA_STILL) return;
  if (!_safetySeen.has(game)) _safetySeen.set(game, performance.now());
  const k = (performance.now() - _safetySeen.get(game)) / 3600; if (k >= 1) return;
  const a = k < 0.1 ? k / 0.1 : k > 0.8 ? (1 - k) / 0.2 : 1, SF = PMSpat.SAFETY[SCHOOL ? "school" : "diner"];
  const bh = 84, by = y + (h - bh) / 2;
  ctx.save(); ctx.globalAlpha = a;
  ctx.fillStyle = "rgba(8,6,4,.84)"; ctx.fillRect(x + 24, by, w - 48, bh);
  ctx.strokeStyle = COL.good; ctx.lineWidth = 2; ctx.strokeRect(x + 24.5, by + 0.5, w - 49, bh - 1);
  txt("✋✗  " + SF[0], x + w / 2, by + 24, 18, COL.cream, "center", 800);
  txt(SF[1], x + w / 2, by + 46, 13, COL.cheese, "center", 700);
  txt(SF[2], x + w / 2, by + 70, 18, COL.good, "center", 800);
  ctx.restore();
}

// THE BUN TOASTER station — a BOXED unit beside the grill, slots stacked raw ▸ toasting ▸ READY (glow) ▸ burnt.
// Returns the slot-center list so the cursor/spatula glides onto it (engine cursor indices n .. n+toaster-1).
// PERMANENT station: on a toast-free round it draws an IDLE housing (returns [] so the cursor never targets it).
function drawToaster(bx, by, bw, bh, gridN) {
  const T = game.toaster;
  const label = SCHOOL ? "WARMER" : "TOASTER";
  // housing — a distinct chrome appliance so it reads as its OWN station, not part of the flat-top
  const idle = !T || !T.length;
  ctx.fillStyle = "rgba(24,18,12,.72)"; ctx.fillRect(bx, by, bw, bh);
  ctx.strokeStyle = idle ? "rgba(150,120,80,.45)" : "rgba(210,160,90,.7)"; ctx.lineWidth = 2; ctx.strokeRect(bx, by, bw, bh);
  ctx.fillStyle = "rgba(60,44,28,.9)"; ctx.fillRect(bx, by, bw, 26);
  txt(label, bx + bw / 2, by + 18, 13, idle ? COL.dim : COL.cheese, "center", 800);
  if (idle) {                                             // no toast item this round — show the empty appliance, cold
    const slots = 2, pad = 12, top = by + 34, slotH = (bh - 34 - pad) / slots;
    for (let ti = 0; ti < slots; ti++) {
      const cx = bx + pad, cy = top + ti * slotH, cw = bw - pad * 2, chh = slotH - pad;
      ctx.strokeStyle = "rgba(90,70,48,.4)"; ctx.lineWidth = 2; ctx.strokeRect(cx, cy, cw, chh);
      txt("—", cx + cw / 2, cy + chh / 2 + 6, 16, "rgba(150,120,80,.35)", "center", 700);
    }
    return [];
  }
  const cells = [];
  const pad = 12, top = by + 34, slotH = (bh - 34 - pad) / T.length;
  const cellW = bw - pad * 2, cellH = slotH - pad, now = performance.now();
  for (let ti = 0; ti < T.length; ti++) {
    const cx = bx + pad, cy = top + ti * slotH;
    cells.push({ x: cx + cellW / 2, y: cy + cellH / 2 });
    ctx.strokeStyle = COL.gridln; ctx.lineWidth = 2; ctx.strokeRect(cx, cy, cellW, cellH);
    ctx.fillStyle = "rgba(120,70,30,.10)"; ctx.fillRect(cx, cy, cellW, cellH);
    const mcx = cx + cellW / 2, mcy = cy + cellH / 2, b = T[ti];
    if (b && b.stage === undefined) {                     // a BUN toasting for a melt (fungible)
      const ready = b.cook >= pm.TOAST_READY;
      const frac = Math.min(1, b.cook / pm.TOAST_BURN);
      const nearBurn = b.cook >= pm.TOAST_BURN - 6;       // about to burn — flash a warning
      const brown = ready ? (nearBurn && (now / 120 | 0) % 2 ? COL.bad : "#e0a83c") : "#d9c08a";
      ctx.fillStyle = brown; ctx.fillRect(mcx - cellW * 0.34, mcy - 8, cellW * 0.68, 16);
      if (ready) { ctx.strokeStyle = COL.cheese; ctx.lineWidth = 2; ctx.strokeRect(mcx - cellW * 0.37, mcy - 11, cellW * 0.74, 22);
        txt("READY", mcx, cy + 12, 10, nearBurn ? COL.bad : COL.cheese, "center", 800); }
      else txt("BUN ···", mcx, cy + 12, 10, COL.dim, "center", 700);
      ctx.fillStyle = "#241c12"; ctx.fillRect(cx + 4, cy + cellH - 6, cellW - 8, 4);
      ctx.fillStyle = nearBurn ? COL.bad : ready ? COL.good : COL.amber; ctx.fillRect(cx + 4, cy + cellH - 6, (cellW - 8) * frac, 4);
    } else if (b) {                                        // a GRILLED CHEESE cooking ON the toaster (a Patty)
      PMDrawItem(ctx, b, mcx, mcy, Math.min(cellW, cellH) * 0.34, pm, now / 1000);
      const done = b.stage === S.DONE;
      drawCookPrompt(b, mcx, mcy, Math.min(cellW, cellH) * 0.34, cy + 12);   // ▸ TOAST / ▸ CHEESE
      if (!cookPrompt(b) || !cookPrompt(b).ready)
        txt(done ? "SERVE ▸" : (ITEMS ? pm.ITEM_TICKET[b.item] : "G.CHZ"), mcx, cy + 12, 10,
            done ? COL.good : COL.cream, "center", 800);
    } else {
      txt("＋", mcx, mcy + 6, 18, COL.dim, "center", 700);   // empty: X-toast drops a bun here
    }
  }
  return cells;
}

// ---------- THE DINING ROOM (front of house — the buried-index made literal) ----------
function drawDining() {
  const r = DIN;
  // THE ROOM — real painted dining room (diner-room.png). Fills the panel; vector fallback if absent.
  if (DINING_BG.complete && DINING_BG.naturalWidth) {
    ctx.drawImage(DINING_BG, r.x, r.y, r.w, r.h);
  } else {
    ctx.fillStyle = "#16100c"; ctx.fillRect(r.x, r.y, r.w, r.h);
    ctx.font = '700 16px "Courier New",monospace'; ctx.textAlign = "center"; ctx.fillStyle = COL.ascii;
    ctx.fillText(ASCII_BOOTH, r.x + r.w / 2, r.y + 88);
    for (let yy = 0; yy < r.h; yy += 26) for (let xx = 0; xx < r.w; xx += 26)
      if (((xx / 26 | 0) + (yy / 26 | 0)) % 2) { ctx.fillStyle = "rgba(120,40,32,.12)"; ctx.fillRect(r.x + xx, r.y + yy, 26, 26); }
  }
  const door = doorXY();
  // the patience of the house = the WAIT meter; seats FILL as the line backs up (buried_index)
  const wf = Math.min(1, game.wait / pm.WAIT_FULL), buried = pm.buried_index(game);
  const seated = Math.max(1, Math.round(2 + buried * (SEATS.length - 2)));
  const T = performance.now() / 1000;
  for (let i = 0; i < SEATS.length; i++) {
    if (i >= seated) continue;
    const p = seatXY(i), sc = p.stool ? 0.82 : 1.0, reg = REGULARS[i % REGULARS.length];
    const ang = Math.min(1, wf * (0.7 + 0.3 * ((i * 7 % 5) / 4)));
    const cc = ang >= .78 ? COL.bad : ang >= .5 ? COL.amber : COL.good;
    const sipping = (Math.sin(T * 0.7 + i * 1.9) > 0.86);
    const bob = (ang >= .78 ? Math.sin(T * 14 + i) * 2 : Math.sin(T * 2.2 + i * 1.7) * 1.4) + (sipping ? 2 : 0);
    const hy = p.y - 10 * sc + bob;
    ctx.save();
    ctx.fillStyle = "rgba(0,0,0,0.22)"; ctx.beginPath(); ctx.ellipse(p.x, p.y + 10 * sc, 12 * sc, 4 * sc, 0, 0, 7); ctx.fill();  // seat shadow
    ctx.fillStyle = reg.shirt; ctx.fillRect(p.x - 9 * sc, p.y - 2 * sc, 18 * sc, 15 * sc);                                       // torso
    ctx.fillStyle = "#e8c9a0"; ctx.beginPath(); ctx.arc(p.x, hy, 9 * sc, 0, 7); ctx.fill();                                     // head (bobs)
    ctx.strokeStyle = "rgba(40,20,12,0.5)"; ctx.lineWidth = 1; ctx.stroke();
    if (sipping) { ctx.fillStyle = COL.cream; ctx.fillRect(p.x - 13 * sc, hy - 1, 5, 5); }                                      // mug
    ctx.fillStyle = cc; ctx.beginPath(); ctx.arc(p.x + 9 * sc, hy - 7, 4, 0, 7); ctx.fill();                                    // patience dot
    ctx.restore();
    if (ang >= .85) txt(L.bark, p.x, hy - 16, 11, COL.bad, "center", 800);
    else if (ang >= .6) txt("…", p.x, hy - 14, 15, COL.amber, "center", 800);
  }
  // FX: plates carried out (serve → a seat) + walkouts (fail → the door)
  for (const f of fx) {
    const k = f.t / f.life;
    if (f.k === "plate") {                     // BUILD at the assembly, then two travel legs: ASSEMBLY → PASS (kitchen) then PASS → table (dining)
      const mx = f.mx == null ? f.x : f.mx, my = f.my == null ? f.y : f.my, bt = f.bt || 0;
      if (f.t < bt) {                          // PHASE 1 — the order stacks bun▸patty▸cheese▸top bun at the counter
        const b = f.t / bt, bob = Math.sin(b * Math.PI) * 2;
        drawCarryPlate(f.x, f.y - bob, b, f.item);
      } else {                                 // PHASE 2 — the finished plate runs to the pass, then out to the table
        const kk = (f.t - bt) / (f.life - bt);
        let x, y;
        if (kk < 0.4) { const u = kk / 0.4; x = f.x + (mx - f.x) * u; y = f.y + (my - f.y) * u; }
        else { const u = (kk - 0.4) / 0.6; x = mx + (f.tx - mx) * u; y = my + (f.ty - my) * u - Math.sin(u * Math.PI) * 20; }
        drawCarryPlate(x, y, 1, f.item);
        if (kk > 0.86) txt("♥", f.tx, f.ty - 22, 16, COL.cheese, "center", 800);
      } }
    else if (f.k === "walk") { const wx = f.x + (door.x - f.x) * k, wy = f.y + (door.y - f.y) * k;   // storms to the door
      ctx.globalAlpha = 1 - k * 0.7; ctx.fillStyle = COL.bad;
      ctx.beginPath(); ctx.arc(wx, wy - 9, 10, 0, 7); ctx.fill(); ctx.fillRect(wx - 9, wy + 1, 18, 13);
      txt("✗ WALKOUT", wx, wy - 24, 12, COL.bad, "center", 800); ctx.globalAlpha = 1; }
  }
  if (game.combo >= pm.FLOW_COMBO) txt(L.happy, r.x + r.w / 2, r.y + r.h - 12, 14, COL.cheese, "center", 800);
  // MOOD LIGHTING — warm glow when rockin', red wash when buried (lighter now; the room is already lit)
  if (game.combo >= pm.FLOW_COMBO) { ctx.fillStyle = "rgba(255,180,90,0.08)"; ctx.fillRect(r.x, r.y, r.w, r.h); }
  if (buried > 0.4) { ctx.fillStyle = "rgba(200,30,20," + (Math.min(.30, (buried - 0.4) * 0.6)).toFixed(2) + ")"; ctx.fillRect(r.x, r.y, r.w, r.h); }
}

// ---------- BILLY — walks between the screens (bussing ↔ expo), the HEY BILLY mechanic made visible ----------
const BILLY_H = 0.25;   // sprite height as a fraction of the screen — sized to the room (a kid, not a giant at the seam)
// pick Billy's sprite + facing from his MOTION (render-only). vel>0 = heading to the pass (moving LEFT),
// vel<0 = heading out to the dining room (moving RIGHT); the walk frames face right, so flip on left.
function billyFrame() {
  const vel = billyPos - _billyPrev; _billyPrev = billyPos;
  const moving = Math.abs(vel) > 0.0009 || game.billy_turn_t > 0;
  if (Math.abs(vel) > 0.0013) _billyFace = vel > 0 ? -1 : 1;
  const atPass = billyPos > 0.78;
  if (moving && BILLY_WALK.length === 6 && BILLY_WALK[0]) {
    _billyPhase += Math.min(0.55, Math.abs(vel) * 22 + 0.13);   // cycle rate tracks how fast he crosses
    return { im: BILLY_WALK[Math.floor(_billyPhase) % 6], face: _billyFace, moving };
  }
  if (atPass && BILLY_SPR.serve) return { im: BILLY_SPR.serve, face: -1, moving:false };  // presenting INTO the kitchen window
  return { im: (BILLY_WALK[0] || BILLY_SPR.serve || null), face: _billyFace, moving:false };
}
function drawBillyVec(x, y0, T) {                                           // fallback: the blocky vector kid
  const atPass = billyPos > 0.72, crossing = billyPos > 0.28 && billyPos < 0.72;
  const walking = crossing || (game.billy_turn_t > 0), stride = Math.sin(T * 10);
  const bob = walking ? Math.abs(stride) * 4 : Math.sin(T * 2) * 1.2, lean = walking ? stride * 0.1 : 0;
  ctx.save(); ctx.translate(x, y0 - bob); ctx.rotate(lean);
  ctx.fillStyle = "#1c3f63"; ctx.fillRect(-7, 22, 5, 7 + (walking ? stride * 3 : 0)); ctx.fillRect(2, 22, 5, 7 - (walking ? stride * 3 : 0));
  ctx.fillStyle = "#2f6fb0"; ctx.fillRect(-10, -4, 20, 26);
  ctx.fillStyle = "#2a5f9c"; const sw = walking ? -stride * 4 : 0; ctx.fillRect(-13, sw, 4, 12); ctx.fillRect(9, -sw, 4, 12);
  ctx.fillStyle = "#e8c9a0"; ctx.beginPath(); ctx.arc(0, -12, 9, 0, 7); ctx.fill();
  ctx.fillStyle = "#1c3f63"; ctx.fillRect(-10, -21, 20, 7);
  ctx.restore();
}
function drawBilly() {
  const T = performance.now() / 1000;
  const a = billyBus(), b = billyPass();                     // FEET interpolate bus-floor ↔ pass window (no more booth-stomping)
  const footX = a.x + (b.x - a.x) * billyPos, footY = a.y + (b.y - a.y) * billyPos;
  const atPass = billyPos > 0.72, crossing = billyPos > 0.28 && billyPos < 0.72;
  const carrying = atPass || billyPos > 0.5;                 // holds a plate at/near the pass (the handoff made visible)
  const fr = billyFrame();
  const h = H * BILLY_H, bob = fr.moving ? Math.abs(Math.sin(T * 9)) * 3 : Math.sin(T * 2) * 1.1;
  // floor shadow (on the aisle, not in a booth)
  const sw = h * 0.20;
  ctx.fillStyle = "rgba(0,0,0,0.30)"; ctx.beginPath(); ctx.ellipse(footX, footY - 2, sw, 6, 0, 0, 7); ctx.fill();
  if (fr.im) {
    const w = h * fr.im.width / fr.im.height;
    ctx.save(); ctx.translate(footX, footY - bob); ctx.scale(fr.face, 1);
    ctx.drawImage(fr.im, -w / 2, -h, w, h);
    ctx.restore();
    if (carrying) drawCarryPlate(footX + fr.face * h * 0.16, footY - bob - h * 0.52, 1, readyItem() || lastPlateItem);   // a plate in his hands
  } else drawBillyVec(footX, footY - h * 0.5, T);
  const y = footY - h * 0.5;
  const coop = game.players.length === 2;
  let label, lc;
  if (coop && game.billy_turn_t > 0) { label = "…turning"; lc = COL.amber; }
  else if (atPass) { label = coop ? ("EXPO ▸ " + (game.billy_facing === 0 ? "P1" : "P2")) : "BILLY: EXPO!"; lc = COL.good; }
  else if (crossing) { label = "…coming!"; lc = COL.amber; }
  else { label = "BILLY: " + L.bus; lc = COL.dim; }
  ctx.font = '800 13px "Saira Condensed","Arial Narrow",sans-serif';   // dark chip behind the label so it reads over the room
  const lw = ctx.measureText(label).width + 12, ly = footY - h - 18;
  ctx.fillStyle = "rgba(10,6,4,0.66)"; ctx.fillRect(footX - lw / 2, ly, lw, 18);
  txt(label, footX, ly + 14, 13, lc, "center", 800);
  const af = game.billy / pm.BILLY_FULL;                     // attention meter under his feet
  ctx.fillStyle = "#241c12"; ctx.fillRect(footX - 22, footY + 8, 44, 5);
  ctx.fillStyle = af > .5 ? COL.good : COL.amber; ctx.fillRect(footX - 22, footY + 8, 44 * af, 5);
}
// a small plate-with-burger (the finished order). build (0..1) STACKS the layers in turn for the
// ASSEMBLY build animation; default 1 = fully assembled (Billy's carry, the pass ledge, the ready plate).
function drawCarryPlate(x, y, build = 1, item = null) {
  if (item && pm.TOAST_ITEMS.has(item) && PMSpat.topping(SCHOOL ? "plated-heroes" : "plated-diner")) {   // the plated PATTY MELT (Joe 1027)
    ctx.save(); ctx.fillStyle = "rgba(0,0,0,0.25)"; ctx.beginPath(); ctx.ellipse(x, y + 4, 16, 4.5, 0, 0, 7); ctx.fill();
    if (build < 1) ctx.globalAlpha = Math.max(0, Math.min(1, (build - 0.2) / 0.5));   // it settles onto the counter as it's plated
    PMSpat.drawPlated(ctx, SCHOOL, x, y - 4 - (1 - Math.min(1, build * 1.6)) * 8, 40); ctx.restore();
    return;
  }
  ctx.save();
  ctx.fillStyle = "rgba(0,0,0,0.25)"; ctx.beginPath(); ctx.ellipse(x, y + 3, 13, 4, 0, 0, 7); ctx.fill();
  ctx.fillStyle = COL.cream; ctx.beginPath(); ctx.ellipse(x, y, 13, 5, 0, 0, 7); ctx.fill();     // plate
  // the stack builds bottom→top; each layer drops into place in turn (bun ▸ patty ▸ cheese ▸ top bun)
  plateLayer(x, y - 3, 8, 4, "#5a3a1e", 0.05, build);   // bun bottom
  plateLayer(x, y - 5, 8, 4, COL.done,  0.34, build);   // patty
  plateLayer(x, y - 6, 9, 3, COL.cheese, 0.60, build);  // a melty cheese slice, draping a touch wider
  plateLayer(x, y - 8, 7, 3, "#e6b23c", 0.82, build);   // top bun
  ctx.restore();
}
// one stacked layer; before its `appear` threshold it's absent, then it drops+fades into place (smoothstep).
function plateLayer(x, baseY, rx, ry, col, appear, build) {
  if (build < appear) return;
  const local = Math.min(1, (build - appear) / 0.14), e = local * local * (3 - 2 * local);
  ctx.globalAlpha = 0.35 + 0.65 * e;
  ctx.fillStyle = col; ctx.beginPath(); ctx.ellipse(x, baseY - (1 - e) * 9, rx, ry, 0, 0, 7); ctx.fill();
  ctx.globalAlpha = 1;
}
// THE PASS WINDOW — the lit service window at the seam; finished plates wait on the ledge for Billy.
function drawPass() {
  const wy = passWinY(), ledgeY = wy.y1 + 4, sx = KIT.w;
  // frame straddling the seam
  ctx.fillStyle = "#0e0805"; ctx.fillRect(sx - 30, wy.y0 - 12, 60, (wy.y1 - wy.y0) + 40);
  ctx.fillStyle = "rgba(255,196,120,0.10)"; ctx.fillRect(sx - 24, wy.y0, 48, wy.y1 - wy.y0);   // warm light from the kitchen
  ctx.strokeStyle = "rgba(210,160,90,.8)"; ctx.lineWidth = 3; ctx.strokeRect(sx - 24, wy.y0, 48, wy.y1 - wy.y0);
  ctx.fillStyle = "#3a2416"; ctx.fillRect(sx - 30, ledgeY, 60, 8);                             // the ledge (stainless pass shelf)
  // heat-lamp glow bar over the window
  ctx.fillStyle = "rgba(255,120,40,0.5)"; ctx.fillRect(sx - 22, wy.y0 + 2, 44, 3);
  txt("PASS", sx, wy.y0 - 16, 12, COL.cheese, "center", 800);
  // a plate waits on the ledge whenever there's a finished order ready to run
  const ready = game.slots.some((p) => p && p.stage === S.DONE && (!pm.TOAST_ITEMS.has(p.item) || p.bunned))
    || (game.toaster && game.toaster.some((b) => b && b.stage === S.DONE));
  if (ready) { drawCarryPlate(sx, ledgeY - 4, 1, readyItem()); txt("ORDER UP", sx, wy.y1 + 26, 11,
      (performance.now() / 300 | 0) % 2 ? COL.cheese : COL.good, "center", 800); }
}

function render() {
  easeBilly(); stepFX();
  ctx.fillStyle = "#0a0806"; ctx.fillRect(0, 0, W, H);
  drawKitchen(); drawDining();
  if (SCREENS === 2) { ctx.fillStyle = "#140a08"; ctx.fillRect(KIT.w - 2, 0, 4, H); drawPass(); }   // the seam + the service window
  else { ctx.strokeStyle = "#2a1410"; ctx.lineWidth = 3; ctx.beginPath(); ctx.moveTo(0, DIN.y); ctx.lineTo(W, DIN.y); ctx.stroke(); }
  drawBilly();                                // Billy in front of the pass, reaching in for the plate
  drawTimeOfDay();                          // the shift's clock washes the scene (dawn → midday → dusk → night)
  if (BATTLE && phase === "play") drawBattleHUD();
  if (!BATTLE && phase === "play" && game.won) {   // SHIFT CLEAR — advance the campaign
    const sh = shift(), last = shiftIdx + 1 >= CAMP.SHIFTS.length;
    ctx.fillStyle = "rgba(10,5,4,.74)"; ctx.fillRect(0, H / 2 - 46, W, 92);
    txt("SHIFT " + sh.n + " CLEAR — " + sh.name, W / 2, H / 2 - 8, 26, COL.good, "center", 800);
    txt(last ? "press SPACE — close the diner" : "press SPACE — next shift",
        W / 2, H / 2 + 24, 16, COL.cream, "center", 700);
  }
  if (!BATTLE && phase === "play" && game.over) {   // Billy's on BREAK (not fired) — the arcade continue
    const secs = Math.max(0, Math.ceil(continueT));
    ctx.fillStyle = "rgba(10,5,4,.72)"; ctx.fillRect(0, H / 2 - 46, W, 92);
    txt(pm.THEMES[game.theme].fired, W / 2, H / 2 - 8, 30, COL.cheese, "center", 800);
    txt(continueT > 0 ? "bring him back? press any button — " + secs : "press any button — end the run",
        W / 2, H / 2 + 24, 16, continueT > 0 ? (secs <= 3 ? COL.bad : COL.cream) : COL.amber, "center", 700);
  }
  if (phase === "attract") drawAttract();   // title card over the live demo
  if (phase === "ready")   drawReady();      // the SHIFT / MELTDOME card + 3·2·1·GO! before it goes live
  if (phase === "won_campaign") drawComplete();
  if (phase === "battle_over") drawBattleOver();
  if (phase === "initials") drawInitials();
  if (phase === "board") drawBoard();
  if (phase === "bonus") drawMini(mini);
  if (paused && !QA_STILL) banner("PAUSED", COL.cream);
}
function banner(s, c) { ctx.fillStyle = "rgba(10,5,4,.66)"; ctx.fillRect(0, H / 2 - 34, W, 68);
  txt(s, W / 2, H / 2 + 8, 30, c, "center", 800); }

// ---------- ATTRACT (title card over the live self-playing demo) ----------
function drawAttract() {
  ctx.fillStyle = "rgba(10,6,4,0.56)"; ctx.fillRect(0, 0, W, H);   // dim the demo so the marquee reads
  const cx = W / 2;
  const lw = Math.min(620, W * 0.52);
  const drew = !SCHOOL && drawLogo(cx, H * 0.12, lw, "color");     // the brand marquee (diner)
  if (!drew) {                                       // text fallback (+ the school skin until a HEROES logo lands)
    const top = H * 0.30;
    ctx.save(); ctx.shadowColor = "rgba(0,0,0,.8)"; ctx.shadowBlur = 12;
    txt(SCHOOL ? "PATTY MELT'S" : "PATTY  MELT", cx, top, 66, COL.cheese, "center", 800);
    if (SCHOOL) txt("HEROES", cx, top + 58, 58, COL.cream, "center", 800);
    ctx.restore();
    txt(SCHOOL ? "the lunch-rush hero grill" : "a family-diner grill rush", cx, top + (SCHOOL ? 108 : 44), 22, COL.cream, "center", 600);
  }
  if (Math.floor(blink * 1.6) % 2 === 0)             // blinking start prompt
    txt("PRESS  SPACE  —  OR  ANY  BUTTON  —  TO  START", cx, H * 0.68, 26, COL.amber, "center", 800);
  txt("◄ ► move   ·   F flip   ·   C cheese   ·   X toast bun   ·   SPACE = HEY BILLY!",
      cx, H * 0.76, 16, COL.dim, "center", 600);
  // high-score teaser (top 3) — the coin-op come-on
  const top3 = scores.slice(0, 3);
  for (let i = 0; i < top3.length; i++)
    txt(String(i + 1) + "   " + top3[i][0] + "    " + String(top3[i][1]).padStart(6, "0"),
        cx, H * 0.83 + i * 18, 15, i === 0 ? COL.cheese : COL.dim, "center", 600);
  txt("for Christine & Phillip Coleman", cx, H - 20, 14, COL.dim, "center", 600);
}
// ---------- GET READY (the breather so the grill doesn't ambush you) ----------
function drawReady() {
  ctx.fillStyle = "rgba(10,6,4,0.74)"; ctx.fillRect(0, 0, W, H);
  const cx = W / 2, cy = H / 2;
  if (readyNext === "bonus" && mini) {
    const chill = mini.cfg.mood === "chill", acc = chill ? "#6fd0e8" : COL.bad;
    txt("BONUS ROUND", cx, cy - 96, 20, COL.amber, "center", 800);
    txt(mini.cfg.name, cx, cy - 54, 52, acc, "center", 800);
    txt(mini.cfg.flavor, cx, cy - 24, 18, COL.cream, "center", 600);
    txt(chill ? "catch what falls — pure bonus, NO fail" : "clear the backlog or forfeit — ×2 if you clear it",
        cx, cy + 6, 16, COL.dim, "center", 600);
    txt("◄ ► move the cart", cx, cy + 40, 14, COL.dim, "center", 600);
  } else if (BATTLE) {
    txt("MELTDOME", cx, cy - 96, 20, COL.amber, "center", 800);
    txt("THE GRILL-OFF", cx, cy - 54, 52, COL.cheese, "center", 800);
    txt("one grill · one Billy · " + BATTLE_SECS + "s dinner service", cx, cy - 24, 18, COL.cream, "center", 600);
    txt("most CLEAN orders when the bell rings WINS — may the best cook win", cx, cy + 6, 16, COL.dim, "center", 600);
    txt("P1 PATTY  ◄►·F/C/X·SPACE=BILLY        P2 CHRISSY  J/L·I/K/.·M=BILLY", cx, cy + 40, 13, COL.dim, "center", 600);
  } else {
    const sh = shift();
    txt("SHIFT " + sh.n + " OF " + CAMP.SHIFTS.length, cx, cy - 96, 20, COL.amber, "center", 800);
    txt(sh.name, cx, cy - 54, 52, COL.cheese, "center", 800);
    txt(sh.time + "    ·    ♪ " + String(sh.music || "").toUpperCase(), cx, cy - 24, 18, COL.cream, "center", 600);
    txt(sh.wrinkle, cx, cy + 6, 17, COL.dim, "center", 600);
  }
  const n = Math.ceil(readyT - 0.6);
  if (n > 0) txt(String(n), cx, cy + 82, 72, COL.cream, "center", 800);
  else       txt("GO!",     cx, cy + 76, 60, COL.good,  "center", 800);
}
// ---------- MELTDOME battle: the live scoreboard (service clock + per-cook clean serves) ----------
function drawBattleHUD() {
  const secs = Math.max(0, Math.ceil(battleT)), cx = W / 2;
  ctx.fillStyle = "rgba(10,6,4,0.55)"; ctx.fillRect(cx - 64, 10, 128, 50);   // clock plate, centered on the divider
  txt(Math.floor(secs / 60) + ":" + String(secs % 60).padStart(2, "0"), cx, 40, 28, secs <= 10 ? COL.bad : COL.cheese, "center", 800);
  txt("DINNER SERVICE", cx, 56, 10, COL.dim, "center", 700);
  txt("PATTY  " + cook[0].serves, KIT.x + 22, KIT.y + 36, 22, "#ff5a4d", "left", 800);          // tallies in the outer corners
  txt(cook[1].serves + "  CHRISSY", DIN.x + DIN.w - 22, DIN.y + 36, 22, "#6fb0e0", "right", 800);
}
// ---------- MELTDOME battle: the winner screen (pure merit — most clean serves) ----------
function drawBattleOver() {
  ctx.fillStyle = "rgba(8,5,4,0.90)"; ctx.fillRect(0, 0, W, H);
  const cx = W / 2, names = ["PATTY", "CHRISSY"], hues = ["#ff5a4d", "#6fb0e0"];
  txt("TIME! — THE BELL RINGS", cx, H * 0.24, 28, COL.cheese, "center", 800);
  ctx.save(); ctx.shadowColor = "rgba(0,0,0,.8)"; ctx.shadowBlur = 12;
  if (battleWinner === -1) txt("A DEAD HEAT!", cx, H * 0.40, 54, COL.cream, "center", 800);
  else txt(names[battleWinner] + " WINS", cx, H * 0.40, 54, hues[battleWinner], "center", 800);
  ctx.restore();
  txt("vs", cx, H * 0.56 + 18, 20, COL.dim, "center", 700);
  for (const pi of [0, 1]) {
    const x = cx + (pi === 0 ? -170 : 170);
    txt(names[pi], x, H * 0.56, 22, hues[pi], "center", 800);
    txt(cook[pi].serves + " served", x, H * 0.56 + 26, 18, COL.cream, "center", 700);
    txt(String(cook[pi].score) + " pts", x, H * 0.56 + 48, 14, COL.dim, "center", 600);
  }
  if (Math.floor(blink * 1.6) % 2 === 0) txt("R = rematch    ·    any button = title", cx, H * 0.76, 18, COL.amber, "center", 800);
}
// ---------- CAMPAIGN COMPLETE (survived all 12 shifts) ----------
function drawComplete() {
  ctx.fillStyle = "rgba(8,5,4,0.90)"; ctx.fillRect(0, 0, W, H);
  const cx = W / 2;
  ctx.save(); ctx.shadowColor = "rgba(0,0,0,.8)"; ctx.shadowBlur = 12;
  txt("CLOSING TIME", cx, H * 0.32, 60, COL.cheese, "center", 800); ctx.restore();
  txt(SCHOOL ? "the whole school got fed." : "the diner survived the day.", cx, H * 0.32 + 40, 22, COL.cream, "center", 600);
  txt("FINAL SCORE  " + String(totalScore()).padStart(6, "0"), cx, H * 0.54, 30, COL.good, "center", 800);
  txt("you carried Billy through all " + CAMP.SHIFTS.length + " shifts.", cx, H * 0.54 + 32, 16, COL.dim, "center", 600);
  if (Math.floor(blink * 1.6) % 2 === 0) txt("press any button", cx, H * 0.72, 20, COL.amber, "center", 800);
  txt("for Christine & Phillip Coleman", cx, H - 22, 14, COL.dim, "center", 600);
}
// ---------- HIGH-SCORE INITIALS ENTRY (classic 3-letter arcade) ----------
function drawInitials() {
  ctx.fillStyle = "rgba(8,5,4,0.92)"; ctx.fillRect(0, 0, W, H);
  const cx = W / 2;
  txt("NEW HIGH SCORE!", cx, H * 0.22, 34, COL.cheese, "center", 800);
  txt(String(entryScore).padStart(6, "0") + " pts", cx, H * 0.22 + 32, 20, COL.good, "center", 700);
  txt("ENTER YOUR INITIALS", cx, H * 0.42, 16, COL.dim, "center", 700);
  const gap = 66, x0 = cx - gap, by = H * 0.52;
  for (let i = 0; i < 3; i++) {
    const x = x0 + i * gap, sel = i === entryPos;
    if (sel) { ctx.fillStyle = "rgba(255,210,63,.14)"; ctx.fillRect(x - 27, by - 42, 54, 70);
      txt("▲", x, by - 30, 16, COL.amber, "center", 800); txt("▼", x, by + 40, 16, COL.amber, "center", 800); }
    txt(ENTRY_CH[entryName[i]], x, by + 10, 46, sel ? COL.cheese : COL.cream, "center", 800);
  }
  txt("↑ ↓ letter    ← → move    SPACE = set", cx, H * 0.70, 15, COL.dim, "center", 600);
}
// ---------- THE HIGH-SCORE BOARD ----------
function drawBoard() {
  ctx.fillStyle = "rgba(8,5,4,0.93)"; ctx.fillRect(0, 0, W, H);
  const cx = W / 2;
  const lh = SCHOOL ? 0 : drawLogo(cx, H * 0.035, 280, "cream");
  if (lh) txt("HIGH SCORES", cx, H * 0.035 + lh + 16, 22, COL.amber, "center", 800);
  else txt(SCHOOL ? "HEROES — TOP LUNCH HEROES" : "PATTY MELT — HIGH SCORES", cx, H * 0.15, 30, COL.cheese, "center", 800);
  const n = Math.min(scores.length, pm.HISCORE_N), top = H * 0.25, rh = (H * 0.60) / n;
  for (let i = 0; i < n; i++) {
    const y = top + i * rh + rh * 0.72, hot = i === entryRank, c = hot ? COL.cheese : COL.cream;
    txt(String(i + 1).padStart(2), cx - 230, y, 22, hot ? COL.amber : COL.dim, "right", 700);
    txt(scores[i][0], cx - 165, y, 24, c, "left", 800);
    txt(String(scores[i][1]).padStart(6, "0"), cx + 230, y, 24, c, "right", 800);
  }
  if (Math.floor(blink * 1.6) % 2 === 0) txt("press any button", cx, H - 28, 18, COL.amber, "center", 800);
}
// ---------- BACK-OF-HOUSE BONUS render (FREEZER cool-blue / BASEMENT hot-red; port of cabinet.renderMini) ----------
function drawMini(s) {
  if (!s) return;
  const c = s.cfg, chill = c.mood === "chill", accent = chill ? "#6fd0e8" : COL.bad;
  const g = ctx.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, chill ? "#0c1a22" : "#1f0d0a"); g.addColorStop(1, "#0a0806");
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  txt(c.name, W / 2, 74, 44, accent, "center", 800);
  txt(c.flavor, W / 2, 104, 18, COL.cream, "center", 600);
  const quota = c.quota ? "/" + c.quota : "", secs = Math.max(0, Math.ceil(s.t_left / pm.TPS));
  txt("TIME " + secs + "s", 40, 144, 20, secs <= 3 && !s.done ? COL.bad : COL.cream, "left", 700);
  txt("CAUGHT " + s.caught + quota, W / 2, 144, 20, c.quota && s.caught >= c.quota ? COL.good : COL.cream, "center", 700);
  txt("BONUS " + String(s.score).padStart(5, "0"), W - 40, 144, 20, COL.cheese, "right", 700);
  const gx0 = 96, gw = W - 192, laneW = gw / pm.MINI_LANES;
  const gy0 = 182, gh = H - 300, rowH = gh / pm.MINI_ROWS;
  const laneX = (l) => gx0 + l * laneW + laneW / 2, rowY = (r) => gy0 + r * rowH + rowH / 2;
  ctx.strokeStyle = "rgba(255,255,255,0.06)"; ctx.lineWidth = 1;
  for (let l = 0; l <= pm.MINI_LANES; l++) { ctx.beginPath(); ctx.moveTo(gx0 + l * laneW, gy0); ctx.lineTo(gx0 + l * laneW, gy0 + gh); ctx.stroke(); }
  for (const it of s.items) {
    const x = laneX(it[0]), y = rowY(it[1]), bw = laneW * 0.56, bh = rowH * 0.56;
    ctx.fillStyle = accent; ctx.fillRect(x - bw / 2, y - bh / 2, bw, bh);
    ctx.strokeStyle = "rgba(255,255,255,0.28)"; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(x - bw / 2, y); ctx.lineTo(x + bw / 2, y);
    ctx.moveTo(x, y - bh / 2); ctx.lineTo(x, y + bh / 2); ctx.stroke();
  }
  const catchRow = chill ? pm.MINI_ROWS - 1 : 0, cxp = laneX(s.cart), cyp = rowY(catchRow), cw = laneW * 0.82;
  ctx.fillStyle = COL.cheese; ctx.fillRect(cxp - cw / 2, cyp - 13, cw, 26);
  txt(chill ? "▲" : "▼", cxp, cyp + 7, 18, "#3a2a08", "center", 800);
  if (s.done) txt(s.score > 0 ? "STOCKED!  +" + s.score + " — press SPACE" : "FORFEIT — press SPACE",
      W / 2, gy0 + gh + 40, 24, s.score > 0 ? COL.good : COL.bad, "center", 800);
  else { if (s.flash) txt(s.flash, W / 2, gy0 + gh + 20, 20, COL.cheese, "center", 800);
    txt(chill ? "◀ ▶  catch what falls — pure bonus, no fail" : "◀ ▶  grab the backlog — clear the quota or forfeit",
        W / 2, gy0 + gh + 44, 15, COL.dim, "center", 600); }
}

// ---------- input — the 2-way stick + buttons (HEY BILLY is the star) ----------
addEventListener("keydown", (e) => {
  const k = e.key.toLowerCase();
  wakeAudio();                                     // first keypress arms WebAudio
  if (k === "s") { audio.setMuted(!audio.muted); return; }   // S = speaker toggle (mute)
  if (phase === "attract") { startGame(); e.preventDefault(); return; }   // START — any key begins the campaign
  if (phase === "ready") { e.preventDefault(); return; }                  // GET READY — inputs locked till GO!
  if (phase === "won_campaign") { submitRun(); e.preventDefault(); return; }   // campaign clear — score entry then title
  if (phase === "battle_over") { toAttract(); e.preventDefault(); return; }    // grill-off decided — back to the title
  if (phase === "initials") {                    // arcade initials entry: ↑↓ letter · ←→ position · SPACE/ENTER confirm
    if (k === "arrowup" || k === "w") entryName[entryPos] = (entryName[entryPos] + 1) % ENTRY_CH.length;
    else if (k === "arrowdown" || k === "s") entryName[entryPos] = (entryName[entryPos] + ENTRY_CH.length - 1) % ENTRY_CH.length;
    else if (k === "arrowleft" || k === "a") entryPos = Math.max(0, entryPos - 1);
    else if (k === "arrowright" || k === "d") entryPos = Math.min(2, entryPos + 1);
    else if (k === " " || k === "enter" || k === "f") { if (entryPos < 2) entryPos++; else finalizeEntry(); }
    e.preventDefault(); return;
  }
  if (phase === "board") { toAttract(); e.preventDefault(); return; }          // high-score table → back to the title
  if (phase === "bonus") {                        // back-of-house: drive the cart under the falling stock
    if (mini.done) { if (k === " " || k === "enter" || k === "f") endBonus(); }   // bank + on to the next shift
    else if (k === "arrowleft" || k === "a" || k === "j") pm.mini_move(mini, -1);
    else if (k === "arrowright" || k === "d" || k === "l") pm.mini_move(mini, 1);
    e.preventDefault(); return;
  }
  if (k === "r") { BATTLE ? startBattle() : startShift(shiftIdx); return; }    // rematch / retry THIS shift
  if (k === "p") { paused = !paused; return; }
  if (game.over) { if (BATTLE) return; if (continueT > 0) billyBack(); else submitRun(); return; }   // (battle end = the clock)
  if (game.won && (k === " " || k === "enter")) { nextShift(); return; }   // ROUND CLEAR → next shift (or campaign complete)
  // P1 (PATTY): arrows / a,d + f,c,x + space/v HEY BILLY
  if (k === "arrowleft" || k === "a") pm.move(game, -1, 0);
  else if (k === "arrowright" || k === "d") pm.move(game, 1, 0);
  else if (k === "f") pm.flip(game, 0);
  else if (k === "c") pm.add_cheese(game, 0);
  else if (k === "x") pm.toast(game, 0);
  else if (k === " " || k === "v" || k === "b") pm.hey_billy(game, 0);
  // P2 (CHRISSY, co-op): j,l + i,k,. + m HEY BILLY (engine no-ops these in 1P)
  else if (k === "j") pm.move(game, -1, 1);
  else if (k === "l") pm.move(game, 1, 1);
  else if (k === "i") pm.flip(game, 1);
  else if (k === "k") pm.add_cheese(game, 1);
  else if (k === ".") pm.toast(game, 1);
  else if (k === "m") pm.hey_billy(game, 1);
  // CO-OP teamwork: HANDOFF (pass to partner's half) + DROP (sacrifice a jammed slot)
  else if (k === "g") pm.handoff(game, 0);
  else if (k === "t") pm.drop(game, 0);
  else if (k === "u") pm.handoff(game, 1);
  else if (k === "o") pm.drop(game, 1);
  else return;
  actionSfx();                                     // singing-spatula FLIP / cheese fwump / toast / HEY BILLY holler
  e.preventDefault();
}, { passive: false });

// QA/attract pre-roll: ?warm=N runs N sim steps synchronously so a screenshot shows a live room
// (headless rAF virtual-time barely advances the accumulator). Mirrors cookoff.html's ?warm.
const WARM = parseInt(Q.get("warm") || "0", 10);
for (let i = 0; i < WARM && !(game.over || game.won); i++) step();
billyPos = billyTarget();                 // snap him into place so frame 1 isn't mid-walk

requestAnimationFrame(loop);
</script>
