    page: "meltdome.html", desc: ["Two flat-tops side by side, one screen.", "Most CLEAN service at the bell wins.", "P1 A/D·F/C/V  ·  P2 J/L·I/K/M"], q: {} },

// other pick writes its value into the launch URL. In memory + the launch URL only (nothing stored).
//   BREAD (solo, ?breadload): the % of orders that NAME a bread; the rest get the kitchen's HOUSE bun (PM-4114 ladder)

const BREADLOADS = [["50", "EASY — 50% NAME A BREAD"], ["", "★ NORMAL — 85% NAME A BREAD"], ["100", "HARD — EVERY ORDER NAMES A BREAD"]];
const COOPKS = [["100", "RELAXED — 100% OF THE CROWD"], ["110", "EASY — 110% OF THE CROWD"], ["", "★ NORMAL — 125% OF THE CROWD"], ["135", "HARD — 135% OF THE CROWD"]];

const DEF_I = (a) => a.findIndex((o) => o[0] === "");   // the default's index in a ladder
const isSolo = (m) => !m.page && !m.battle && (m.players || 1) === 1, isCoop = (m) => m.id === "coop";
const NROWS = 7;   // the mode list + EDITION · DEMAND · SCREENS · LENGTH · DIFFICULTY (BREAD solo | CO-OP DEMAND) · PLATES

let sel = 0, row = 0, ed = (Q.get("skin") || "school") === "diner" ? 1 : 0, dem = 0, scr = 0, len = 0, bl = DEF_I(BREADLOADS), ck = DEF_I(COOPKS), dl = DEF_I(DEALS);

function go(s) { state = s; t0 = now(); idleT = now(); if (s !== "attract") stopDemo(); if (s === "attract") { att = { i: 0, t: now() }; } }

  if (state === "results") { if (a === "ok") { if (leaving) return; leaving = true; audio.ui("lock"); audio.scene("launch"); setTimeout(() => { location.href = launchUrl(); }, 380); } else if (a === "back" || a === "alt") { audio.ui("back"); go("menu"); } return; }

}
addEventListener("keydown", (e) => {
