<!DOCTYPE html>
<!-- PATTY MELT — THE FRONT DOOR (3D EDITION).  *** for Christine & Phillip Coleman. ***
     The shell around the game: SPLASH (Castle Grillscreen ident) → TITLE → MODE MENU → the game (kitchen.html?shell=1)
     → RESULTS → menu. Idle on the title or menu → the ATTRACT loop (cast cut-ins · how-to · a LIVE demo of the real
     engine · high scores). Presentation only: every mode is the parity-locked engine in kitchen.html.
       ?attract  open straight into the attract loop (a cabinet left idle)      ?skin=school|diner  the edition
       ?cast=ink try the inked cast first (lib/cast.js)                           ?results=<json>     the results screen
     Keys: ◄ ► ▲ ▼ / WASD move · SPACE / ENTER / F select · ESC back · S sound. Any pad works the same.       -->
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>PATTY MELT — 3D EDITION</title>
<style>
  html,body{margin:0;height:100%;background:#07040a;overflow:hidden;font-family:"Saira Condensed","Arial Narrow",sans-serif;}
  #stage{position:absolute;left:50%;top:50%;width:1280px;height:720px;transform-origin:0 0;}
  canvas{position:absolute;inset:0;width:100%;height:100%;display:block;}
  #demo{position:absolute;left:80px;top:72px;width:1120px;height:525px;border:0;display:none;background:#000;pointer-events:none;
    box-shadow:0 0 0 4px #ffd23f,0 0 0 9px #140806,0 18px 60px #000;}
</style>
</head>
<body>
<div id="stage"><canvas id="cv" width="1280" height="720"></canvas><iframe id="demo" title="live demo" tabindex="-1"></iframe></div>
<script src="engine.js"></script>
<script src="lib/hidpi.js?v=1"></script>
<script src="lib/signs.js?v=1"></script>
<script src="lib/audio.js?v=1"></script>
<script src="lib/ghost.js?v=1"></script>
<script src="lib/cast.js?v=2"></script>
<script src="lib/cine.js?v=2"></script>
<script src="../assets/art3d/stages/stages.manifest.js"></script>
<script src="lib/stages3d.js?v=3"></script>
<script>
"use strict";
const Q = new URLSearchParams(location.search);
const W = 1280, H = 720, cv = document.getElementById("cv"), ctx = cv.getContext("2d"), stage = document.getElementById("stage"), demoEl = document.getElementById("demo");
function fit() { const k = Math.min(innerWidth / W, innerHeight / H); stage.style.transformOrigin = "50% 50%"; stage.style.transform = `translate(-50%,-50%) scale(${k})`; }
addEventListener("resize", fit); fit();
if (globalThis.PMHiDPI) PMHiDPI.setup(cv, W, H);   // (1112 art pass) device-res backing store; the stage still scales the 1280×720 layout
const FX = PMCine._fx, NEON = PMCine.NEON;
const COLS = { diner: { a: "#c8302a", b: "#ffd23f", deep: "#3a0c08", cream: "#f3e6c8" }, school: { a: "#1f3a63", b: "#f2c230", deep: "#0b1830", cream: "#f3e6c8" } };
const P1 = "#ff5a4d", P2 = "#6fb0e0";
const img = (src) => { const i = new Image(); i.src = src; return i; };
const ART = { ident: img("../assets/logo/ident-grillscreen.png"), identF: img("../assets/logo/ident-grillscreen-flames.png"),
  logoD: img("../assets/logo/patty-melt-logo-color.png"), logoH: img("../assets/logo/heroes-logo.png"),
  bgD: img("../assets/art3d/kitchen-steaming.webp"), bgH: img("../assets/art3d/heroes/kitchen-steaming.webp"),
  dinD: img("../assets/sprites/dining/diner-room.png"), dinH: img("../assets/art3d/heroes/cafeteria.webp"),
  // (1110 r4) THE TITLE IN THE 3D KITCHEN: a 1280×720 Blender shot of each line (kitchen_set --shots title / heroes_set
  // --cam heroes_title), no cooks — the cast is drawn over it. Missing → the old kitchen|dining composite.
  // (1110 r4) the 3D title shots load only once the stages manifest lists them (no 404s before the render lands)
  titleD: ((globalThis.ART3D_STAGES || {}).title || {}).diner ? img("../assets/art3d/" + ART3D_STAGES.title.diner) : null,
  titleH: ((globalThis.ART3D_STAGES || {}).title || {}).heroes ? img("../assets/art3d/" + ART3D_STAGES.title.heroes) : null };
if (globalThis.PMStages) PMStages.load("../assets/art3d/stages/");   // the 3D food ladder for the HOW TO COOK card
const ok = (i) => !!(i && i.complete && i.naturalWidth);
const audio = new PMAudio.AudioBus(); const wake = () => { audio.ensure(); audio.resume(); };

// ---------- THE MODES (each = one launch of the parity-locked engine in kitchen.html) ----------
const MODES = [
  { id: "campaign", name: "THE CAMPAIGN", tag: "1UP · 7 SHIFTS · 11 AM TO CLOSE ON THE CLOCK", cast: ["patty", "cheer"], screens: 1,
    desc: ["One day at the diner, open to last call:", "each shift runs to its closing time on the clock.", "Survive the rush. Bonus rounds in the back."], q: {} },
  { id: "coop", name: "CO-OP KITCHEN", tag: "2UP · PATTY + CHRISSY · ONE BILLY", cast: ["chrissy", "cheer"], screens: 2, players: 2,
    desc: ["One grill split down the middle — Patty left, Chrissy right.", "One Billy: holler him to YOUR half.", "P2 = J/L · I flip · K cheese · . toast · M Billy"], q: { players: "2" } },
  { id: "battle", name: "MELTDOME", tag: "2UP VERSUS · 90s GRILL-OFF", cast: ["chrissy", "flip"], screens: 2, players: 2, battle: true,
    desc: ["Same grill, same Billy — most CLEAN orders at the bell wins.", "Steal Billy's attention. Don't burn the line.", "Pure merit. No sabotage (yet)."], q: { battle: "" } },
  // (1112) SPEED BATTLE — the 1-minute flip/serve duel vs Chrissy, two stackers, sudden death, best of 3/5 (own page)
  { id: "speed", name: "SPEED BATTLE", tag: "PATTY vs CHRISSY · 1-MIN FLIP-OFF · SUDDEN DEATH", cast: ["chrissy", "cheer"], players: 2, battle: true,
    page: "speedbattle.html", desc: ["Mirrored grills. PERFECT = 3, GOOD = 2, OK = 1.", "Your stacker towers every burger you serve.", "Tied at the bell? Next PERFECT wins."], q: {} },
  { id: "jailbreak", name: "THE POP-UP", tag: "JAILBREAK · THE FULL MENU FROM SHIFT 1", cast: ["patty", "serve"], screens: 2,
    desc: ["Burgers, patty melts, grilled cheese — all at once.", "The toaster is its own clock.", "The deep end."], q: { items: "full" } },
  { id: "weeds", name: "STRAIGHT TO THE WEEDS", tag: "FEEL TEST · SHIFT 6 THE BLAST", cast: ["billy", "slack"], screens: 1,
    desc: ["Skip the teaching — drop into THE BLAST (8 PM).", "This is the playtest question:", "does waiting for RDY under pressure feel good?"], q: { shift: "6" } },
  { id: "rear", name: "COOKS FROM BEHIND", tag: "EXPERIMENT · THE REAR-VIEW COOKS", cast: ["patty", "idle"], screens: 1,
    desc: ["The campaign with the cooks' backs to you —", "the floating pair does the work.", "(Joe's cheat-the-flip test.)"], q: { cooks: "rear" } },
  // (1110 r4) the two other 2UP views, in the 3D look (their own pages, ?art=3d&shell=1 → back here at the bell / ESC)
  { id: "dome2", name: "MELTDOME — SIDE BY SIDE", tag: "2UP VERSUS · BOTH FLAT-TOPS · 90s TO THE BELL", cast: ["chrissy", "flip"], players: 2, battle: true,
    page: "meltdome.html", desc: ["Two flat-tops side by side, one screen.", "Most CLEAN service at the bell wins.", "P1 A/D·F/C/V  ·  P2 J/L·I/K/M"], q: {} },
  { id: "tag", name: "TAG TEAM", tag: "CO-OP HOT SEAT · ONE GRILL · PASS THE SPATULA", cast: ["chrissy", "cheer"], players: 2,
    page: "handoff.html", desc: ["One grill, one spatula pair, two cooks.", "In the weeds? H tags your partner in.", "The full menu — buns, melts, grilled cheese."], q: { items: "full" } },
];
const EDITIONS = [["school", "HEROES — THE CAFETERIA"], ["diner", "THE DINER"]];
const DEMANDS = [["", "AS AUTHORED"], ["kids", "KIDS — UNLOSEABLE"], ["arcade", "ARCADE — QUARTER-EATER"]];
const SCREENS = [["", "BEST FOR THE MODE"], ["1", "ONE SCREEN"], ["2", "TWO SCREENS — KITCHEN | DINING"]];
// (1112) LENGTH — the GAME CLOCK scale for the day (campaign.js LENGTHS); on SPEED BATTLE it is the round clock
const LENGTHS = [["", "FULL DAY — 1 MIN PER HOUR", "60", "1 MINUTE ROUNDS"], ["quick", "QUICK — 30 S PER HOUR", "120", "2 MINUTE ROUNDS"],
                 ["long", "LONG HAUL — 2 MIN PER HOUR", "180", "3 MINUTE ROUNDS"]];
const NROWS = 5;   // the mode list + EDITION · DEMAND · SCREENS · LENGTH
let sel = 0, row = 0, ed = (Q.get("skin") || "school") === "diner" ? 1 : 0, dem = 0, scr = 0, len = 0;
{ const s = (Q.get("sel") || "").split(","); if (s.length >= 4) { sel = +s[0] || 0; ed = +s[1] || 0; dem = +s[2] || 0; scr = +s[3] || 0; len = +s[4] || 0; } }
const selStr = (i) => [i, ed, dem, scr, len].join(",");
const skin = () => EDITIONS[ed][0];
function launchUrl(i = sel) {
  const m = MODES[i], p = new URLSearchParams({ art: "3d", shell: "1" });
  if (m.page) {   // a view with its own page (diner set; no screens / edition choice): the demand dial still applies
    for (const [k, v] of Object.entries(m.q)) p.set(k, v);
    if (DEMANDS[dem][0]) p.set("mode", DEMANDS[dem][0]);
    if (m.id === "speed") p.set("secs", LENGTHS[len][2]);
    p.set("label", m.name); p.set("sel", selStr(i)); return m.page + "?" + p.toString(); }
  const sc = SCREENS[scr][0] || String(m.screens); p.set("screens", m.battle ? "2" : sc);
  if (skin() === "school") p.set("skin", "school");
  for (const [k, v] of Object.entries(m.q)) p.set(k, v);
  if (DEMANDS[dem][0] && !m.battle) p.set("mode", DEMANDS[dem][0]);
  if (LENGTHS[len][0] && !m.battle) p.set("length", LENGTHS[len][0]);
  if (PMCast.ink) p.set("cast", "ink");
  p.set("label", m.name); p.set("sel", selStr(i));
  return "kitchen.html?" + p.toString().replace("battle=&", "battle&").replace(/battle=$/, "battle");
}
function launch() { audio.win && audio.win(); state = "launch"; t0 = now(); setTimeout(() => { location.href = launchUrl(); }, 420); }

// ---------- the state machine ----------
const now = () => performance.now();
let state = "splash", t0 = now(), idleT = now(), results = null;
if (Q.get("results")) { try { results = JSON.parse(Q.get("results")); state = "results"; } catch (e) {} }
else if (Q.has("attract")) state = "attract";
else if (Q.has("menu") || Q.get("sel")) state = "menu";
let att = { i: 0, t: now() };
const ATTRACT = [["cast", "patty", 3000], ["cast", "chrissy", 2600], ["cast", "billy", 2600], ["howto", "", 5200], ["demo", "", 16000], ["scores", "", 4600], ["title", "", 4200]];
function go(s) { state = s; t0 = now(); idleT = now(); if (s !== "attract") stopDemo(); if (s === "attract") { att = { i: 0, t: now() }; } }
function skipTo(name) { const i = ATTRACT.findIndex((a) => a[0] === name); if (i >= 0) { att = { i, t: now() }; } }
function startDemo() { if (demoEl.style.display === "block") return;
  demoEl.src = "kitchen.html?demo&art=3d&shell=demo&screens=2&shift=6&warm=150" + (skin() === "school" ? "&skin=school" : "") + (PMCast.ink ? "&cast=ink" : ""); demoEl.style.display = "block"; }
function stopDemo() { if (demoEl.style.display !== "none") { demoEl.style.display = "none"; demoEl.src = "about:blank"; } }
function demoAlive() { try { return !!demoEl.contentWindow.eval("typeof game === 'object' && game.ticks > 0 && phase === 'play'"); } catch (e) { return false; } }
PMCine.init({ W, H, skin: skin(), screens: 2, kit: { x: 0, y: 0, w: 640, h: H }, din: { x: 640, y: 0, w: 640, h: H } });
PMCast.preload("school"); PMCast.preload("diner");

// ---------- input: keyboard + pads + mouse (one action vocabulary) ----------
function act(a) {
  wake(); idleT = now();
  if (state === "splash") return go("title");
  if (state === "attract") return go("title");
  if (state === "title") { if (a === "ok") { audio.bell && audio.bell(2); go("menu"); } else if (a === "left" || a === "right") { ed = 1 - ed; PMCine.init({ skin: skin() }); audio.spatula(); } return; }
  if (state === "results") { if (a === "ok") { location.href = launchUrl(); } else if (a === "back" || a === "alt") go("menu"); return; }
  if (state !== "menu") return;
  if (a === "back") return go("title");
  if (a === "up") { if (row > 0) row--; else sel = (sel + MODES.length - 1) % MODES.length; audio.spatula(); }
  else if (a === "down") { if (row > 0) row = (row + 1) % NROWS; else sel = (sel + 1) % MODES.length; audio.spatula(); }
  else if (a === "tab") { row = (row + 1) % NROWS; audio.spatula(); }
  else if (a === "left" || a === "right") { const d = a === "left" ? -1 : 1;
    if (row === 0) { sel = (sel + MODES.length + d) % MODES.length; }
    else if (row === 1) { ed = (ed + EDITIONS.length + d) % EDITIONS.length; PMCine.init({ skin: skin() }); }
    else if (row === 2) dem = (dem + DEMANDS.length + d) % DEMANDS.length;
    else if (row === 3) scr = (scr + SCREENS.length + d) % SCREENS.length;
    else len = (len + LENGTHS.length + d) % LENGTHS.length; audio.spatula(); }
  else if (a === "ok") { if (row === 0) launch(); else row = 0; }
}
addEventListener("keydown", (e) => {
  const k = e.key.toLowerCase();
  if (k === "s" && state !== "menu") { audio.setMuted(!audio.muted); return; }
  const map = { arrowup: "up", w: "up", arrowdown: "down", arrowleft: "left", a: "left", arrowright: "right", d: "right", " ": "ok", enter: "ok", f: "ok", escape: "back", backspace: "back", tab: "tab", r: "alt" };
  act(map[k] || "any"); e.preventDefault();
});
cv.addEventListener("pointerdown", (e) => { const r = cv.getBoundingClientRect(), x = (e.clientX - r.left) * W / r.width, y = (e.clientY - r.top) * H / r.height;
  if (state === "menu") { for (let i = 0; i < MODES.length; i++) { const ry = 150 + i * 58; if (x > 60 && x < 560 && y > ry && y < ry + 56) { if (sel === i && row === 0) return act("ok"); sel = i; row = 0; audio.spatula(); return; } }
    for (let r2 = 1; r2 < 4; r2++) { const ry = 560 + (r2 - 1) * 40; if (x > 620 && x < 1220 && y > ry - 26 && y < ry + 10) { row = r2; return act(x > 920 ? "right" : "left"); } } return; }
  if (state === "results") return act(x < W / 2 ? "ok" : "alt");
  act("ok"); });
const padPrev = [];
function pollPads() {
  let pads = []; try { pads = navigator.getGamepads ? [...navigator.getGamepads()] : []; } catch (e) {}
  pads.forEach((gp, pi) => { if (!gp) return; const pv = padPrev[pi] || (padPrev[pi] = { b: [], x: 0, y: 0 });
    const g = Ghost.read(gp);
    if (g.x !== pv.x && g.x !== 0) act(g.x < 0 ? "left" : "right");
    if (g.y !== pv.y && g.y !== 0) act(g.y < 0 ? "up" : "down");
    pv.x = g.x; pv.y = g.y;
    for (let i = 0; i < gp.buttons.length; i++) { const p = Ghost.btn(gp, i) || (gp.buttons[i] && gp.buttons[i].value > 0.5);
      if (p && !pv.b[i]) act(i === 1 ? "back" : i === 8 ? "back" : "ok"); pv.b[i] = p; } });
}

// ---------- drawing ----------
function T(s, x, y, px, fill, al = "center", lw = 0, maxW = 0) { ctx.save(); FX.text(ctx, s, x, y, px * 600 / 720, fill, al, "#000", lw, maxW); ctx.restore(); }
function bgPlate(t, dim = 0.55) {   // the 3D kitchen at rest, slow Ken Burns
  const C = COLS[skin()], im = skin() === "school" ? ART.bgH : ART.bgD, im2 = skin() === "school" ? ART.dinH : ART.dinD;
  ctx.fillStyle = C.deep; ctx.fillRect(0, 0, W, H);
  const k = 1.08 + 0.05 * Math.sin(t / 9000);
  if (ok(im)) { ctx.save(); ctx.translate(W * 0.25, H / 2); ctx.scale(k, k); ctx.drawImage(im, -W * 0.25 - 4, -H / 2, W / 2 + 8, H); ctx.restore(); }
  if (ok(im2)) { ctx.save(); ctx.translate(W * 0.75, H / 2); ctx.scale(k, k); const r = im2.naturalWidth / im2.naturalHeight, hh = H, ww = Math.max(W / 2, hh * r);
    ctx.drawImage(im2, -ww / 2, -hh / 2, ww, hh); ctx.restore(); }
  ctx.fillStyle = `rgba(8,4,14,${dim})`; ctx.fillRect(0, 0, W, H);
  const vg = ctx.createRadialGradient(W / 2, H / 2, H * 0.3, W / 2, H / 2, W * 0.75); vg.addColorStop(0, "rgba(0,0,0,0)"); vg.addColorStop(1, "rgba(0,0,0,.7)");
  ctx.fillStyle = vg; ctx.fillRect(0, 0, W, H);
}
function titlePlate(t, dim = 0.32) {   // (1110 r4) the title shot IN the 3D kitchen, full bleed, slow push; else bgPlate
  const im = skin() === "school" ? ART.titleH : ART.titleD;
  if (!ok(im)) return bgPlate(t, 0.5);
  const k = 1.04 + 0.04 * Math.sin(t / 9000), dx = 18 * Math.sin(t / 13000);
  ctx.save(); ctx.translate(W / 2 + dx, H / 2); ctx.scale(k, k); ctx.drawImage(im, -W / 2, -H / 2, W, H);
  if (skin() === "school" && globalThis.PMSigns) PMSigns.draw(ctx, "heroes_title", { x: -W / 2, y: -H / 2, w: W, h: H });   // (1112) re-lettered plates
  ctx.restore();
  const g = ctx.createLinearGradient(0, 0, W, 0); g.addColorStop(0, `rgba(8,4,14,${dim + 0.35})`); g.addColorStop(0.45, `rgba(8,4,14,${dim})`); g.addColorStop(1, `rgba(8,4,14,${dim * 0.6})`);
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  const vg = ctx.createRadialGradient(W / 2, H / 2, H * 0.3, W / 2, H / 2, W * 0.75); vg.addColorStop(0, "rgba(0,0,0,0)"); vg.addColorStop(1, "rgba(0,0,0,.6)");
  ctx.fillStyle = vg; ctx.fillRect(0, 0, W, H);
}
function logo(cx, y, w) {
  if (skin() === "school" && ok(ART.logoH)) { const sw = ART.logoH.naturalWidth * 0.64,   /* (1112) x>0.64 = the OLD Patty's spatula */ sh = ART.logoH.naturalHeight, h = w * sh / sw;
    ctx.drawImage(ART.logoH, 0, 0, sw, sh, cx - w / 2, y, w, h); return h; }
  if (ok(ART.logoD)) { const h = w * ART.logoD.naturalHeight / ART.logoD.naturalWidth;
    ctx.save(); ctx.shadowColor = "rgba(255,240,200,.9)"; ctx.shadowBlur = 18; ctx.drawImage(ART.logoD, cx - w / 2, y, w, h); ctx.restore(); return h; }
  T("PATTY MELT", cx, y + 80, 90, "#ffd23f", "center", 10); return 100;
}
const hero = (who, pose) => PMCast.hero(skin() === "school" ? "school" : "diner", who, pose);
// (1112) each edition shows ITS OWN Patty now that Joe painted the DINER Patty (white/red waitress, paper hat): HEROES
// Patty no longer headlines the diner door. Diner Chrissy/Billy = paint-overs of the HEROES paintings (1112).
const heroH = (who, pose) => hero(who, pose);
function blink(t, hz = 1.6) { return Math.floor(t / 1000 * hz) % 2 === 0; }

function drawSplash(t) {      // the Castle Grillscreen ident: Ken Burns push, flames flicker in, flash to the title
  ctx.fillStyle = "#000"; ctx.fillRect(0, 0, W, H);
  const u = Math.min(1, t / 2600), k = 1.18 - 0.12 * FX.ease(u), a = FX.seg(t, 0, 500) * (1 - FX.seg(t, 2300, 2700));
  ctx.save(); ctx.globalAlpha = a; ctx.translate(W / 2, H / 2); ctx.scale(k, k);
  const im = (t > 900 && Math.sin(t / 70) > -0.6 && ok(ART.identF)) ? ART.identF : ART.ident;
  if (ok(im)) { const r = im.naturalWidth / im.naturalHeight, h = H, w = h * r; ctx.drawImage(im, -w / 2, -h / 2, w, h); }
  ctx.restore();
  FX.flash(ctx, FX.seg(t, 2450, 2650) * (1 - FX.seg(t, 2650, 2900)) * 0.9, "#fff");
  if (t > 2900) go("title");
}
function drawTitle(t, attractMode = false) {
  const C = COLS[skin()];
  titlePlate(t);
  FX.speedLines(ctx, W * 0.3, H * 0.58, H * 0.2, W * 0.9, 56, t, [NEON.pink, NEON.cyan, NEON.violet, C.b], 0.20, 2);
  FX.slashBand(ctx, H * 0.63, H * 0.42, H * 0.05, 1, "rgba(0,0,0,0.0)", C.b);
  FX.halftone(ctx, 0, H * 0.42, W, H * 0.44, C.b, 0.06, 16);
  { const bw = 560, by = H * 0.6 - 34, bh = H * 0.74 - by, g = ctx.createLinearGradient(W * 0.56 - bw / 2, 0, W * 0.56 + bw / 2, 0);   // (1112) a dark band
    g.addColorStop(0, "rgba(6,4,12,0)"); g.addColorStop(0.18, "rgba(6,4,12,.62)"); g.addColorStop(0.82, "rgba(6,4,12,.62)"); g.addColorStop(1, "rgba(6,4,12,0)");
    ctx.fillStyle = g; ctx.fillRect(W * 0.56 - bw / 2, by, bw, bh); }   // (under the cast) so the menu lines never sit on busy kitchen art
  const s1 = FX.squashAt(300, t, 0.2), s2 = FX.squashAt(600, t, 0.2), s3 = FX.squashAt(900, t, 0.2);
  const pIn = FX.outBack(FX.seg(t, 0, 380)), cIn = FX.outBack(FX.seg(t, 250, 650)), bIn = FX.outBack(FX.seg(t, 600, 1000));
  FX.drawCast(ctx, hero("chrissy", "cheer"), W * 0.79 + (1 - cIn) * W * 0.5, H * 1.01, H * 0.7, s2[1], s2[0] * PMCine.breathe("c"), true, P2, 0.95);
  FX.drawCast(ctx, hero("billy", "serve"), W * 0.6, H * 1.02 + (1 - bIn) * H * 0.5, H * 0.42, s3[1], s3[0], true, null);
  FX.drawCast(ctx, heroH("patty", "cheer"), W * 0.2 - (1 - pIn) * W * 0.5, H * 1.01, H * 0.88, s1[1], s1[0] * PMCine.breathe("p"), false, C.b);
  const lh = logo(W * 0.56, H * 0.06, skin() === "school" ? 560 : 600);
  T(skin() === "school" ? "THE 3D EDITION · THE CAFETERIA" : "THE 3D EDITION · THE DINER", W * 0.56, H * 0.06 + lh + 30, 26, C.cream, "center", 5);
