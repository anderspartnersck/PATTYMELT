<!-- PATTY MELT — KITCHEN + DINING ROOM.  *** for Christine & Phillip Coleman. ***
     ONE parity-proven game (engine.js) rendered across TWO views: the KITCHEN (the grill you play)
     and the DINING ROOM (the front of house). The trick: Billy's `billy` ATTENTION already IS his
     location — when it drains he wanders out to BUS TABLES in the dining room; "HEY BILLY!" walks him
     back to the kitchen PASS to expo finished orders. So the two-screen drama needs ZERO engine change
     (parity untouched) — the dining room is a pure render of state (orders / wait / combo / buried).
       ?screens=2  (default) two screens side by side  — the 2UP cab
       ?screens=1  one screen, dining as a strip below — the POP-UP 1up experiment ("does it port?")
       ?mode=kids|family|arcade   ?items=full (FULL MENU recipes — legal on 2up/jailbreak)            -->

<script>
"use strict";
const pm = globalThis.PM, S = pm.Stage;
// BREAD (1111): in a SERVICE game with bread pans every patty item waits for a toasted bun of its ticket's bread
// (engine: BREADS / ticket.bread); without them only the melts wait for rye, as before. One test for the whole page.
const breadOn = () => typeof game !== "undefined" && !!(game && game.service && game.cfg && game.cfg.bread && pm.BREADS);
const needsBunItem = (it) => breadOn() ? !pm.TOASTER_ITEMS.has(it) : pm.TOAST_ITEMS.has(it);   // (pm.needs_bun(s,p) is the engine's own test; same rule)
const BUN_ITEMS = { has: needsBunItem };
PMOrders.init(pm);
const Q = new URLSearchParams(location.search);
const SCREENS = Q.get("screens") === "1" ? 1 : 2;
const MODE = Q.get("mode") || "family";
const ITEMS = (Q.get("items") || "").toLowerCase() === "full" ? pm.ITEMS_FULL_MENU : null;
// MELTDOME (?battle or ?mode=meltdome): the FRIENDLY grill-off — the SAME shared grill + one Billy + one diner
// as co-op, but INDIVIDUAL scoring (pure merit, NO sabotage). Most CLEAN orders when the dinner bell rings wins.
const BATTLE = Q.has("battle") || (Q.get("mode") || "").toLowerCase() === "meltdome";
const BATTLE_SECS = Math.max(20, parseInt(Q.get("secs") || "90", 10));   // the service clock (?secs=)
const PLAYERS = BATTLE ? 2 : (Q.get("players") === "2" ? 2 : 1);   // battle is always 2 cooks; 2 = co-op tug-of-war
const GRILL = parseInt(Q.get("grill") || "6", 10);
// ?mode=kids|family|arcade — the DEMAND dial over the whole campaign (each shift keeps its quota/menu/clock, only its
// demand band is replaced). Presentation-side config of new_game's existing lever; no engine change. Absent = as authored.
const MODE_OVR = ["kids", "family", "arcade"].includes(String(Q.get("mode") || "").toLowerCase()) ? Q.get("mode").toLowerCase() : null;
// ?shell=1 — launched from the FRONT DOOR (front.html): skip this page's own title, and hand the run's result back to
// the shell's RESULTS screen at the end (Esc = back to the menu). ?shell=demo = the attract reel's live demo window.
const SHELL = Q.get("shell") || "";
if (SHELL === "demo") { const st = document.createElement("style"); st.textContent = "[class*=pm-order],[class*=pm-service]:not(body),aside{display:none!important}#frame,#cab{position:fixed!important;inset:0!important;right:0!important;background:#000!important}#wrap{position:fixed!important;inset:0!important;width:100vw!important;height:100vh!important;max-width:none!important;border:0!important;border-radius:0!important;box-shadow:none!important;aspect-ratio:auto!important}#tag{display:none}"; document.head.appendChild(st); }
// HEROES (school cafeteria) skin — base wired. ?skin=school, or auto on the 2up HEROES frame.
const SKIN = (Q.get("skin") || (Q.get("frame") === "2up-heroes" ? "school" : "diner")).toLowerCase();
const SCHOOL = SKIN === "school";
document.body.classList.toggle("school", SCHOOL);
// BUILD tag (?build=mark1) — the airy-engine generation; surfaced on screen, tab title + the deck strip.
// These open as DESKTOP modes (the big gingham deck) — NOT the tiny cab cutout — so they're easy to find
// while iterating, and read JAILBREAK (FULL MENU) out of the gate. (Joe, 2026-06-18.)
const BUILD = (Q.get("build") || "").toUpperCase();
const CAB_NAME = SCHOOL ? "PATTY MELT'S HEROES" : "PATTY'S POP-UP";
document.title = CAB_NAME + (BUILD ? " — " + BUILD : "") + " · JAILBREAK";
{ const tagEl = document.getElementById("tag");           // stamp the deck strip so the desktop build is findable
  if (tagEl && BUILD) tagEl.innerHTML =
    "<b style='color:#ffd27a'>" + CAB_NAME + " — " + BUILD + " · JAILBREAK</b> &nbsp;·&nbsp; " + tagEl.textContent; }
// EXPERIMENT (Joe's call): reuse the big HEROES KITCHEN scene as a DIM ambient backdrop behind the live
// grill (depth-stack trick) — heavily darkened so the live slots stay readable. If it reads cluttered,
// pull it (see docs/NEEDED_SPRITES.md for the clean per-state school grill surface to generate instead).
let heroBg = null;
// ?art=3d never shows this backdrop (the 3D school kitchen IS the room), and decoding + drawing the 6400×4267 PNG was the
// ~400 ms first frame Joe's HEROES profile caught — so under ?art=3d it is not loaded at all.
if (SCHOOL && (Q.get("art") || "").toLowerCase() !== "3d") { heroBg = new Image(); heroBg.src = "../assets/sprites/grill/bg-heroes-kitchen.png"; }
// TODO(next session): HEROES polish — (1) tune school GRILL SIZES per edition (cafeteria = bigger line?
//   the 1up arcade rule keeps school burger-only; 2up heroes can vary) — placeholder uses ?grill default 6.
//   (2) real student/lunch-lady sprites for the cafeteria regulars + a lunch-TRAY vessel under items
//   (placeholder: recolored diner bodies + the existing tray-school plate). (3) heroes food sprites if any.

const cv = document.getElementById("screen"); let ctx = cv.getContext("2d");   // (let: ?art=3d one-screen renders into an offscreen first)
// FRAMED cabs: drop the live two-screen render into the real 2up art's two cutouts (measured % of the
// 1024² render), with the lit Grillscreen FLAME flickering on top. ?frame=2up-diner|popup|heroes (2-screen only).
const FRAMES = {
  "2up-diner":  { art:"cab-2up-diner.png",  flame:"cab-2up-diner-flame.png",  rect:{ sl:30.2, st:40.7, sw:39.2, sh:22.0 } },
  "2up-popup":  { art:"cab-2up-popup.png",  flame:"cab-2up-popup-flame.png",  rect:{ sl:30.2, st:40.7, sw:39.2, sh:22.0 } },
  "2up-heroes": { art:"cab-2up-heroes.png", flame:"cab-2up-heroes-flame.png", rect:{ sl:33.5, st:37.3, sw:37.9, sh:19.1 } },
};
const FRAME = SCREENS === 2 ? FRAMES[(Q.get("frame") || "").toLowerCase()] : null;
const W = SCREENS === 2 ? 1280 : 720;
const H = FRAME ? Math.round(W * FRAME.rect.sh / FRAME.rect.sw) : 600;   // match the cutout aspect (no stretch)
cv.width = W; cv.height = H;
const SSK = globalThis.PMHiDPI ? PMHiDPI.setup(cv, W, H) : 1;   // (1112 art pass) device-res backing store; game code stays in W×H units
if (FRAME) {
  document.body.classList.add("framed");
  const cab = document.getElementById("cab"), art = document.getElementById("cabart"), flame = document.getElementById("cabflame");
  for (const [k, v] of Object.entries(FRAME.rect)) cab.style.setProperty("--" + k, v + "%");
  art.onload = () => { cab.style.aspectRatio = art.naturalWidth + "/" + art.naturalHeight; };
  art.src = "../assets/cab/" + FRAME.art;
  flame.src = "../assets/cab/" + FRAME.flame;
} else {
  document.getElementById("wrap").style.aspectRatio = W + "/" + H;
}

// the two view rects (layout-driven so one render serves both cabs)
const KIT = SCREENS === 2 ? { x:0, y:0, w:640, h:H } : { x:0, y:0, w:W, h:372 };
const DIN = SCREENS === 2 ? { x:640, y:0, w:640, h:H } : { x:0, y:372, w:W, h:H-372 };
// ---------- ?art=3d — THE 3D KITCHEN ART (render-only, behind a toggle; default stays the painted 2D art) ----------
// Built by the 3D PIPELINE (assets/art3d/, see art3d.js). Every draw reads engine state; nothing here writes it, so
// web/engine.js + parity never see it. 2-screen diner kitchen, 6-slot grill only — anything else falls back to 2D.
const ART3D_ON = (Q.get("art") || "").toLowerCase() === "3d";   // diner, HEROES (pass 3), co-op + the MeltDome battle (pass 4)
if (ART3D_ON && globalThis.ART3D) ART3D.load(SCHOOL ? "../assets/art3d/heroes/" : "../assets/art3d/");
if (ART3D_ON && globalThis.PMStages) PMStages.load("../assets/art3d/stages/");   // FREEZER / BASEMENT bonus plates (drawMini, 1280 + 720)
if (ART3D_ON && globalThis.PMStations) PMStations.init(SCHOOL ? "heroes" : "diner", "../assets/art3d/stations/");   // the rendered station loops (lib/stations.js)
// HEROES costume OPTIONS (Joe picks): ?costume=A Patty's gold captain apron · B Chrissy's red bandana · AB both
const COSTUME = (Q.get("costume") || "").toUpperCase();
function art3d() { return ART3D_ON && globalThis.ART3D && ART3D.ready && game && game.slots.length === 6; }
const FLIP_FRAMES = 8, FLIP_HOLD_MS = 1000 / 12;   // 8 drawings held "on twos" at 24fps = 12 changes/s (~0.67s)
const flipAnim = [], burntAnim = [];
const BILLY_3D_SCALE = 2.0;                         // Billy at 2x true scale on the dining camera (readable; tune here)
let bellT = -1e9, _br_last = 0;                                // per slot: performance.now() when the engine flipped it

// ---------- AIRY SPATULA GLIDE (the new engine feel) + the SPATULA SPRITE SEAM ----------
// Render-only air-cushion spring (lineage: cabinet.html springCursors → HIGH TABLE glideKnocker).
// The engine cursor SNAPS between integer slots (parity-locked); the DRAWN spatula GLIDES to it,
// banking + hopping as it whips across the grill. 2D here (the 2up grill is TWO rows, so x AND y).
// Parity-safe: _spat is render-side scratch, never read by the engine / node parity runs.
// Tuned near CRITICAL damping (zeta = DAMP / (2*sqrt(ACCEL)) ≈ 0.97): a hair under critical keeps the
// airy life but the blade settles on the slot with no visible overshoot wobble; ACCEL up = snappier track.
const KGLIDE_ACCEL = 240, KGLIDE_DAMP = 30;
function kitchenSpat(s, geo) {
  const now = performance.now();
  let dt = (now - (kitchenSpat._t == null ? now : kitchenSpat._t)) / 1000;
  kitchenSpat._t = now;
  if (dt > 0.05) dt = 0.05; if (dt < 0) dt = 0;          // tab-stall clamp — catch up, don't warp
  const center = (idx) => {
    if (geo.tcells && idx >= geo.gridN)                 // cursor is on the BUN TOASTER (past the grill slots)
      return geo.tcells[idx - geo.gridN] || { x: geo.ox, y: geo.oy };
    return geo.slotXY(idx); };                          // a grill bay (single-row line)
  if (!s._spat || s._spat.length !== s.players.length)   // (re)seed on a fresh game / grill resize
    s._spat = s.players.map((pl) => { const z = center(pl.cursor); return { x:z.x, y:z.y, vx:0, vy:0 }; });
  for (let pi = 0; pi < s.players.length; pi++) {
    const g = s._spat[pi], t = center(s.players[pi].cursor);
    g.vx += ((t.x - g.x) * KGLIDE_ACCEL - g.vx * KGLIDE_DAMP) * dt;
    g.vy += ((t.y - g.y) * KGLIDE_ACCEL - g.vy * KGLIDE_DAMP) * dt;
    g.x += g.vx * dt; g.y += g.vy * dt;
  }
  return s._spat;
}
// THE SPATULA SPRITE SEAM — incoming art (docs/SPATULA_SHEET.md) drops in here & lights up on reload.
// Absent = the per-player vector spatula (the placeholder) carries it; present = Patty's real spatula.
const SPAT_SPR = {};                                       // (legacy single-spatula art; the pair now lives in lib/spatulas.js)
PMSpat.load("../assets/sprites/grill/");
const SPAT_FOOD_IMG = {};
for (const [k, f] of [["cheese", "cheese-fresh"], ["bread", "bread"], ["rye", "bread-rye"], ["raw", "patty-raw"],
                      ["seared", "patty-seared"], ["done", "patty-done"], ["burnt", "patty-burnt"]]) {
  const im = new Image(); im.onload = () => { SPAT_FOOD_IMG[k] = im; }; im.src = "../assets/sprites/grill/" + f + ".png";
}
const spatFood = (k) => SPAT_FOOD_IMG[k] || null;
for (const [k, f] of [["level", "spatula-level"], ["flip", "spatula-flip"], ["toast", "spatula-toast"]]) {
  const im = new Image(); im.onload = () => { SPAT_SPR[k] = im; }; im.src = "../assets/sprites/grill/spatula/" + f + ".png";
}
// GRILL-STATE BACKGROUND — the flat-top art swaps with buried_index so the desktop grill visibly
// HEATS UP with the rush (empty → cluttered → steaming → overloaded → on fire). Vector fallback if absent.
const GRILL_BG = {};
for (const n of ["empty", "cluttered", "steaming", "overloaded", "disaster"]) {
  const im = new Image(); im.onload = () => { GRILL_BG[n] = im; }; im.src = "../assets/sprites/grill/grill-" + n + ".png";
}
function grillBgFor(b) {
  if (b >= pm.BURIED_BARKING)  return GRILL_BG.disaster;    // ≥0.78 — on fire
  if (b >= pm.BURIED_RESTLESS) return GRILL_BG.overloaded;  // ≥0.55 — hot
  if (b >= 0.30) return GRILL_BG.steaming;
  if (b >= 0.15) return GRILL_BG.cluttered;
  return GRILL_BG.empty;
}
// FOOD FX ART — the CHEESE SPLAT (on a cheese drop) + the BURN smoke column (when a patty's lost to
// the grill). Big painterly one-shots; absent = the vector note/ring carries it. (assets/sprites/grill/fx-*)
const FOOD_FX = { burn: [] };
{ const s = new Image(); s.onload = () => { FOOD_FX.splat = s; }; s.src = "../assets/sprites/grill/fx-cheese-splat.png";
  for (const n of [1, 2, 3]) { const im = new Image(); im.onload = () => { FOOD_FX.burn[n - 1] = im; };
    im.src = "../assets/sprites/grill/fx-burn-" + n + ".png"; } }
// FLIP-POP + FOOD FX — render-only beats keyed to engine state (recipe step advance / a burnt slot),
// so the grill READS. k: "note" (♪ flip), "splat" (cheese drop), "smoke" (a patty burnt away).
let grillPops = [];
let lastSlotXY = null;                 // (1112) the slot→screen map the pop-ups anchor to (set each frame)
function detectFlips(slotXY) {
  lastSlotXY = slotXY;
  const seen = grillPops._seen || (grillPops._seen = []);
  for (let i = 0; i < game.slots.length; i++) {
    const p = game.slots[i], prev = seen[i], c = slotXY(i);
    if (p && prev && prev.born === p.born && p.step === prev.step && (p.flips || 0) > (prev.flips || 0)) {   // an EXTRA flip (1112): turn it again
      flipAnim[i] = performance.now(); grillPops.push({ k: "note", x: c.x, y: c.y, t: 0, life: 22, note: "↻" });
    } else if (p && prev && prev.born === p.born && p.step > prev.step) {       // same patty, an action just landed
      if (prev.stage === S.SEAR_A && p.stage === S.SEAR_B) flipAnim[i] = performance.now();   // ?art=3d: play the flip
      if (game.flash === "CHEESE!" && FOOD_FX.splat) grillPops.push({ k: "splat", x: c.x, y: c.y, t: 0, life: 18 });
      else grillPops.push({ k: "note", x: c.x, y: c.y, t: 0, life: 22, note: game.flash === "TOAST!" ? "♫" : "♪" });
    } else if (prev && !p && game.flash === "BURNT!") {                  // a patty just BURNED off this slot
      burntAnim[i] = performance.now();                                   // ?art=3d: the charred patty lingers + smokes
      grillPops.push({ k: "smoke", x: c.x, y: c.y, t: 0, life: 46 });
    }
    seen[i] = p ? { born: p.born, step: p.step, stage: p.stage, flips: p.flips } : null;
  }
}
// draw one FX pop; returns true while alive
function drawPop(f, rad) {
  const k = f.t++ / f.life;
  if (f.k === "smoke") {                                  // charred patty + a rising, growing, fading smoke column
    const fr = FOOD_FX.burn[Math.min(2, Math.floor(k * 3))] || FOOD_FX.burn[FOOD_FX.burn.length - 1];
    if (fr && fr.width) { const w = rad * 2.4, h = w * fr.height / fr.width, rise = k * rad * 0.6;
      ctx.globalAlpha = k < 0.7 ? 1 : Math.max(0, (1 - k) / 0.3);
      ctx.drawImage(fr, f.x - w / 2, f.y + rad * 0.5 - h - rise, w, h); ctx.globalAlpha = 1; }
  } else if (f.k === "splat" && FOOD_FX.splat) {          // cheese splash blooms then settles
    const sp = FOOD_FX.splat, sc = (0.7 + k * 0.5), w = rad * 2.0 * sc, h = w * sp.height / sp.width;
    ctx.globalAlpha = Math.max(0, 1 - k); ctx.drawImage(sp, f.x - w / 2, f.y + rad * 0.4 - h, w, h); ctx.globalAlpha = 1;
  } else if (f.k === "note") {                            // the singing-spatula note + contact ring
    ctx.globalAlpha = 1 - k;
    txt(f.note, f.x + 12, f.y - 8 - k * 18, 18 + k * 6, COL.cheese, "center", 800);
    ctx.strokeStyle = "rgba(255,210,120," + (1 - k).toFixed(2) + ")"; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(f.x, f.y, 8 + k * 18, 0, 7); ctx.stroke(); ctx.globalAlpha = 1;
  }
  return f.t < f.life;
}
const CURS_HUE = ["#ff5a4d", "#6fb0e0"];                  // P1 red spatula · P2 (Chrissy) blue — vector fallback

// PATTY — the cook herself, a reactive foreground avatar (idle → flip on an action → serve on a
// handoff → cheer at BIG GRILL ENERGY). State-driven show-don't-tell. (TEST placement — tunable.)
const PATTY_SPR = {}, CHRISSY_SPR = {};
// SKIN-AWARE COOK ART: HEROES (school) loads the Cougars cook set; if a school file is missing it falls back
// to the diner art. So the HEROES COOK set (Patty + Chrissy) swaps together; Billy (the runner) is separate.
const COOK_SUFFIX = SCHOOL ? "-school" : "";

function pickPattyPose() {
  const ov = Q.get("pose"); if (ov && (PATTY_SPR[ov] || (ART3D_ON && globalThis.ART3D && ART3D.cast.patty && ART3D.cast.patty[ov]))) return ov;   // ?pose=cheer — QA/preview override (?art=3d: any manifest pose, e.g. flip/cheese)
  const now = performance.now(), P = pickPattyPose;
  if (P._served == null) P._served = game.served;
  if (game.served > P._served) P._serveT = now;
  P._served = game.served;

}
// pose fallback so a cook missing a given frame degrades gracefully (Patty has no flip/cheese → serve → idle)
function cookSprite(map, pose) {
  const chain = { cheese: ["cheese", "idle"], flip: ["flip", "idle"],   // grill actions → idle for a plater (she's not at the grill)
                  serve: ["serve", "cheer", "idle"], cheer: ["cheer", "idle"], idle: ["idle"] };
  for (const k of (chain[pose] || [pose, "idle"])) if (map[k]) return map[k];
  return map.idle;
}
// A presiding cook, sized to a column and anchored to the kitchen floor. `zone` = {cx (foot x), footY, maxH, face}.
function drawCook(sprMap, zone) {
  const sp = cookSprite(sprMap, pickPattyPose());
  if (!sp || !sp.width) return;
  const h = zone.maxH, w = h * sp.width / sp.height;
  const x = zone.cx - w / 2, ty = zone.footY - h;
  // soft floor shadow so she's planted, not floating
  ctx.fillStyle = "rgba(0,0,0,0.30)"; ctx.beginPath(); ctx.ellipse(zone.cx, zone.footY - 4, w * 0.34, 7, 0, 0, 7); ctx.fill();
  if (zone.face < 0) { ctx.save(); ctx.translate(x + w, ty); ctx.scale(-1, 1); ctx.drawImage(sp, 0, 0, w, h); ctx.restore(); }
  else ctx.drawImage(sp, x, ty, w, h);
}

// THE ASSEMBLY station — the prep counter (pass side of the sub-line) where the finished item is plated.
function drawAssembly(x, y, w, h) {
  const now = performance.now();
  const bx = x + w * 0.42, bw = w * 0.58;                  // counter on the PASS side; the cook stands to its left
  const cy = y + h * 0.46, cx = bx + bw * 0.52;

  ctx.strokeStyle = "rgba(170,130,80,.5)"; ctx.lineWidth = 2; ctx.strokeRect(bx, cy - 28, bw, 56);
  txt(SCHOOL ? "TRAY-UP" : "ASSEMBLY", bx + bw / 2, cy - 36, 12, "rgba(230,180,110,.85)", "center", 800);

  // spatulas work from. Steel hotel pans sitting on the counter; they stay clear of the plate + its prompt.
  PMSpat.drawBin(ctx, "onions", bx + bw * 0.10, cy - 4, Math.min(48, bw * 0.2));
  PMSpat.drawBin(ctx, "swiss", bx + bw * 0.285, cy - 4, Math.min(48, bw * 0.2));
  PMSpat.drawBin(ctx, "american", bx + bw * 0.86, cy - 4, Math.min(48, bw * 0.2));
  // an order plated & ready to run? (done+servable on the grill OR a done grilled cheese)
  const ready = game.slots.some((p) => p && p.stage === S.DONE && (!BUN_ITEMS.has(p.item) || p.bunned))
    || (game.toaster && game.toaster.some((b) => b && b.stage === S.DONE));
  const bob = ready ? Math.sin(now / 180) * 2 : 0;
  _asmPlate = { x: cx, y: cy };                            // remember where the plate sits (the serve FX launches + builds from here)
  const building = plateBuilding();                        // a just-served order is stacking here — let the FX own the plate
  if (building) {                                           // the counter is busy plating the last order (the build FX draws it)
    txt("PLATING…", bx + bw / 2, cy + 26, 11, COL.cheese, "center", 800);
  } else {
    drawCarryPlate(cx, cy - 2 + bob, 1, readyItem());       // the assembled order on a plate (a melt = Joe's plated melt)
    if (ready) { ctx.strokeStyle = (now / 300 | 0) % 2 ? COL.cheese : COL.good; ctx.lineWidth = 2;

      txt("PLATE ▸ PASS", bx + bw / 2, cy + 26, 11, COL.good, "center", 800); }
    else txt("waiting on the grill…", bx + bw / 2, cy + 26, 10, COL.dim, "center", 600);

}

// SHARED scale, keyed to the LEVEL frame's height, so flip/toast keep the same blade size (patty just
// flies higher) — frames don't jump scale on swap. Pivot ≈ the blade contact point (tunable).
const SPAT_TARGET_H = 66, SPAT_AX = 0.42, SPAT_AY = 0.80;
function spatScale() { const th = art3d() ? 44 : SPAT_TARGET_H;   // the 3D wells are smaller on screen
  return (SPAT_SPR.level && SPAT_SPR.level.height) ? th / SPAT_SPR.level.height : 0.05; }
// draw one player's spatula at its sprung position — Patty's real spatula if present, else the vector placeholder
function drawSpatula(g, pi, flash) {
  const lift = Math.min(7, Math.abs(g.vx) * 0.012);       // hops up as it whips between slots
  const lean = Math.max(-0.32, Math.min(0.32, g.vx * 0.0009));  // banks into the travel direction
  ctx.save(); ctx.translate(g.x, g.y - lift); ctx.rotate(lean);
  const sp = (flash === "FLIP!" && SPAT_SPR.flip) ? SPAT_SPR.flip
           : (flash === "TOAST!" && SPAT_SPR.toast) ? SPAT_SPR.toast : SPAT_SPR.level;
  if (sp && sp.width) {
    const SC = spatScale();
    if (pi === 1) ctx.filter = "hue-rotate(150deg) saturate(1.15) brightness(1.05)";  // Chrissy = bluer
    ctx.drawImage(sp, -sp.width * SPAT_AX * SC, -sp.height * SPAT_AY * SC, sp.width * SC, sp.height * SC);
    ctx.filter = "none";
  } else {                                                 // PLACEHOLDER: the per-player vector spatula
    ctx.fillStyle = CURS_HUE[pi] || CURS_HUE[0];
    ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(-9, -14); ctx.lineTo(9, -14); ctx.closePath(); ctx.fill();
  }
  ctx.restore();
}

// ---------- TIME-OF-DAY MOOD (render-only, parity-safe) ----------
// Each shift carries a clock ("6:00 AM" … "11:30 PM"); that hour washes the whole scene so the campaign
// visibly moves from cool-blue dawn → bright midday → amber dinner → deep night. No art — just a tint.
function shiftHour24() {
  const live = globalThis.PMDay && game ? PMDay.hour24(pm, game) : null; if (live != null) return live;   // THE DAY: the wall clock
  const m = /(\d+):(\d+)\s*(AM|PM)/i.exec(shift().time || "");
  if (!m) return 12;
  let h = parseInt(m[1], 10) % 12; if (/pm/i.test(m[3])) h += 12;
  return h;
}
function todTint(h) {                        // [r,g,b,alpha] full-frame wash (source-over); midday ≈ invisible
  if (h < 6)  return [26, 30, 92, 0.30];     // small hours — deep blue
  if (h < 9)  return [80, 100, 170, 0.15];   // dawn — cool blue-lavender
  if (h < 11) return [255, 214, 150, 0.06];  // morning — soft warm
  if (h < 15) return [255, 238, 205, 0.03];  // midday — bright, barely there
  if (h < 17) return [255, 176, 92, 0.10];   // afternoon — warming
  if (h < 20) return [255, 120, 58, 0.16];   // dinner / golden hour — amber
  if (h < 22) return [48, 50, 122, 0.20];    // evening — blue
  return [30, 32, 96, 0.26];                 // night — deep blue-purple
}
function drawTimeOfDay() {
  const t = todTint(shiftHour24());
  ctx.fillStyle = "rgba(" + t[0] + "," + t[1] + "," + t[2] + "," + t[3] + ")";
  ctx.fillRect(0, 0, W, H);
}

  detectFlips(slotXY);

  // TWO SPATULAS PER COOK (Joe 1026, lib/spatulas.js): every food move is done by the pair, no hands on the food.

  const spat = kitchenSpat(game, { slotXY, gridN: n, tcells, ox: GX, oy: bayY });

    return { x: c.x, y: c.y, r: bayRad }; };

// THE BUN TOASTER station — a BOXED unit beside the grill, slots stacked raw ▸ toasting ▸ READY (glow) ▸ burnt.
// Returns the slot-center list so the cursor/spatula glides onto it (engine cursor indices n .. n+toaster-1).

      const brown = ready ? (nearBurn && (now / 120 | 0) % 2 ? COL.bad : "#e0a83c") : "#d9c08a";
      ctx.fillStyle = brown; ctx.fillRect(mcx - cellW * 0.34, mcy - 8, cellW * 0.68, 16);
      if (ready) { ctx.strokeStyle = COL.cheese; ctx.lineWidth = 2; ctx.strokeRect(mcx - cellW * 0.37, mcy - 11, cellW * 0.74, 22);
        txt("READY", mcx, cy + 12, 10, nearBurn ? COL.bad : COL.cheese, "center", 800); }
      else txt("BUN ···", mcx, cy + 12, 10, COL.dim, "center", 700);
      if (b.bread) PMOrders.breadChip(ctx, b.bread, mcx, mcy + 14);
      ctx.fillStyle = "#241c12"; ctx.fillRect(cx + 4, cy + cellH - 6, cellW - 8, 4);
      ctx.fillStyle = nearBurn ? COL.bad : ready ? COL.good : COL.amber; ctx.fillRect(cx + 4, cy + cellH - 6, (cellW - 8) * frac, 4);

      const done = b.stage === S.DONE;

        txt(done ? "SERVE ▸" : (ITEMS ? pm.ITEM_TICKET[b.item] : "G.CHZ"), mcx, cy + 12, 10,
            done ? COL.good : COL.cream, "center", 800);

}

// ?art=3d HEROES STUDENTS — the lunch line. A student waits at each of the six rail spots (billy_run's "seats" here);
// when Billy hands a tray to that spot (billy_run 'deliver'), the student takes it (the tray leaves the rail), carries it
// down the aisle to a free table seat, sits, eats, and leaves by the doors; the next student walks in to that spot.
const studSt = [];
function drawStudents3D() {
  const St = ART3D.m.students, now = performance.now(), dt = studSt._t ? Math.min(100, now - studSt._t) : 16; studSt._t = now;
  const L_ = St.list, seatsTaken = studSt._seats || (studSt._seats = []);
  const pxm = (y) => { const a = St.spots[0], b = St.seats[St.seats.length - 1];       // px per metre by screen depth
    return Math.max(10, a.h + (y - a.xy[1]) * (b.h - a.h) / ((b.xy[1] - a.xy[1]) || 1)); };
  const move = (s, tx, ty, v) => { const d = Math.hypot(tx - s.x, ty - s.y), st = v * dt / 1000; s.ph += Math.min(d, st);
    if (Math.abs(tx - s.x) > 0.5) s.face = tx > s.x ? 1 : -1; if (d <= st) { s.x = tx; s.y = ty; return true; } s.x += (tx - s.x) * st / d; s.y += (ty - s.y) * st / d; return false; };
  for (let k = 0; k < St.spots.length; k++) {
    let s = studSt[k];
    if (!s) s = studSt[k] = { k, mode: "arrive", x: St.door.xy[0], y: St.door.xy[1], ph: 0, face: -1, who: k % L_.length, t: 0, path: [[St.door.xy[0], St.aisle_y], [St.spots[k].xy[0], St.aisle_y], St.spots[k].xy] };
    // the tray Billy just handed to this spot
    if (BR && s.mode === "wait") { const p = BR.plates.find((q) => q.state === "served" && !q.taken && q.seat === k); if (p) {
      p.taken = true; let seat = 0; while (seatsTaken[seat]) seat++; seatsTaken[seat] = true; const S2 = St.seats[seat % St.seats.length];
      s.mode = "carry"; s.seat = seat; s.path = [[s.x, St.aisle_y], [S2.xy[0], St.aisle_y], S2.xy]; } }
    if (s.path && s.path.length) { if (move(s, s.path[0][0], s.path[0][1], s.mode === "carry" ? 75 : 85)) s.path.shift(); }
    else if (s.mode === "arrive") { s.mode = "wait"; s.face = 1; }
    else if (s.mode === "carry") { s.mode = "sit"; s.t = now; }
    else if (s.mode === "sit" && now - s.t > 7000) { seatsTaken[s.seat] = false; s.mode = "leave"; s.path = [[s.x, St.aisle_y], [St.door.xy[0], St.aisle_y], St.door.xy]; }
    else if (s.mode === "leave") { studSt[k] = null; continue; }
    const F = L_[s.who].frames, pose = s.mode === "carry" ? "carry" : s.mode === "sit" ? "sit" : s.mode === "wait" ? "wait" : "walk";
    const list = F[pose] && F[pose].length ? F[pose] : F.idle; if (!list || !list.length) continue;
    const fr = pose === "carry" || pose === "walk" ? list[Math.floor(s.ph / 14) % list.length] : list[Math.floor(now / 900) % list.length];
    const sc = pxm(s.y) / St.px_per_m * (St.scale || 1), im = ART3D.patronAtl[fr.a]; if (!im) continue;
    ctx.save(); ctx.translate(DIN.x + s.x, DIN.y + s.y); ctx.scale(s.face * sc, sc);
    ctx.drawImage(im, fr.sx, fr.sy, fr.w, fr.h, fr.ox, fr.oy, fr.w, fr.h); ctx.restore();
  }
}
// ?art=3d HEROES LUNCH STAFF (1112) — placeholders until Joe paints them (art3d.json `staff`, from refs/heroes_staff.json:
// seed · spot · facing · pose loop). Each lady stands behind the serving line and cycles her loop (idle · serve · wipe), clipped
// to above the counter's back edge so the counter hides her from the hips down, like the cooks. Render-only.
function drawStaff3D() {
  const S = ART3D.m.staff, St = ART3D.m.students, T = performance.now() / 1000; if (!S.ladies) return;
  const fps = S.fps || {}, hold = S.hold || {};
  ctx.save(); ctx.beginPath(); S.clip.forEach((p, i) => (i ? ctx.lineTo : ctx.moveTo).call(ctx, DIN.x + p[0], DIN.y + p[1])); ctx.closePath(); ctx.clip();
  for (const L_ of S.ladies) {
    const steps = L_.loop.map((p) => [p, hold[p] || 2]), cyc = steps.reduce((a, s) => a + s[1], 0);
    let t = (T + (L_.phase || 0)) % cyc, k = 0; while (t > steps[k][1]) { t -= steps[k][1]; k++; }
    const pose = steps[k][0], list = (L_.frames[pose] && L_.frames[pose].length) ? L_.frames[pose] : L_.frames.idle; if (!list || !list.length) continue;
    const fr = list[Math.floor(t * (fps[pose] || 2)) % list.length], im = ART3D.patronAtl[fr.a]; if (!im) continue;
    const sc = L_.pxm / (St ? St.px_per_m : 101) * (S.scale || 1);
    ctx.save(); ctx.translate(DIN.x + L_.xy[0], DIN.y + L_.xy[1]); ctx.scale(L_.face * sc, sc);
    ctx.drawImage(im, fr.sx, fr.sy, fr.w, fr.h, fr.ox, fr.oy, fr.w, fr.h); ctx.restore();
  }
  ctx.restore();
}
// ?art=3d PATRONS — a rendered diner at each seat (SEATS[i]). Render-only state machine per seat, driven by the same
// "seated" count the 2D dots use (buried_index fills the house): ENTER (door → aisle → sit, 12fps) → SEATED loop
// (sip / look / gesture) → LEAVE (stand → aisle → door) when the house empties. Frames + positions come from the
// 3D set's door, paths and seats (locations.json), at the dining-monitor camera.
const patronSt = [];
function drawPatrons3D(seated, wf, open) {
  const now = performance.now(), Pm = ART3D.m.patrons, T = now / 1000;
  for (let i = 0; i < Pm.length; i++) {
    const seq = Pm[i]; if (!seq || !seq.frames.length) continue;
    const want = seq.seat < seated || (open && open.has(seq.seat)), st = patronSt[i] || (patronSt[i] = { mode: "empty", f: 0, t: now });
    if (st.mode === "empty" && want) { st.mode = "enter"; st.f = 0; st.t = now; }
    if ((st.mode === "seated" || st.mode === "enter") && !want) { st.mode = "leave"; st.f = Math.max(st.f, seq.leave0); st.t = now; }
    if (st.mode === "empty") continue;
    const step = Math.floor((now - st.t) / (1000 / 12)); st.t += step * (1000 / 12);
    if (st.mode === "enter") { st.f += step; if (st.f >= seq.seat0) { st.mode = "seated"; st.f = seq.seat0; } }
    else if (st.mode === "seated") { st.f += step; if (st.f > seq.seat1) st.f = seq.seat0 + (st.f - seq.seat0) % (seq.seat1 - seq.seat0 + 1); }
    else if (st.mode === "leave") { st.f += step; if (st.f >= seq.frames.length) { st.mode = "empty"; continue; } }
    const fr = seq.frames[Math.min(st.f, seq.frames.length - 1)], im = ART3D.patronAtl[fr.a]; if (!im) continue;
    ctx.drawImage(im, fr.sx, fr.sy, fr.sw || fr.w, fr.sh || fr.h, DIN.x + fr.x, DIN.y + fr.y, fr.w, fr.h);   // (1112) sw/sh: 2× atlas px
    if (st.mode === "seated") {                              // the house's patience, over the seated diner
      const ang = Math.min(1, wf * (0.7 + 0.3 * ((seq.seat * 7 % 5) / 4)));
      const cc = ang >= .78 ? COL.bad : ang >= .5 ? COL.amber : COL.good, hx = DIN.x + seq.head.x, hy = DIN.y + seq.head.y;
      ctx.fillStyle = cc; ctx.beginPath(); ctx.arc(hx + 10, hy - 4, 4, 0, 7); ctx.fill();
      if (ang >= .85) txt(L.bark, hx, hy - 14, 11, COL.bad, "center", 800);
      else if (ang >= .6) txt("…", hx, hy - 12, 15, COL.amber, "center", 800);
    }
  }
}
// THE TABLE MAP — a number plaque on every seat (B1-B6 counter, T1-T4 booths). Dim = empty, cream = waiting on an

// ---------- THE DINING ROOM (front of house — the buried-index made literal) ----------
function drawDining() {
  const r = DIN;
  // THE ROOM — real painted dining room (diner-room.png). Fills the panel; vector fallback if absent.
  if (art3d() && ART3D.img.dining) { ctx.drawImage(ART3D.img.dining, r.x, r.y, r.w, r.h);   // HEROES: the 3D cafeteria
    if (globalThis.PMSigns) PMSigns.draw(ctx, "heroes_dining", r); }
  else if (DINING_BG.complete && DINING_BG.naturalWidth) {
    ctx.drawImage(DINING_BG, r.x, r.y, r.w, r.h);
    if (!SCHOOL && globalThis.PMSigns) PMSigns.draw(ctx, "diner_dining", r);   // (1112) crisp signs; the COUGARS valance is the diner's own now
  } else {
    ctx.fillStyle = "#16100c"; ctx.fillRect(r.x, r.y, r.w, r.h);
    ctx.font = '700 16px "Courier New",monospace'; ctx.textAlign = "center"; ctx.fillStyle = COL.ascii;

  }

  const seated = Math.max(1, Math.round(2 + buried * (SEATS.length - 2)));
  const T = performance.now() / 1000, open = openSeats();

  if (art3d() && ART3D.m.students) drawStudents3D(); else if (art3d() && ART3D.m.patrons && ART3D.m.patrons.length) drawPatrons3D(seated, wf, open); else
  for (let i = 0; i < SEATS.length; i++) {

    const cc = ang >= .78 ? COL.bad : ang >= .5 ? COL.amber : COL.good;
    const sipping = (Math.sin(T * 0.7 + i * 1.9) > 0.86);

  // freezer / basement (mini.*); 1-screen 720×600 → freezer720 / basement720 (mini720.*, 1110 r3). Other sizes: the 2D grid.
  const st3 = (chill ? "freezer" : "basement") + (W === 720 ? "720" : ""), S3 = globalThis.PMStages && PMStages.stage(st3);
  const A3 = ART3D_ON && !!S3 && S3.canvas[0] === W && S3.canvas[1] === H && PMStages.ready(st3), MK = (S3 && S3.sprite_prefix) || "mini.";
  if (A3) PMStages.plate(ctx, st3);
  txt(c.name, W / 2, 74, 44, accent, "center", 800);
  txt(c.flavor, W / 2, 104, 18, COL.cream, "center", 600);
  const quota = c.quota ? "/" + c.quota : "", secs = Math.max(0, Math.ceil(s.t_left / pm.TPS));
  txt("TIME " + secs + "s", 40, 144, 20, secs <= 3 && !s.done ? COL.bad : COL.cream, "left", 700);
  txt("CAUGHT " + s.caught + quota, W / 2, 144, 20, c.quota && s.caught >= c.quota ? COL.good : COL.cream, "center", 700);
  txt("BONUS " + String(s.score).padStart(5, "0"), W - 40, 144, 20, COL.cheese, "right", 700);
  const gx0 = 96, gw = W - 192, laneW = gw / pm.MINI_LANES;
  const gy0 = 182, gh = H - 300, rowH = gh / pm.MINI_ROWS;
  const laneX = (l) => gx0 + l * laneW + laneW / 2, rowY = (r) => gy0 + r * rowH + rowH / 2;
  ctx.strokeStyle = "rgba(255,255,255,0.06)"; ctx.lineWidth = 1;
  if (!A3) for (let l = 0; l <= pm.MINI_LANES; l++) { ctx.beginPath(); ctx.moveTo(gx0 + l * laneW, gy0); ctx.lineTo(gx0 + l * laneW, gy0 + gh); ctx.stroke(); }
  for (const it of s.items) {
    const x = laneX(it[0]), y = rowY(it[1]), bw = laneW * 0.56, bh = rowH * 0.56;
    if (A3 && PMStages.mini(ctx, MK + (chill ? "case" : "crate"), x, y)) continue;   // the rendered stock
    ctx.fillStyle = accent; ctx.fillRect(x - bw / 2, y - bh / 2, bw, bh);
    ctx.strokeStyle = "rgba(255,255,255,0.28)"; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(x - bw / 2, y); ctx.lineTo(x + bw / 2, y);
    ctx.moveTo(x, y - bh / 2); ctx.lineTo(x, y + bh / 2); ctx.stroke();
  }
  const catchRow = chill ? pm.MINI_ROWS - 1 : 0, cxp = laneX(s.cart), cyp = rowY(catchRow), cw = laneW * 0.82;
  if (!(A3 && PMStages.mini(ctx, MK + (chill ? "cart_freezer" : "cart_basement"), cxp, cyp))) {
    ctx.fillStyle = COL.cheese; ctx.fillRect(cxp - cw / 2, cyp - 13, cw, 26);
    txt(chill ? "▲" : "▼", cxp, cyp + 7, 18, "#3a2a08", "center", 800); }
  if (s.done) txt(s.score > 0 ? "STOCKED!  +" + s.score + " — press SPACE" : "FORFEIT — press SPACE",
      W / 2, gy0 + gh + 40, 24, s.score > 0 ? COL.good : COL.bad, "center", 800);
  else { if (s.flash) txt(s.flash, W / 2, gy0 + gh + 20, 20, COL.cheese, "center", 800);
    txt(chill ? "◀ ▶  catch what falls — pure bonus, no fail" : "◀ ▶  grab the backlog — clear the quota or forfeit",
        W / 2, gy0 + gh + 44, 15, COL.dim, "center", 600); }
}

// ---------- THE PAUSE MENU (P / Esc / pad START) — resume · restart · controls · tips · receipts · save log · quit ----------
const pmenu = { sel: 0, view: "menu", msg: "", msgT: 0 };
function pauseItems() {
  const it = [["resume", "RESUME"], ["restart", BATTLE ? "REMATCH" : "RESTART SHIFT"], ["controls", "CONTROLS"],
    ["tips", "TIPS: " + (tipsOn() ? "ON" : "OFF")], ["rail", "RECEIPTS: " + (document.body.classList.contains("pm-rail-tucked") ? "HIDDEN" : "SHOWN")]];
  if (PLOG && !PLOG.off) it.push(["log", "SAVE PLAYTEST LOG"]);
  it.push(["quit", SHELL === "1" ? "QUIT TO MENU" : "QUIT TO TITLE"]); return it;
}
function pauseKey(k) {
  if (!paused) { paused = true; pmenu.sel = 0; pmenu.view = "menu"; if (PLOG) PLOG.note("pause", { t: game.ticks }); return; }
  if (pmenu.view === "controls") { pmenu.view = "menu"; return; }
  const it = pauseItems();
  if (k === "escape" || k === "p") { paused = false; return; }
  if (k === "arrowup" || k === "w") { pmenu.sel = (pmenu.sel + it.length - 1) % it.length; return; }
  if (k === "arrowdown" || k === "s") { pmenu.sel = (pmenu.sel + 1) % it.length; return; }
  if (!(k === "enter" || k === " " || k === "f")) return;
  const id = it[Math.min(pmenu.sel, it.length - 1)][0];
  if (id === "resume") paused = false;
  else if (id === "restart") { paused = false; BATTLE ? startBattle() : startShift(shiftIdx); }
  else if (id === "controls") pmenu.view = "controls";
  else if (id === "tips") setTipsOn(!tipsOn());
  else if (id === "rail") setRail(!document.body.classList.contains("pm-rail-tucked"));
  else if (id === "log") { PLOG.download(); pmenu.msg = "SAVED — a .json in your Downloads (nothing is sent anywhere)"; pmenu.msgT = performance.now(); }
  else if (id === "quit") { paused = false; plogEnd("quit");
    if (SHELL === "1") toShell({ mode: BATTLE ? "battle" : "campaign", outcome: "quit", score: totalScore(), served: runServed + game.served, shift: shift().n, shiftName: shift().name,
      winner: BATTLE ? (cook[0].serves === cook[1].serves ? -1 : cook[0].serves > cook[1].serves ? 0 : 1) : undefined, a: cook[0].serves, b: cook[1].serves });
    else toAttract(); }
}
function drawPause() {
  ctx.fillStyle = "rgba(10,5,4,.78)"; ctx.fillRect(0, 0, W, H);
  const cx = W / 2;
  if (pmenu.view === "controls") {
    txt("CONTROLS", cx, 96, 34, COL.cheese, "center", 800);
    const rows = [["", "KEYBOARD", "PAD"], ["MOVE (grill + toaster)", "◄ ►  /  A D", "stick / d-pad"], ["FLIP", "F", "A"], ["TOPPING (cheese / onions)", "C", "B"],
      ["GRAB BREAD (at the pans) · TOAST IT", "X", "X"], ["EXPO — HEY BILLY! (run it)", "SPACE", "Y / RT"], ["PAUSE", "P / Esc", "START"]];
    if (PLAYERS === 2) rows.push(["CHRISSY (P2)", "J L · I K . · M", "pad 2"], ["CO-OP HANDOFF / DROP", "G T  ·  U O", ""]);
    rows.forEach((r, i) => { const y = 150 + i * 34, c = i ? COL.cream : COL.amber;
      txt(r[0], cx - 330, y, 18, c, "left", i ? 600 : 800); txt(r[1], cx + 60, y, 18, c, "center", 700); txt(r[2], cx + 260, y, 18, c, "center", 700); });
    txt("FLIP ON RDY ONCE — early = undercooked (flip again to fix it), raw/burnt = WASTE.", cx, 150 + rows.length * 34 + 26, 17, COL.good, "center", 700);
    txt("any key — back", cx, H - 40, 15, COL.dim, "center", 600); return;
  }
  txt("PAUSED", cx, 120, 44, COL.cheese, "center", 800);
  txt(BATTLE ? "MELTDOME" : "SHIFT " + shift().n + " — " + shift().name, cx, 152, 16, COL.dim, "center", 700);
  const it = pauseItems();
  it.forEach(([id, label], i) => { const y = 206 + i * 40, on = i === pmenu.sel;
    if (on) { ctx.fillStyle = "rgba(255,210,63,.16)"; ctx.fillRect(cx - 170, y - 27, 340, 36); }
    txt((on ? "▸ " : "") + label, cx, y, 22, on ? COL.cheese : COL.cream, "center", on ? 800 : 600); });
  if (pmenu.msg && performance.now() - pmenu.msgT < 4000) txt(pmenu.msg, cx, 206 + it.length * 40 + 14, 14, COL.good, "center", 600);
  txt("↑↓ choose · ENTER / A pick · P / Esc / START resume", cx, H - 36, 14, COL.dim, "center", 600);
}
// ---------- FIRST-TIME TEACHING PROMPTS — each one once a session, never blocking; H dismisses, pause menu → TIPS OFF ----------
// They read engine state only (the RDY flag, a sent-back, a waiting plate, a melt with no bun …) and fire the FIRST time
// the situation happens for a human player. Off in the QA rigs, the demo and the attract.
const TIP_KEY = "pmTipsSeen.v1", TIPS_OFF_KEY = "pmTipsOff.v1";
let tipNow = null; const _tipSeen = new Set((() => { try { return JSON.parse(sessionStorage.getItem(TIP_KEY)) || []; } catch (e) { return []; } })());
function tipsOn() { if (SERVICE_PRACTICE || SHELL === "demo" || Q.get("tips") === "off") return false; try { return localStorage.getItem(TIPS_OFF_KEY) !== "1"; } catch (e) { return true; } }
function setTipsOn(v) { try { localStorage.setItem(TIPS_OFF_KEY, v ? "0" : "1"); } catch (e) {} if (!v) tipNow = null; }
const TIPS = {
  rdy:    ["WAIT FOR RDY", "It's ready when it says RDY — then F / Ⓐ to FLIP."],
  early:  ["TOO SOON — STILL RAW", "Flipped early: keep cooking. FLIP again to finish that side (one extra flip costs a little)."],
  top:    ["TOPPING TIME", "Cheese (or the melt's onions first): C / Ⓑ when it's RDY."],
  bun:    ["EVERY ORDER NEEDS ITS BREAD", "Read the ticket: SESAME · RYE · WHITE. ► past the toaster to the pans, X grabs it; X on the toaster lays it. It joins its patty by itself."],
  billy:  ["ORDER UP — EXPO!", "A plate is up. SPACE / Ⓨ = EXPO: Billy runs it to the table on its ticket."],
  coop:   ["BILLY SERVES ONE SIDE", "He faces one cook at a time — holler for YOUR side when your plate is up."],
  burnt:  ["BURNT — IT'S TOSSED", "Left too long. Watch the clock on each item."],
};
function tipShow(id) { if (!tipsOn() || _tipSeen.has(id) || tipNow) return;
  _tipSeen.add(id); try { sessionStorage.setItem(TIP_KEY, JSON.stringify([..._tipSeen])); } catch (e) {}
  tipNow = { id, t0: performance.now() }; }
function tipPressed(verb) { if (!tipNow) return; const id = tipNow.id;   // doing the thing the tip asked = the tip is done
  if ((id === "rdy" && verb === "flip") || (id === "top" && verb === "top") || (id === "bun" && verb === "toast") || ((id === "billy" || id === "coop") && verb === "billy"))
    tipNow.done = performance.now(); }
function tipWatch() {
  if (!tipsOn() || !game || game.over || game.won) return;
  if (tipNow && performance.now() - (tipNow.done || tipNow.t0 + 5200) > (tipNow.done ? 500 : 0)) tipNow = null;
  if (tipNow) return;
  const A = pm.Action, mine = (i) => PLAYERS < 2 || i < game.slots.length / 2;
  for (let i = 0; i < game.slots.length; i++) { const p = game.slots[i]; if (!p || !mine(i)) continue;
    if (p.understeared) return tipShow("early");
    if (p.stage === S.BURNT) return tipShow("burnt");
    const nx = pm.RECIPES[p.item][p.step];
    if (nx !== undefined && p.cook >= pm.sear_ready(p)) return tipShow(nx === A.FLIP ? "rdy" : (nx === A.CHEESE || nx === A.ONION) ? "top" : "rdy");
    if (BUN_ITEMS.has(p.item) && !p.bunned && (p.stage === S.MELT || p.stage === S.DONE) && game.toaster.length && !game.toaster.some((b) => b && b.stage === undefined)) return tipShow("bun");
    if (servable(p)) return tipShow(PLAYERS === 2 ? "coop" : "billy");
  }
}
function drawTip() {
  if (!tipNow) return;
  const age = (performance.now() - tipNow.t0) / 1000, a = Math.min(1, age * 5) * (tipNow.done ? Math.max(0, 1 - (performance.now() - tipNow.done) / 500) : 1);
  // (1112) tips get their own band: the top of the dining panel (2 screens) / the foot of the room (1 screen) — never over the
  // kitchen HUD, the ticket rail or the grill
  const [head, body] = TIPS[tipNow.id], w = Math.min(560, (SCREENS === 2 ? DIN.w : W) - 40), x = SCREENS === 2 ? DIN.x + (DIN.w - w) / 2 : (W - w) / 2,
    y = SCREENS === 2 ? DIN.y + 10 : H - 72;
  ctx.save(); ctx.globalAlpha = a;
  ctx.fillStyle = "rgba(10,5,4,.86)"; ctx.fillRect(x, y, w, 62); ctx.fillStyle = "#ff2d9e"; ctx.fillRect(x, y, 5, 62);
  txt(head, x + 18, y + 25, 19, COL.cheese, "left", 800); txt(body, x + 18, y + 49, 14, COL.cream, "left", 600);
  txt("H hides · tips off in PAUSE", x + w - 10, y + 16, 10, COL.dim, "right", 600);
  ctx.restore();
}

// ---------- input — the 2-way stick + buttons (HEY BILLY is the star) ----------
addEventListener("keydown", (e) => {
  const k = e.key.toLowerCase();
  wakeAudio();                                     // first keypress arms WebAudio
  if (k === "s") { audio.setMuted(!audio.muted); if (audio.muted) PMOrders.hush(); return; }   // S = speaker toggle (mute)
  if (cineBusy()) { PMCine.skip(); e.preventDefault(); return; }   // any key skips a cutscene
  if (phase === "play" && (paused || (k === "escape" || k === "p") && !game.over && !game.won)) { pauseKey(k); e.preventDefault(); return; }   // the PAUSE MENU
  if (k === "escape" && SHELL === "1") { toShell(_shellRes); e.preventDefault(); return; }   // back to the front door
  if (phase === "attract") { startGame(); e.preventDefault(); return; }   // START — any key begins the campaign
  if (phase === "ready") { e.preventDefault(); return; }                  // GET READY — inputs locked till GO!
  if (phase === "won_campaign") { submitRun(); e.preventDefault(); return; }   // campaign clear — score entry then title
  if (phase === "battle_over") { toAttract(); e.preventDefault(); return; }    // grill-off decided — back to the title
  if (phase === "initials") {                    // arcade initials entry: ↑↓ letter · ←→ position · SPACE/ENTER confirm
    if (k === "arrowup" || k === "w") entryName[entryPos] = (entryName[entryPos] + 1) % ENTRY_CH.length;
    else if (k === "arrowdown" || k === "s") entryName[entryPos] = (entryName[entryPos] + ENTRY_CH.length - 1) % ENTRY_CH.length;
    else if (k === "arrowleft" || k === "a") entryPos = Math.max(0, entryPos - 1);
    else if (k === "arrowright" || k === "d") entryPos = Math.min(2, entryPos + 1);
    else if (k === " " || k === "enter" || k === "f") { if (entryPos < 2) entryPos++; else finalizeEntry(); }
    e.preventDefault(); return;
  }
  if (phase === "board") { toAttract(); e.preventDefault(); return; }          // high-score table → back to the title
  if (phase === "bonus") {                        // back-of-house: drive the cart under the falling stock
    if (mini.done) { if (k === " " || k === "enter" || k === "f") endBonus(); }   // bank + on to the next shift
    else if (k === "arrowleft" || k === "a" || k === "j") pm.mini_move(mini, -1);
    else if (k === "arrowright" || k === "d" || k === "l") pm.mini_move(mini, 1);
    e.preventDefault(); return;
  }
  if (k === "r") { BATTLE ? startBattle() : startShift(shiftIdx); return; }    // rematch / retry THIS shift
  if (k === "h" && tipNow) { tipNow = null; return; }                          // H = dismiss the tip on screen
  if (game.over) { if (BATTLE) return; if (continueT > 0) billyBack(); else submitRun(); return; }   // (battle end = the clock)
  if (game.won && (k === " " || k === "enter")) { nextShift(); return; }   // ROUND CLEAR → next shift (or campaign complete)
  // P1 (PATTY): arrows / a,d + f,c,x + space/v HEY BILLY
  if (k === "arrowleft" || k === "a") act("move", 0, () => pm.move(game, -1, 0));
  else if (k === "arrowright" || k === "d") act("move", 0, () => pm.move(game, 1, 0));
  else if (k === "f") act("flip", 0, () => pm.flip(game, 0));
  else if (k === "c") act("top", 0, () => pm.add_cheese(game, 0));
  else if (k === "x") act("toast", 0, () => pm.toast(game, 0));
  else if (k === " " || k === "v" || k === "b") act("billy", 0, () => pm.hey_billy(game, 0));
  // P2 (CHRISSY, co-op): j,l + i,k,. + m HEY BILLY (engine no-ops these in 1P)
  else if (k === "j") act("move", 1, () => pm.move(game, -1, 1));
  else if (k === "l") act("move", 1, () => pm.move(game, 1, 1));
  else if (k === "i") act("flip", 1, () => pm.flip(game, 1));
  else if (k === "k") act("top", 1, () => pm.add_cheese(game, 1));
  else if (k === ".") act("toast", 1, () => pm.toast(game, 1));
  else if (k === "m") act("billy", 1, () => pm.hey_billy(game, 1));
  // CO-OP teamwork: HANDOFF (pass to partner's half) + DROP (sacrifice a jammed slot)
  else if (k === "g") pm.handoff(game, 0);
  else if (k === "t") pm.drop(game, 0);
  else if (k === "u") pm.handoff(game, 1);
  else if (k === "o") pm.drop(game, 1);
  else return;
  actionSfx();                                     // singing-spatula FLIP / cheese fwump / toast / HEY BILLY holler
  e.preventDefault();
}, { passive: false });

// QA/attract pre-roll: ?warm=N runs N sim steps synchronously so a screenshot shows a live room
// (headless rAF virtual-time barely advances the accumulator). Mirrors cookoff.html's ?warm.
const WARM = parseInt(Q.get("warm") || "0", 10);
for (let i = 0; i < WARM && !(game.over || game.won); i++) step();
billyPos = billyTarget();                 // snap him into place so frame 1 isn't mid-walk

requestAnimationFrame(loop);
</script>
