<!DOCTYPE html>
<!-- PATTY MELT — KITCHEN + DINING ROOM.  *** for Christine & Phillip Coleman. ***
     ONE parity-proven game (engine.js) rendered across TWO views: the KITCHEN (the grill you play)
     and the DINING ROOM (the front of house). The trick: Billy's `billy` ATTENTION already IS his
     location — when it drains he wanders out to BUS TABLES in the dining room; "HEY BILLY!" walks him
     back to the kitchen PASS to expo finished orders. So the two-screen drama needs ZERO engine change
     (parity untouched) — the dining room is a pure render of state (orders / wait / combo / buried).
       ?screens=2  (default) two screens side by side  — the 2UP cab
       ?screens=1  one screen, dining as a strip below — the POP-UP 1up experiment ("does it port?")
       ?mode=kids|family|arcade   ?items=full (FULL MENU recipes — legal on 2up/jailbreak)            -->
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>PATTY MELT — KITCHEN + DINING</title>
<style>
  html,body{margin:0;height:100%;background:#140a08;overflow:hidden;font-family:"Saira Condensed","Arial Narrow",sans-serif;}
  #frame{position:absolute;inset:0;display:grid;place-items:center;
    background:repeating-linear-gradient(0deg,rgba(181,53,43,.9) 0 22px,rgba(181,53,43,.5) 22px 44px),
               repeating-linear-gradient(90deg,rgba(181,53,43,.9) 0 22px,rgba(181,53,43,.5) 22px 44px),#7a1f18;}
  body.school #frame{background:repeating-linear-gradient(0deg,rgba(58,92,150,.9) 0 22px,rgba(58,92,150,.5) 22px 44px),
               repeating-linear-gradient(90deg,rgba(58,92,150,.9) 0 22px,rgba(58,92,150,.5) 22px 44px),#1f3a63;}  /* HEROES blue gingham */
  #wrap{position:relative;width:96vw;max-width:1280px;border:14px solid #2a1410;border-radius:10px;
    box-shadow:0 0 0 6px #0a0504,0 18px 60px #000;}
  canvas{display:block;width:100%;height:100%;image-rendering:pixelated;background:#0a0806;border-radius:4px;}
  #tag{position:absolute;bottom:-2.5em;width:100%;text-align:center;color:#f3e6c8;font-weight:600;
    font-size:13px;letter-spacing:.1em;opacity:.85;}
  /* bare mode: the canvas sits in #wrap with the gingham border; the cab art is hidden */
  #cab{display:contents;}
  #cabart,#cabflame{display:none;}
  /* FRAMED mode (?frame=2up-*): the real cab render is the frame, the live screen sits in the cutout */
  body.framed #frame{background:#000;}
  body.framed #wrap{border:none;box-shadow:none;width:auto;aspect-ratio:auto;background:none;}
  body.framed #cab{display:block;position:relative;width:min(98vw,96vh);aspect-ratio:1/1;margin:auto;}
  body.framed #cabart,body.framed #cabflame{display:block;position:absolute;inset:0;width:100%;height:100%;object-fit:fill;}
  body.framed #cabflame{pointer-events:none;animation:flameflicker 1.25s infinite;}
  body.framed #screen{position:absolute;left:var(--sl);top:var(--st);width:var(--sw);height:var(--sh);
    border-radius:0;background:#000;}
  body.framed #tag{bottom:0.4em;}
  @keyframes flameflicker{ 0%,100%{opacity:.92} 12%{opacity:1} 20%{opacity:.66} 28%{opacity:.98}
    42%{opacity:.8} 55%{opacity:1} 63%{opacity:.58} 71%{opacity:.95} 85%{opacity:.86} 93%{opacity:1} }
</style>
</head>
<body>
<div id="frame"><div id="wrap">
  <div id="cab"><img id="cabart" alt=""><img id="cabflame" alt=""><canvas id="screen"></canvas></div>
  <div id="tag">◄ ► move (grill + toaster) · F flip · C cheese · X toast bun · SPACE = HEY BILLY! · CO-OP: G/U handoff · T/O drop · R restart · S sound</div>
</div></div>

<script src="campaign.js"></script>

<script>
"use strict";
const pm = globalThis.PM, S = pm.Stage;
const Q = new URLSearchParams(location.search);
const SCREENS = Q.get("screens") === "1" ? 1 : 2;
const MODE = Q.get("mode") || "family";
const ITEMS = (Q.get("items") || "").toLowerCase() === "full" ? pm.ITEMS_FULL_MENU : null;
// MELTDOME (?battle or ?mode=meltdome): the FRIENDLY grill-off — the SAME shared grill + one Billy + one diner
// as co-op, but INDIVIDUAL scoring (pure merit, NO sabotage). Most CLEAN orders when the dinner bell rings wins.
const BATTLE = Q.has("battle") || (Q.get("mode") || "").toLowerCase() === "meltdome";
const BATTLE_SECS = Math.max(20, parseInt(Q.get("secs") || "90", 10));   // the service clock (?secs=)
const PLAYERS = BATTLE ? 2 : (Q.get("players") === "2" ? 2 : 1);   // battle is always 2 cooks; 2 = co-op tug-of-war
const GRILL = parseInt(Q.get("grill") || "6", 10);
// HEROES (school cafeteria) skin — base wired. ?skin=school, or auto on the 2up HEROES frame.
const SKIN = (Q.get("skin") || (Q.get("frame") === "2up-heroes" ? "school" : "diner")).toLowerCase();
const SCHOOL = SKIN === "school";
document.body.classList.toggle("school", SCHOOL);
// BUILD tag (?build=mark1) — the airy-engine generation; surfaced on screen, tab title + the deck strip.
// These open as DESKTOP modes (the big gingham deck) — NOT the tiny cab cutout — so they're easy to find
// while iterating, and read JAILBREAK (FULL MENU) out of the gate. (Joe, 2026-06-18.)
const BUILD = (Q.get("build") || "").toUpperCase();
const CAB_NAME = SCHOOL ? "PATTY MELT'S HEROES" : "PATTY'S POP-UP";
document.title = CAB_NAME + (BUILD ? " — " + BUILD : "") + " · JAILBREAK";
{ const tagEl = document.getElementById("tag");           // stamp the deck strip so the desktop build is findable
  if (tagEl && BUILD) tagEl.innerHTML =
    "<b style='color:#ffd27a'>" + CAB_NAME + " — " + BUILD + " · JAILBREAK</b> &nbsp;·&nbsp; " + tagEl.textContent; }
// EXPERIMENT (Joe's call): reuse the big HEROES KITCHEN scene as a DIM ambient backdrop behind the live
// grill (depth-stack trick) — heavily darkened so the live slots stay readable. If it reads cluttered,
// pull it (see docs/NEEDED_SPRITES.md for the clean per-state school grill surface to generate instead).
let heroBg = null;
// ?art=3d never shows this backdrop (the 3D school kitchen IS the room), and decoding + drawing the 6400×4267 PNG was the
// ~400 ms first frame Joe's HEROES profile caught — so under ?art=3d it is not loaded at all.
if (SCHOOL && (Q.get("art") || "").toLowerCase() !== "3d") { heroBg = new Image(); heroBg.src = "../assets/sprites/grill/bg-heroes-kitchen.png"; }
// TODO(next session): HEROES polish — (1) tune school GRILL SIZES per edition (cafeteria = bigger line?
//   the 1up arcade rule keeps school burger-only; 2up heroes can vary) — placeholder uses ?grill default 6.
//   (2) real student/lunch-lady sprites for the cafeteria regulars + a lunch-TRAY vessel under items
//   (placeholder: recolored diner bodies + the existing tray-school plate). (3) heroes food sprites if any.

const cv = document.getElementById("screen"); let ctx = cv.getContext("2d");   // (let: ?art=3d one-screen renders into an offscreen first)
// FRAMED cabs: drop the live two-screen render into the real 2up art's two cutouts (measured % of the
// 1024² render), with the lit Grillscreen FLAME flickering on top. ?frame=2up-diner|popup|heroes (2-screen only).
const FRAMES = {
  "2up-diner":  { art:"cab-2up-diner.png",  flame:"cab-2up-diner-flame.png",  rect:{ sl:30.2, st:40.7, sw:39.2, sh:22.0 } },
  "2up-popup":  { art:"cab-2up-popup.png",  flame:"cab-2up-popup-flame.png",  rect:{ sl:30.2, st:40.7, sw:39.2, sh:22.0 } },
  "2up-heroes": { art:"cab-2up-heroes.png", flame:"cab-2up-heroes-flame.png", rect:{ sl:33.5, st:37.3, sw:37.9, sh:19.1 } },
};
const FRAME = SCREENS === 2 ? FRAMES[(Q.get("frame") || "").toLowerCase()] : null;
const W = SCREENS === 2 ? 1280 : 720;
const H = FRAME ? Math.round(W * FRAME.rect.sh / FRAME.rect.sw) : 600;   // match the cutout aspect (no stretch)
cv.width = W; cv.height = H;
if (FRAME) {
  document.body.classList.add("framed");
  const cab = document.getElementById("cab"), art = document.getElementById("cabart"), flame = document.getElementById("cabflame");
  for (const [k, v] of Object.entries(FRAME.rect)) cab.style.setProperty("--" + k, v + "%");
  art.onload = () => { cab.style.aspectRatio = art.naturalWidth + "/" + art.naturalHeight; };
  art.src = "../assets/cab/" + FRAME.art;
  flame.src = "../assets/cab/" + FRAME.flame;
} else {
  document.getElementById("wrap").style.aspectRatio = W + "/" + H;
}

// the two view rects (layout-driven so one render serves both cabs)
const KIT = SCREENS === 2 ? { x:0, y:0, w:640, h:H } : { x:0, y:0, w:W, h:372 };
const DIN = SCREENS === 2 ? { x:640, y:0, w:640, h:H } : { x:0, y:372, w:W, h:H-372 };
// ---------- ?art=3d — THE 3D KITCHEN ART (render-only, behind a toggle; default stays the painted 2D art) ----------
// Built by the 3D PIPELINE (assets/art3d/, see art3d.js). Every draw reads engine state; nothing here writes it, so
// web/engine.js + parity never see it. 2-screen diner kitchen, 6-slot grill only — anything else falls back to 2D.
const ART3D_ON = (Q.get("art") || "").toLowerCase() === "3d";   // diner, HEROES (pass 3), co-op + the MeltDome battle (pass 4)
if (ART3D_ON && globalThis.ART3D) ART3D.load(SCHOOL ? "../assets/art3d/heroes/" : "../assets/art3d/");
// HEROES costume OPTIONS (Joe picks): ?costume=A Patty's gold captain apron · B Chrissy's red bandana · AB both
const COSTUME = (Q.get("costume") || "").toUpperCase();
function art3d() { return ART3D_ON && globalThis.ART3D && ART3D.ready && game && game.slots.length === 6; }
const FLIP_FRAMES = 8, FLIP_HOLD_MS = 1000 / 12;   // 8 drawings held "on twos" at 24fps = 12 changes/s (~0.67s)
const flipAnim = [], burntAnim = [];
const BILLY_3D_SCALE = 2.0;                         // Billy at 2x true scale on the dining camera (readable; tune here)
let bellT = -1e9, _br_last = 0;                                // per slot: performance.now() when the engine flipped it

// ---------- AIRY SPATULA GLIDE (the new engine feel) + the SPATULA SPRITE SEAM ----------
// Render-only air-cushion spring (lineage: cabinet.html springCursors → HIGH TABLE glideKnocker).
// The engine cursor SNAPS between integer slots (parity-locked); the DRAWN spatula GLIDES to it,
// banking + hopping as it whips across the grill. 2D here (the 2up grill is TWO rows, so x AND y).
// Parity-safe: _spat is render-side scratch, never read by the engine / node parity runs.
// Tuned near CRITICAL damping (zeta = DAMP / (2*sqrt(ACCEL)) ≈ 0.97): a hair under critical keeps the
// airy life but the blade settles on the slot with no visible overshoot wobble; ACCEL up = snappier track.
const KGLIDE_ACCEL = 240, KGLIDE_DAMP = 30;
function kitchenSpat(s, geo) {
  const now = performance.now();
  let dt = (now - (kitchenSpat._t == null ? now : kitchenSpat._t)) / 1000;
  kitchenSpat._t = now;
  if (dt > 0.05) dt = 0.05; if (dt < 0) dt = 0;          // tab-stall clamp — catch up, don't warp
  const center = (idx) => {
    if (geo.tcells && idx >= geo.gridN)                 // cursor is on the BUN TOASTER (past the grill slots)
      return geo.tcells[idx - geo.gridN] || { x: geo.ox, y: geo.oy };
    return geo.slotXY(idx); };                          // a grill bay (single-row line)
  if (!s._spat || s._spat.length !== s.players.length)   // (re)seed on a fresh game / grill resize
    s._spat = s.players.map((pl) => { const z = center(pl.cursor); return { x:z.x, y:z.y, vx:0, vy:0 }; });
  for (let pi = 0; pi < s.players.length; pi++) {
    const g = s._spat[pi], t = center(s.players[pi].cursor);
    g.vx += ((t.x - g.x) * KGLIDE_ACCEL - g.vx * KGLIDE_DAMP) * dt;
    g.vy += ((t.y - g.y) * KGLIDE_ACCEL - g.vy * KGLIDE_DAMP) * dt;
    g.x += g.vx * dt; g.y += g.vy * dt;
  }
  return s._spat;
}
// THE SPATULA SPRITE SEAM — incoming art (docs/SPATULA_SHEET.md) drops in here & lights up on reload.
// Absent = the per-player vector spatula (the placeholder) carries it; present = Patty's real spatula.
const SPAT_SPR = {};                                       // (legacy single-spatula art; the pair now lives in lib/spatulas.js)
PMSpat.load("../assets/sprites/grill/");
const SPAT_FOOD_IMG = {};
for (const [k, f] of [["cheese", "cheese-fresh"], ["bread", "bread"], ["rye", "bread-rye"], ["raw", "patty-raw"],
                      ["seared", "patty-seared"], ["done", "patty-done"], ["burnt", "patty-burnt"]]) {
  const im = new Image(); im.onload = () => { SPAT_FOOD_IMG[k] = im; }; im.src = "../assets/sprites/grill/" + f + ".png";
}
const spatFood = (k) => SPAT_FOOD_IMG[k] || null;
for (const [k, f] of [["level", "spatula-level"], ["flip", "spatula-flip"], ["toast", "spatula-toast"]]) {
  const im = new Image(); im.onload = () => { SPAT_SPR[k] = im; }; im.src = "../assets/sprites/grill/spatula/" + f + ".png";
}
// GRILL-STATE BACKGROUND — the flat-top art swaps with buried_index so the desktop grill visibly
// HEATS UP with the rush (empty → cluttered → steaming → overloaded → on fire). Vector fallback if absent.
const GRILL_BG = {};
for (const n of ["empty", "cluttered", "steaming", "overloaded", "disaster"]) {
  const im = new Image(); im.onload = () => { GRILL_BG[n] = im; }; im.src = "../assets/sprites/grill/grill-" + n + ".png";
}
function grillBgFor(b) {
  if (b >= pm.BURIED_BARKING)  return GRILL_BG.disaster;    // ≥0.78 — on fire
  if (b >= pm.BURIED_RESTLESS) return GRILL_BG.overloaded;  // ≥0.55 — hot
  if (b >= 0.30) return GRILL_BG.steaming;
  if (b >= 0.15) return GRILL_BG.cluttered;
  return GRILL_BG.empty;
}
// FOOD FX ART — the CHEESE SPLAT (on a cheese drop) + the BURN smoke column (when a patty's lost to
// the grill). Big painterly one-shots; absent = the vector note/ring carries it. (assets/sprites/grill/fx-*)
const FOOD_FX = { burn: [] };
{ const s = new Image(); s.onload = () => { FOOD_FX.splat = s; }; s.src = "../assets/sprites/grill/fx-cheese-splat.png";
  for (const n of [1, 2, 3]) { const im = new Image(); im.onload = () => { FOOD_FX.burn[n - 1] = im; };
    im.src = "../assets/sprites/grill/fx-burn-" + n + ".png"; } }
// FLIP-POP + FOOD FX — render-only beats keyed to engine state (recipe step advance / a burnt slot),
// so the grill READS. k: "note" (♪ flip), "splat" (cheese drop), "smoke" (a patty burnt away).
let grillPops = [];
function detectFlips(slotXY) {
  const seen = grillPops._seen || (grillPops._seen = []);
  for (let i = 0; i < game.slots.length; i++) {
    const p = game.slots[i], prev = seen[i], c = slotXY(i);
    if (p && prev && prev.born === p.born && p.step > prev.step) {       // same patty, an action just landed
      if (prev.stage === S.SEAR_A && p.stage === S.SEAR_B) flipAnim[i] = performance.now();   // ?art=3d: play the flip
      if (game.flash === "CHEESE!" && FOOD_FX.splat) grillPops.push({ k: "splat", x: c.x, y: c.y, t: 0, life: 18 });
      else grillPops.push({ k: "note", x: c.x, y: c.y, t: 0, life: 22, note: game.flash === "TOAST!" ? "♫" : "♪" });
    } else if (prev && !p && game.flash === "BURNT!") {                  // a patty just BURNED off this slot
      burntAnim[i] = performance.now();                                   // ?art=3d: the charred patty lingers + smokes
      grillPops.push({ k: "smoke", x: c.x, y: c.y, t: 0, life: 46 });
    }
    seen[i] = p ? { born: p.born, step: p.step, stage: p.stage } : null;
  }
}
// draw one FX pop; returns true while alive
function drawPop(f, rad) {
  const k = f.t++ / f.life;
  if (f.k === "smoke") {                                  // charred patty + a rising, growing, fading smoke column
    const fr = FOOD_FX.burn[Math.min(2, Math.floor(k * 3))] || FOOD_FX.burn[FOOD_FX.burn.length - 1];
    if (fr && fr.width) { const w = rad * 2.4, h = w * fr.height / fr.width, rise = k * rad * 0.6;
      ctx.globalAlpha = k < 0.7 ? 1 : Math.max(0, (1 - k) / 0.3);
      ctx.drawImage(fr, f.x - w / 2, f.y + rad * 0.5 - h - rise, w, h); ctx.globalAlpha = 1; }
  } else if (f.k === "splat" && FOOD_FX.splat) {          // cheese splash blooms then settles
    const sp = FOOD_FX.splat, sc = (0.7 + k * 0.5), w = rad * 2.0 * sc, h = w * sp.height / sp.width;
    ctx.globalAlpha = Math.max(0, 1 - k); ctx.drawImage(sp, f.x - w / 2, f.y + rad * 0.4 - h, w, h); ctx.globalAlpha = 1;
  } else if (f.k === "note") {                            // the singing-spatula note + contact ring
    ctx.globalAlpha = 1 - k;
    txt(f.note, f.x + 12, f.y - 8 - k * 18, 18 + k * 6, COL.cheese, "center", 800);
    ctx.strokeStyle = "rgba(255,210,120," + (1 - k).toFixed(2) + ")"; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(f.x, f.y, 8 + k * 18, 0, 7); ctx.stroke(); ctx.globalAlpha = 1;
  }
  return f.t < f.life;
}
const CURS_HUE = ["#ff5a4d", "#6fb0e0"];                  // P1 red spatula · P2 (Chrissy) blue — vector fallback

// PATTY — the cook herself, a reactive foreground avatar (idle → flip on an action → serve on a
// handoff → cheer at BIG GRILL ENERGY). State-driven show-don't-tell. (TEST placement — tunable.)
const PATTY_SPR = {}, CHRISSY_SPR = {};
// SKIN-AWARE COOK ART: HEROES (school) loads the Cougars cook set; if a school file is missing it falls back
// to the diner art. So the HEROES COOK set (Patty + Chrissy) swaps together; Billy (the runner) is separate.
const COOK_SUFFIX = SCHOOL ? "-school" : "";
// DINER cast = the 0701 masters, re-cut per-pose into assets/chars/cast/ (Patty turnaround: idle/serve/cheer/
// profile; Chrissy action set: idle/flip/cheese/serve/cheer/scrape/run). SCHOOL still loads the top-level
// -school files, falling back to the diner cast when a school pose is missing.
function loadCook(map, base, poses) {
  for (const k of poses) {
    const im = new Image();
    im.onload = () => { map[k] = im; };
    im.onerror = () => { const d = new Image(); d.onload = () => { map[k] = d; }; d.src = "../assets/chars/cast/" + base + "-" + k + ".png"; };
    im.src = SCHOOL ? ("../assets/chars/" + base + "-school-" + k + ".png")   // patty-school-idle.png
                    : ("../assets/chars/cast/" + base + "-" + k + ".png");    // cast/patty-idle.png
  }
}
// PLATERS both use CLEAN, FULL-BODY, griddle-free poses (consistent framing at the assembly). Patty holds the
// plate on a serve; Chrissy (co-op) cheers. The griddle-bearing action frames (flip/cheese/scrape) belong to a
// grill cook, not a plater, so they're intentionally NOT loaded here.
loadCook(PATTY_SPR, "patty", ["idle", "serve", "cheer"]);               // Patty is turnaround-only (idle/serve/cheer)
loadCook(CHRISSY_SPR, "chrissy", ["idle", "cheer"]);                    // full-body, stray-free; serve → cheer via fallback
// BILLY — the runner. A 6-frame COLOR walk cycle (billy-walk-0..5, run-with-tray) cycles while he crosses
// the floor; at the pass he PRESENTS the order (billy-serve). Absent art → the vector kid (drawBillyVec).
const BILLY_WALK = [], BILLY_SPR = {};
for (let i = 0; i < 6; i++) { const im = new Image(); const j = i; im.onload = () => { BILLY_WALK[j] = im; }; im.src = "../assets/chars/billy-walk-" + i + ".png"; }
for (const [k, f] of [["serve", "billy-serve"], ["turn", "billy-turn"], ["slack", "billy-slack"]]) {
  const im = new Image(); im.onload = () => { BILLY_SPR[k] = im; }; im.src = "../assets/chars/" + f + ".png";
}
let _billyPhase = 0, _billyPrev = 0, _billyFace = 1;     // walk-cycle phase · last pos (for velocity) · facing (1=right)
const PATTY_H = 0.50, PATTY_X = -0.05;                   // fraction of KIT height / x nudge off the left edge
function pickPattyPose() {
  const ov = Q.get("pose"); if (ov && PATTY_SPR[ov]) return ov;   // ?pose=cheer — QA/preview override
  const now = performance.now(), P = pickPattyPose;
  if (P._served == null) P._served = game.served;
  if (game.served > P._served) P._serveT = now;
  P._served = game.served;
  if (game.flash === "CHEESE!") P._cheeseT = now;
  if (game.flash === "FLIP!" || game.flash === "TOAST!") P._flipT = now;
  if (now - (P._serveT  || -9e9) < 650) return "serve";
  if (now - (P._cheeseT || -9e9) < 360) return "cheese";
  if (now - (P._flipT   || -9e9) < 360) return "flip";
  if (game.combo >= pm.FLOW_COMBO) return "cheer";
  return "idle";
}
// pose fallback so a cook missing a given frame degrades gracefully (Patty has no flip/cheese → serve → idle)
function cookSprite(map, pose) {
  const chain = { cheese: ["cheese", "idle"], flip: ["flip", "idle"],   // grill actions → idle for a plater (she's not at the grill)
                  serve: ["serve", "cheer", "idle"], cheer: ["cheer", "idle"], idle: ["idle"] };
  for (const k of (chain[pose] || [pose, "idle"])) if (map[k]) return map[k];
  return map.idle;
}
// A presiding cook, sized to a column and anchored to the kitchen floor. `zone` = {cx (foot x), footY, maxH, face}.
function drawCook(sprMap, zone) {
  const sp = cookSprite(sprMap, pickPattyPose());
  if (!sp || !sp.width) return;
  const h = zone.maxH, w = h * sp.width / sp.height;
  const x = zone.cx - w / 2, ty = zone.footY - h;
  // soft floor shadow so she's planted, not floating
  ctx.fillStyle = "rgba(0,0,0,0.30)"; ctx.beginPath(); ctx.ellipse(zone.cx, zone.footY - 4, w * 0.34, 7, 0, 0, 7); ctx.fill();
  if (zone.face < 0) { ctx.save(); ctx.translate(x + w, ty); ctx.scale(-1, 1); ctx.drawImage(sp, 0, 0, w, h); ctx.restore(); }
  else ctx.drawImage(sp, x, ty, w, h);
}
// THE PLATERS — Patty (+ Chrissy in co-op) stand at the ASSEMBLY end and ACT on every serve (plate/serve pose),
// handing the finished order to Billy at the pass. They're WORKING the line, not decoration.

// SHARED scale, keyed to the LEVEL frame's height, so flip/toast keep the same blade size (patty just
// flies higher) — frames don't jump scale on swap. Pivot ≈ the blade contact point (tunable).
const SPAT_TARGET_H = 66, SPAT_AX = 0.42, SPAT_AY = 0.80;
function spatScale() { const th = art3d() ? 44 : SPAT_TARGET_H;   // the 3D wells are smaller on screen
  return (SPAT_SPR.level && SPAT_SPR.level.height) ? th / SPAT_SPR.level.height : 0.05; }
// draw one player's spatula at its sprung position — Patty's real spatula if present, else the vector placeholder
function drawSpatula(g, pi, flash) {
  const lift = Math.min(7, Math.abs(g.vx) * 0.012);       // hops up as it whips between slots
  const lean = Math.max(-0.32, Math.min(0.32, g.vx * 0.0009));  // banks into the travel direction
  ctx.save(); ctx.translate(g.x, g.y - lift); ctx.rotate(lean);
  const sp = (flash === "FLIP!" && SPAT_SPR.flip) ? SPAT_SPR.flip
           : (flash === "TOAST!" && SPAT_SPR.toast) ? SPAT_SPR.toast : SPAT_SPR.level;
  if (sp && sp.width) {
    const SC = spatScale();
    if (pi === 1) ctx.filter = "hue-rotate(150deg) saturate(1.15) brightness(1.05)";  // Chrissy = bluer
    ctx.drawImage(sp, -sp.width * SPAT_AX * SC, -sp.height * SPAT_AY * SC, sp.width * SC, sp.height * SC);
    ctx.filter = "none";
  } else {                                                 // PLACEHOLDER: the per-player vector spatula
    ctx.fillStyle = CURS_HUE[pi] || CURS_HUE[0];
    ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(-9, -14); ctx.lineTo(9, -14); ctx.closePath(); ctx.fill();
  }
  ctx.restore();
}

// ---------- TIME-OF-DAY MOOD (render-only, parity-safe) ----------
// Each shift carries a clock ("6:00 AM" … "11:30 PM"); that hour washes the whole scene so the campaign
// visibly moves from cool-blue dawn → bright midday → amber dinner → deep night. No art — just a tint.
function shiftHour24() {
  const m = /(\d+):(\d+)\s*(AM|PM)/i.exec(shift().time || "");
  if (!m) return 12;
  let h = parseInt(m[1], 10) % 12; if (/pm/i.test(m[3])) h += 12;
  return h;
}
function todTint(h) {                        // [r,g,b,alpha] full-frame wash (source-over); midday ≈ invisible
  if (h < 6)  return [26, 30, 92, 0.30];     // small hours — deep blue
  if (h < 9)  return [80, 100, 170, 0.15];   // dawn — cool blue-lavender
  if (h < 11) return [255, 214, 150, 0.06];  // morning — soft warm
  if (h < 15) return [255, 238, 205, 0.03];  // midday — bright, barely there
  if (h < 17) return [255, 176, 92, 0.10];   // afternoon — warming
  if (h < 20) return [255, 120, 58, 0.16];   // dinner / golden hour — amber
  if (h < 22) return [48, 50, 122, 0.20];    // evening — blue
  return [30, 32, 96, 0.26];                 // night — deep blue-purple
}
function drawTimeOfDay() {
  const t = todTint(shiftHour24());
  ctx.fillStyle = "rgba(" + t[0] + "," + t[1] + "," + t[2] + "," + t[3] + ")";
  ctx.fillRect(0, 0, W, H);
}

const SIM_DT = 1000 / pm.TPS;

// ---------- 2-PLAYER ARCADE GAMEPAD (self-contained, additive, parity-safe) ----------
// Polled once per frame from loop(). Pad 0 → P1 (pi=0); pad 1 → P2 (pi=1, co-op only).
// Direction is HELD (throttled to match the keyboard cadence); the four face buttons are
// EDGE-detected (fire once per press). All wrapped in try/catch — no pad = no-op.
const PAD_MOVE_IV = 6;                      // frames between held-direction moves (Ghost owns the deadzone)

      else if (phase === "initials" && pi === 0) {   // pad 0 drives the arcade initials entry
        const gg = Ghost.read(gp);
        if (gg.y < 0 && _entryPrev.y >= 0) entryName[entryPos] = (entryName[entryPos] + 1) % ENTRY_CH.length;         // up
        else if (gg.y > 0 && _entryPrev.y <= 0) entryName[entryPos] = (entryName[entryPos] + ENTRY_CH.length - 1) % ENTRY_CH.length; // down
        if (gg.x < 0 && _entryPrev.x >= 0) entryPos = Math.max(0, entryPos - 1);
        else if (gg.x > 0 && _entryPrev.x <= 0) entryPos = Math.min(2, entryPos + 1);
        if (anyEdge) { if (entryPos < 2) entryPos++; else finalizeEntry(); }
        _entryPrev = { x: gg.x, y: gg.y };
      }
      else if (phase === "bonus" && pi === 0) {    // pad 0 drives the bonus cart (held, throttled)
        if (mini.done) { if (anyEdge) endBonus(); }
        else { const d = padDir(gp);
          if (d === 0) st.moveCD = 0;
          else if (st.moveCD <= 0) { pm.mini_move(mini, d); st.moveCD = PAD_MOVE_IV; }
          else st.moveCD--; }
      }
      else if (game.over || game.won) {
        if (anyEdge) {
          if (game.won) nextShift();               // ROUND CLEAR → next shift (or campaign complete)
          else if (continueT > 0) billyBack();
          else submitRun();                        // continue expired → score entry then title
        }
      } else {
        // direction (held, throttled)
        const d = padDir(gp);
        if (d === 0) st.moveCD = 0;
        else if (st.moveCD <= 0) { pm.move(game, d, pi); st.moveCD = PAD_MOVE_IV; }
        else st.moveCD--;
        // face buttons (edge-detected): A=FLIP B=CHEESE X=TOAST Y/RT=HEY BILLY
        if (anyEdge) wakeAudio();
        if (anyFresh(0)) pm.flip(game, pi);
        if (anyFresh(1)) pm.add_cheese(game, pi);
        if (anyFresh(2)) pm.toast(game, pi);
        if (anyFresh(3) || anyFresh(7)) pm.hey_billy(game, pi);
        if (anyEdge) actionSfx();               // action sound for the gamepad path too
      }
      // latch this frame's pressed state for next-frame edge detection
      const cur = []; for (let i = 0; i < gp.buttons.length; i++) cur[i] = pressed(gp, i);
      st.btn = cur;
    }
  } catch (err) { /* absent / flaky gamepad API — no-op */ }
}

const DEMO = Q.has("demo");                 // self-playing (attract / QA) — the real auto-player drives it
function step() {
  if (phase === "bonus") { if (mini && !mini.done) pm.mini_tick(mini); return; }   // done → wait for a press to bank + advance
  if (phase === "ready" || paused || game.over || game.won) return;
  if (phase === "attract") {              // the title-screen demo: the auto-player cooks, loops forever
    pm.auto_step(game); pm.tick(game); if (BR) BR.onTick(game);
    if (game.served > lastServed) { spawnServeFX(); lastServed = game.served; }
    if (game.fails > lastFails)  { spawnWalkout();  lastFails = game.fails; }
    if (game.over || game.won) reset();   // never lets the demo end — restart the shift silently
    return;
  }
  if (DEMO) pm.auto_step(game);
  const bServed = game.served, bScore = game.score;
  const _pb = game.billy;
  pm.tick(game); if (BR) BR.onTick(game);
  if (game.billy > _pb + 0.5) bellT = performance.now();   // HEY BILLY! → the bell on the pass rings (render-only)
  if (game.players.length === 2 && game.served > bServed) {   // attribute the clean serve to the cook Billy faced
    const pi = game.billy_facing;
    cook[pi].serves += (game.served - bServed);
    cook[pi].score  += (game.score - bScore);
  }
  audioTick(game);                        // consequence sounds (order-up bell, fail buzzer, flow, win, over)
  // serve / fail deltas → dining-room FX (a plate carried out on a serve, a walkout on a fail)
  if (game.served > lastServed) { spawnServeFX(); lastServed = game.served; }
  if (game.fails > lastFails)  { spawnWalkout();  lastFails = game.fails; }
}

// Billy's smoothed position tracks his ATTENTION: full = at the pass, drained = out bussing tables.

// draw a subway-tile grid inside a clipped rect (grout lines only) — the shared wall/backsplash texture.
function tileGrid(x, y, w, h, grout, rowH, colW, colOff) {

}

// a small plate-with-burger (the finished order). build (0..1) STACKS the layers in turn for the
// ASSEMBLY build animation; default 1 = fully assembled (Billy's carry, the pass ledge, the ready plate).
function drawCarryPlate(x, y, build = 1) {
  ctx.save();
  ctx.fillStyle = "rgba(0,0,0,0.25)"; ctx.beginPath(); ctx.ellipse(x, y + 3, 13, 4, 0, 0, 7); ctx.fill();
  ctx.fillStyle = COL.cream; ctx.beginPath(); ctx.ellipse(x, y, 13, 5, 0, 0, 7); ctx.fill();     // plate
  // the stack builds bottom→top; each layer drops into place in turn (bun ▸ patty ▸ cheese ▸ top bun)
  plateLayer(x, y - 3, 8, 4, "#5a3a1e", 0.05, build);   // bun bottom
  plateLayer(x, y - 5, 8, 4, COL.done,  0.34, build);   // patty
  plateLayer(x, y - 6, 9, 3, COL.cheese, 0.60, build);  // a melty cheese slice, draping a touch wider
  plateLayer(x, y - 8, 7, 3, "#e6b23c", 0.82, build);   // top bun
  ctx.restore();
}
// one stacked layer; before its `appear` threshold it's absent, then it drops+fades into place (smoothstep).
function plateLayer(x, baseY, rx, ry, col, appear, build) {
  if (build < appear) return;
  const local = Math.min(1, (build - appear) / 0.14), e = local * local * (3 - 2 * local);
  ctx.globalAlpha = 0.35 + 0.65 * e;
  ctx.fillStyle = col; ctx.beginPath(); ctx.ellipse(x, baseY - (1 - e) * 9, rx, ry, 0, 0, 7); ctx.fill();
  ctx.globalAlpha = 1;
}

  txt("BONUS " + String(s.score).padStart(5, "0"), W - 40, 144, 20, COL.cheese, "right", 700);
  const gx0 = 96, gw = W - 192, laneW = gw / pm.MINI_LANES;
  const gy0 = 182, gh = H - 300, rowH = gh / pm.MINI_ROWS;
  const laneX = (l) => gx0 + l * laneW + laneW / 2, rowY = (r) => gy0 + r * rowH + rowH / 2;
  ctx.strokeStyle = "rgba(255,255,255,0.06)"; ctx.lineWidth = 1;
  for (let l = 0; l <= pm.MINI_LANES; l++) { ctx.beginPath(); ctx.moveTo(gx0 + l * laneW, gy0); ctx.lineTo(gx0 + l * laneW, gy0 + gh); ctx.stroke(); }
  for (const it of s.items) {
    const x = laneX(it[0]), y = rowY(it[1]), bw = laneW * 0.56, bh = rowH * 0.56;
    ctx.fillStyle = accent; ctx.fillRect(x - bw / 2, y - bh / 2, bw, bh);
    ctx.strokeStyle = "rgba(255,255,255,0.28)"; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(x - bw / 2, y); ctx.lineTo(x + bw / 2, y);
    ctx.moveTo(x, y - bh / 2); ctx.lineTo(x, y + bh / 2); ctx.stroke();
  }
  const catchRow = chill ? pm.MINI_ROWS - 1 : 0, cxp = laneX(s.cart), cyp = rowY(catchRow), cw = laneW * 0.82;
  ctx.fillStyle = COL.cheese; ctx.fillRect(cxp - cw / 2, cyp - 13, cw, 26);
  txt(chill ? "▲" : "▼", cxp, cyp + 7, 18, "#3a2a08", "center", 800);
  if (s.done) txt(s.score > 0 ? "STOCKED!  +" + s.score + " — press SPACE" : "FORFEIT — press SPACE",
      W / 2, gy0 + gh + 40, 24, s.score > 0 ? COL.good : COL.bad, "center", 800);
  else { if (s.flash) txt(s.flash, W / 2, gy0 + gh + 20, 20, COL.cheese, "center", 800);
    txt(chill ? "◀ ▶  catch what falls — pure bonus, no fail" : "◀ ▶  grab the backlog — clear the quota or forfeit",
        W / 2, gy0 + gh + 44, 15, COL.dim, "center", 600); }
}

// ---------- input — the 2-way stick + buttons (HEY BILLY is the star) ----------
addEventListener("keydown", (e) => {
  const k = e.key.toLowerCase();
  wakeAudio();                                     // first keypress arms WebAudio
  if (k === "s") { audio.setMuted(!audio.muted); return; }   // S = speaker toggle (mute)
  if (phase === "attract") { startGame(); e.preventDefault(); return; }   // START — any key begins the campaign
  if (phase === "ready") { e.preventDefault(); return; }                  // GET READY — inputs locked till GO!
  if (phase === "won_campaign") { submitRun(); e.preventDefault(); return; }   // campaign clear — score entry then title
  if (phase === "battle_over") { toAttract(); e.preventDefault(); return; }    // grill-off decided — back to the title
  if (phase === "initials") {                    // arcade initials entry: ↑↓ letter · ←→ position · SPACE/ENTER confirm
    if (k === "arrowup" || k === "w") entryName[entryPos] = (entryName[entryPos] + 1) % ENTRY_CH.length;
    else if (k === "arrowdown" || k === "s") entryName[entryPos] = (entryName[entryPos] + ENTRY_CH.length - 1) % ENTRY_CH.length;
    else if (k === "arrowleft" || k === "a") entryPos = Math.max(0, entryPos - 1);
    else if (k === "arrowright" || k === "d") entryPos = Math.min(2, entryPos + 1);
    else if (k === " " || k === "enter" || k === "f") { if (entryPos < 2) entryPos++; else finalizeEntry(); }
    e.preventDefault(); return;
  }
  if (phase === "board") { toAttract(); e.preventDefault(); return; }          // high-score table → back to the title
  if (phase === "bonus") {                        // back-of-house: drive the cart under the falling stock
    if (mini.done) { if (k === " " || k === "enter" || k === "f") endBonus(); }   // bank + on to the next shift
    else if (k === "arrowleft" || k === "a" || k === "j") pm.mini_move(mini, -1);
    else if (k === "arrowright" || k === "d" || k === "l") pm.mini_move(mini, 1);
    e.preventDefault(); return;
  }
  if (k === "r") { BATTLE ? startBattle() : startShift(shiftIdx); return; }    // rematch / retry THIS shift
  if (k === "p") { paused = !paused; return; }
  if (game.over) { if (BATTLE) return; if (continueT > 0) billyBack(); else submitRun(); return; }   // (battle end = the clock)
  if (game.won && (k === " " || k === "enter")) { nextShift(); return; }   // ROUND CLEAR → next shift (or campaign complete)
  // P1 (PATTY): arrows / a,d + f,c,x + space/v HEY BILLY
  if (k === "arrowleft" || k === "a") pm.move(game, -1, 0);
  else if (k === "arrowright" || k === "d") pm.move(game, 1, 0);
  else if (k === "f") pm.flip(game, 0);
  else if (k === "c") pm.add_cheese(game, 0);
  else if (k === "x") pm.toast(game, 0);
  else if (k === " " || k === "v" || k === "b") pm.hey_billy(game, 0);
  // P2 (CHRISSY, co-op): j,l + i,k,. + m HEY BILLY (engine no-ops these in 1P)
  else if (k === "j") pm.move(game, -1, 1);
  else if (k === "l") pm.move(game, 1, 1);
  else if (k === "i") pm.flip(game, 1);
  else if (k === "k") pm.add_cheese(game, 1);
  else if (k === ".") pm.toast(game, 1);
  else if (k === "m") pm.hey_billy(game, 1);
  // CO-OP teamwork: HANDOFF (pass to partner's half) + DROP (sacrifice a jammed slot)
  else if (k === "g") pm.handoff(game, 0);
  else if (k === "t") pm.drop(game, 0);
  else if (k === "u") pm.handoff(game, 1);
  else if (k === "o") pm.drop(game, 1);
  else return;
  actionSfx();                                     // singing-spatula FLIP / cheese fwump / toast / HEY BILLY holler
  e.preventDefault();
}, { passive: false });

// QA/attract pre-roll: ?warm=N runs N sim steps synchronously so a screenshot shows a live room
// (headless rAF virtual-time barely advances the accumulator). Mirrors cookoff.html's ?warm.
const WARM = parseInt(Q.get("warm") || "0", 10);
for (let i = 0; i < WARM && !(game.over || game.won); i++) step();
billyPos = billyTarget();                 // snap him into place so frame 1 isn't mid-walk

requestAnimationFrame(loop);
</script>
