<!DOCTYPE html>
<!-- PATTY MELT — MELTDOME (2-up two-monitor competitive mode: TWO CHEFS ENTER, TWO CHEFS LEAVE — a friendly grill-off).  *** for Christine & Phillip Coleman. ***
     The two-screen 2up cab, used LITERALLY: two independent grills race side by side, Patty vs Chrissy.
     This is the COMPETITIVE counterpart to the shared-grill CO-OP, with the CUTTHROAT sabotage layer.
     Each side is a plain 1P game (engine.js, parity-proven), advancing rounds until a cook gets buried.
     First buried loses; last cook standing (then high score) wins. Red-gingham widescreen, no raster art. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PATTY MELT — MELTDOME</title>
<style>
  :root { --gingham:#b5352b; --cream:#f3e6c8; --cheese:#ffd23f; }
  html,body { margin:0; height:100%; background:#1a0c0a; overflow:hidden; }
  /* a self-made red GINGHAM widescreen bezel — pure CSS, no art file (the cab's identity color) */
  #frame {
    position:absolute; inset:0; display:grid; place-items:center;
    background:
      repeating-linear-gradient(0deg,  rgba(181,53,43,.92) 0 22px, rgba(181,53,43,.55) 22px 44px),
      repeating-linear-gradient(90deg, rgba(181,53,43,.92) 0 22px, rgba(181,53,43,.55) 22px 44px),
      #7a1f18;
  }
  #screenwrap { position:relative; width:96vw; max-width:1280px; aspect-ratio:1280/600;
    border:14px solid #2a1410; border-radius:10px; box-shadow:0 0 0 6px #0a0504, 0 18px 60px #000; }
  canvas { display:block; width:100%; height:100%; image-rendering:pixelated; background:#0a0806; border-radius:4px; }
  #tag { position:absolute; bottom:-2.6em; width:100%; text-align:center; color:var(--cream);
    font:600 14px "Saira Condensed","Arial Narrow",sans-serif; letter-spacing:.12em; opacity:.85; }
</style>
</head>
<body>
<div id="frame"><div id="screenwrap">
  <canvas id="screen" width="1280" height="600"></canvas>
  <div id="tag">MELTDOME · DINNER SERVICE — most CLEAN orders when the bell rings WINS · P1 A/D·F/C/V  P2 J/L·I/K/M · R = rematch · (?cutthroat=1 adds sabotage)</div>
</div></div>
<script src="engine.js"></script>
<script src="lib/hidpi.js?v=1"></script>
<script src="sprites.js"></script>
<script src="lib/audio.js"></script>
<script src="../assets/art3d/stages/stages.manifest.js"></script>
<script src="lib/stages3d.js"></script>
<script>
"use strict";
const PM = globalThis.PM;
const audio = new PMAudio.AudioBus();
try { audio.ensure(); } catch {}
function wakeAudio() { audio.ensure(); audio.resume(); }
function sideSfx(side) {                              // success-gated cook sound for one side's last action
  const g = side.g; if (g.flash_t !== PM.TPS) return;
  const f = g.flash;
  if (f === "FLIP!") audio.spatula();
  else if (f === "CHEESE!") audio.fwump();
  else if (f === "TOAST!") audio.toastpress();
  else if (f.indexOf("BILLY") !== -1) audio.holler();
}
const cv = document.getElementById("screen"), ctx = cv.getContext("2d");
const W = cv.width, H = cv.height, MID = W / 2;
if (globalThis.PMHiDPI) PMHiDPI.setup(cv, W, H);   // (1112 art pass) device-res backing store, W×H stays the layout
const Q = new URLSearchParams(location.search);
const MODE = Q.get("mode") || "arcade", GRILL = parseInt(Q.get("grill") || "6", 10);
// HELL'S KITCHEN service race: a fixed dinner-service clock; most CLEAN service when the bell rings wins.
// Both sides run the SAME deterministic order stream (engine has no RNG → identical config = identical orders = fair).
const SHIFT_SECS = Math.max(20, parseInt(Q.get("shift") || "90", 10));   // the service clock (?shift=secs)
const SHIFT_TICKS = SHIFT_SECS * PM.TPS;
// ?art=3d — the rendered MeltDome plate (lib/stages3d.js, art3d r2): two flat-tops at the exported slot anchors,
// ortho food sprites per engine Stage. 6-slot grills only; anything missing → the 2D grid below draws. Render-only.
const ART3D_ON = (Q.get("art") || "").toLowerCase() === "3d" && !!globalThis.PMStages && PMStages.load("../assets/art3d/stages/");
const st3d = () => ART3D_ON && GRILL === 6 && PMStages.ready("meltdome");
const CUTTHROAT = Q.get("cutthroat") === "1";
// ?shell=1 (1110 r4): launched from the FRONT DOOR (front.html) — ESC = back to the menu; after the bell SPACE (or ~8 s)
// carries the result to the front door's RESULTS card. Off by default: the page behaves exactly as before.
const SHELL = Q.get("shell") === "1";
function toFront(r) { location.href = "front.html?" + (r ? "results=" + encodeURIComponent(JSON.stringify(r)) + "&" : "menu&") + "sel=" + encodeURIComponent(Q.get("sel") || ""); }
function battleResult() { const [a, b] = sides, clean = (s) => Math.max(0, s.g.served - s.g.sent_back);
  const tie = a.g.score === b.g.score && a.g.served === b.g.served && a.g.fails === b.g.fails;
  return { mode: "battle", label: Q.get("label") || "MELTDOME", skin: "diner", winner: tie ? -1 : sides.indexOf(winner), a: clean(a), b: clean(b), pa: a.g.score, pb: b.g.score }; }                            // the RPS sabotage layer — OFF by default (clean service race)
const COL = { cream:"#f3e6c8", cheese:"#ffd23f", amber:"#e0a92e", good:"#7ad17a", bad:"#ff5a4d",
  dim:"#6b5a3a", gridln:"#2a2018", raw:"#c98a5a", seared:"#7c4f2c", melt:"#ffd23f", done:"#e9a23b", burnt:"#3a2418" };

// ---------- CUTTHROAT — the RPS sabotage layer (ONE TIMER's rock-paper-scissors, on 3 buttons) ----------
// Build combo to charge a SABOTAGE; double-tap BILLY to PRIME; a button picks your play:
//   FLIP = RUSH (force their grill hot) · CHEESE = GUM (jam a slot) · BILLY = SCORCH (shove the weeds)
// The target gets a DEFEND window — same 3 buttons. RPS: FLIP > CHEESE > BILLY > FLIP. Attack beats the
// defense → it LANDS; defense beats attack → PARRIED (reflected onto the attacker); tie → fizzle.
const SAB_READY = 4;            // good serves to charge a sabotage
const PRIME_TICKS = 16, DEF_TICKS = 16, DBL_TAP = 4;   // windows (ticks @ TPS)
const BEATS = { flip:"cheese", cheese:"billy", billy:"flip" };
const PLAY = { flip:{nm:"RUSH"}, cheese:{nm:"GUM"}, billy:{nm:"SCORCH"} };
let gtick = 0;

function makeSide(name, color) {
  return { g: PM.new_game(1, MODE, 1, "diner", GRILL), auto: true, name, color, dead: false, eightySixed: 0, aud: null,
           sab: 0, lastServed: 0, lastBilly: -99, primeT: 0, incoming: null, flash: "", flashT: 0 };
}
let sides, matchOver, winner, winT;
function reset() {
  sides = [makeSide("PATTY", COL.bad), makeSide("CHRISSY", COL.cheese)];
  matchOver = false; winner = null; gtick = 0; winT = 0;
}
reset();
const other = (s) => sides.find((o) => o !== s);
function sflash(s, m) { s.flash = m; s.flashT = 8; }
function launchSab(s, play) {                    // s spends a primed charge → fires at the rival
  s.primeT = 0; s.sab = 0; const opp = other(s);
  if (!opp || opp.dead) { sflash(s, "no target"); return; }
  opp.incoming = { atk: s, play, def: DEF_TICKS };
  sflash(s, "▸ " + PLAY[play].nm + "!"); sflash(opp, "DEFEND!");
}
function resolveSab(atk, def, atkPlay, defPlay) {
  let res = !defPlay ? "land" : atkPlay === defPlay ? "tie" : BEATS[atkPlay] === defPlay ? "land" : "parry";
  if (res === "land")  { afflict(def, atkPlay); sflash(def, PLAY[atkPlay].nm + " HIT!"); sflash(atk, "LANDED!"); }
  else if (res === "parry") { afflict(atk, defPlay); sflash(atk, "PARRIED!"); sflash(def, "BLOCKED!"); }
  else { sflash(atk, "fizzle"); sflash(def, "fizzle"); }
}
function afflict(s, play) {                       // the sabotage bites the loser's line
  const g = s.g;
  if (play === "flip") { for (const p of g.slots) if (p && (p.stage === PM.Stage.SEAR_A || p.stage === PM.Stage.SEAR_B || p.stage === PM.Stage.TOAST)) p.cook += 6; }   // RUSH: shove toward burn
  else if (play === "cheese") { const i = g.slots.findIndex((x) => x === null); if (i !== -1) g.slots[i] = PM.Patty(g.ticks); else g.pile = Math.min(g.cfg.pile_max, g.pile + 1); }  // GUM: jam a slot
  else { g.wait = Math.min(PM.WAIT_FULL, g.wait + 14); }   // SCORCH: a hard shove into the weeds
}

// ---------- fixed-timestep accumulator (the house loop) ----------
const SIM_DT = 1000 / PM.TPS;
let last = performance.now(), acc = 0;
function frame(now) {
  let e = now - last; last = now; if (e > 250) e = 250; acc += e;
  while (acc >= SIM_DT) { step(); acc -= SIM_DT; }
  audio.setBed(!matchOver, Math.max(PM.buried_index(sides[0].g), PM.buried_index(sides[1].g)));
  render();
  if (SHELL && matchOver && winner && winT > 480) { toFront(battleResult()); return; }   // the report has had its moment
  requestAnimationFrame(frame);
}
function step() {
  if (matchOver) return;
  gtick++;
  for (const s of sides) {
    const g = s.g;
    if (!g.over && !g.won) { if (s.auto) PM.auto_step(g); PM.tick(g); }
    else if (g.won) s.g = PM.advance_round(g, GRILL, null, 0);   // cleared the ticket book → keep the orders flowing to the bell
    else if (g.over) {                                           // BURIED — in a service race you don't die, you RESET the line (86'd)
      s.eightySixed++; sflash(s, "86'D — RESET THE LINE"); audio.buzzer();
      g.over = false; g.wait = PM.WAIT_FULL * 0.5; g.billy = PM.BILLY_FULL;   // same safe recovery as the 1P continue
    }
    for (const e of PMAudio.audioEvents(s.aud, g, PM.FLOW_COMBO)) audio.fire(e);   // per-side consequence sounds
    s.aud = PMAudio.audioSnap(g);
    if (CUTTHROAT) {                                             // sabotage bookkeeping only when the layer's on
      if (g.served > s.lastServed) { s.sab = Math.min(SAB_READY, s.sab + (g.served - s.lastServed)); s.lastServed = g.served; }
      if (s.primeT > 0) s.primeT--;
      if (s.incoming) { if (--s.incoming.def <= 0) { resolveSab(s.incoming.atk, s, s.incoming.play, null); s.incoming = null; } }
    }
    if (s.flashT > 0) s.flashT--;
  }
  const rem = SHIFT_TICKS - gtick;                               // countdown ticks in the last 15 seconds
  if (rem > 0 && rem <= 15 * PM.TPS && rem % PM.TPS === 0) audio.tick();
  if (gtick >= SHIFT_TICKS) ringBell();                          // the bell ends the shift → judge the service
}
function ringBell() {
  matchOver = true;
  audio.servicebell(); audio.win();
  // SERVICE judging: the engine score already rewards clean serves + the in-order combo + the perfect-sear/melt
  // quality bonus, and is docked by lost orders — so it IS the service score. Tiebreak on serves, then fewer fails.
  winner = [...sides].sort((a, b) => (b.g.score - a.g.score) || (b.g.served - a.g.served) || (a.g.fails - b.g.fails))[0];
}

// ---------- render: two grills, the center VS strip, the winner banner ----------
function txt(s, x, y, sz, c, al = "left", w = 700) {
  ctx.fillStyle = c; ctx.textAlign = al; ctx.textBaseline = "alphabetic";
  ctx.font = `${w} ${sz}px "Saira Condensed","Arial Narrow",sans-serif`; ctx.fillText(s, x, y);
}
function stageCol(p) {
  if (!p) return null;
  if (p.stage === PM.Stage.SEAR_A) return COL.raw;
  if (p.stage === PM.Stage.SEAR_B) return COL.seared;
  if (p.stage === PM.Stage.MELT) return COL.melt;
  if (p.stage === PM.Stage.DONE) return p.understeared ? COL.bad : COL.done;
  return COL.burnt;
}
function drawSide(s, x0, w) {
  const g = s.g, pad = 28;
  // header — inset clear of the centre gutter (MID±34), which used to clip SCORE / ORDERS / SERVED (1112)
  const hl = x0 + pad + (x0 > 0 ? 36 : 0), hr = x0 + w - pad - (x0 > 0 ? 0 : 36);
  txt(s.name, hl, 52, 30, s.color, "left", 800);
  txt(`SCORE ${String(g.score).padStart(6, "0")}`, hr, 44, 20, COL.cream, "right", 700);
  txt(`${g.cfg.label} · DAY ${g.cfg.day} · R${g.rnd}`, hr, 68, 14, COL.amber, "right", 600);
  txt(`ORDERS ${String(g.orders_left).padStart(2)}   COMBO x${PM.combo_mult(g.combo)}`, hl, 74, 15, COL.cream, "left", 600);
  // THE WEEDS bar
  const wf = Math.min(1, g.wait / PM.WAIT_FULL), bw = hr - hl;
  ctx.fillStyle = "#241c12"; ctx.fillRect(hl, 88, bw, 12);
  ctx.fillStyle = wf >= 0.78 ? COL.bad : wf >= 0.5 ? COL.amber : COL.good; ctx.fillRect(hl, 88, bw * wf, 12);
  // SERVICE scoreboard (the judged metric is SCORE above; these are the supporting stats)
  const clean = Math.max(0, g.served - g.sent_back);
  txt(`SERVED ${g.served}  ·  CLEAN ${clean}  ·  BURNT/LOST ${g.fails}` + (s.eightySixed ? `  ·  86×${s.eightySixed}` : ""),
      hl, 122, 13, COL.amber, "left", 600);
  if (CUTTHROAT) {                                  // the optional sabotage layer — charge + state
    const sf = s.sab / SAB_READY;
    ctx.fillStyle = "#241c12"; ctx.fillRect(hl, 130, bw, 6);
    ctx.fillStyle = s.sab >= SAB_READY ? COL.cheese : "#9a6a3a"; ctx.fillRect(hl, 130, bw * Math.min(1, sf), 6);
    let st = "", sc = COL.cheese;
    if (s.incoming) { st = "◀ DEFEND!  F=RUSH C=GUM V=SCORCH"; sc = COL.bad; }
    else if (s.primeT > 0) { st = "PRIMED! pick  F=RUSH C=GUM V=SCORCH"; sc = COL.cheese; }
    else if (s.sab >= SAB_READY) { st = "⚡ SABOTAGE READY — double-tap BILLY"; sc = COL.cheese; }
    if (st) txt(st, hl, 148, 12, sc, "left", 700);
  }
  if (s.flashT > 0) txt(s.flash, x0 + w - pad, 122, 15, COL.cream, "right", 800);
  // grill: 2 rows x ceil(n/2) cols
  const n = g.slots.length, cols = Math.ceil(n / 2), rows = n > 1 ? 2 : 1;
  const gx = x0 + pad, gy = 150, gw = w - pad * 2, gh = 282;
  const cw = gw / cols, ch = gh / rows, A3 = st3d() ? PMStages.stage("meltdome").slots[x0 > 0 ? 1 : 0] : null;
  if (!A3) { ctx.fillStyle = "rgba(255,120,40,0.06)"; ctx.fillRect(gx, gy, gw, gh); }
  for (let i = 0; i < n; i++) {
    const r = Math.floor(i / cols), c = i % cols;
    let cx = gx + c * cw + cw / 2, cy = gy + r * ch + ch / 2; const rad = Math.min(cw, ch) * 0.34;
    if (A3 && A3[i]) { cx = A3[i].x; cy = A3[i].y; }                    // the rendered well's centre
    else { ctx.strokeStyle = COL.gridln; ctx.lineWidth = 2; ctx.strokeRect(gx + c * cw + 6, gy + r * ch + 6, cw - 12, ch - 12); }
    const p = g.slots[i];
    if (p && !(A3 && PMStages.food(ctx, p, PM, cx, cy, PM.melt_done(g))))
      PMDrawItem(ctx, p, cx, cy, rad, PM, performance.now() / 1000);   // animated item sprite (sizzle/pop/steam)
    if (i === g.players[0].cursor) {                                    // the cook's spatula
      const ty = A3 && A3[i] ? A3[i].cell[1] + 2 : gy + r * ch;            // (3D: the top of the rendered cell)
      ctx.fillStyle = s.color; ctx.beginPath();
      ctx.moveTo(cx, ty + 12); ctx.lineTo(cx - 9, ty); ctx.lineTo(cx + 9, ty); ctx.fill();
      if (A3 && A3[i]) { ctx.strokeStyle = s.color; ctx.lineWidth = 3; const c = A3[i].cell; ctx.strokeRect(c[0] + 6, c[1] + 6, c[2] - 12, c[3] - 12); }
    }
  }
  // danger wash — the side reddens as it nears burial (then it 86's & resets, it never dies)
  if (wf >= 0.9) { ctx.fillStyle = `rgba(180,20,12,${(0.10 + (wf - 0.9) * 2).toFixed(2)})`; ctx.fillRect(x0, 0, w, H); }
}
function render() {
  if (globalThis.PMHiDPI) PMHiDPI.begin(ctx);
  ctx.fillStyle = "#0a0806"; ctx.fillRect(0, 0, W, H);
  if (st3d()) PMStages.plate(ctx, "meltdome");   // ?art=3d: the rendered MeltDome (HUD bands are dark on the plate)
  drawSide(sides[0], 0, MID);
  drawSide(sides[1], MID, MID);
  // center gutter (own lane so it never collides with the side HUDs)
  ctx.fillStyle = "#140a08"; ctx.fillRect(MID - 34, 0, 68, H);
  ctx.fillStyle = "#1a0c0a"; ctx.fillRect(MID - 3, 0, 6, H);
  // THE SERVICE CLOCK — counts down to the bell
  const secLeft = Math.max(0, Math.ceil((SHIFT_TICKS - gtick) / PM.TPS));
  const mm = Math.floor(secLeft / 60), ss = String(secLeft % 60).padStart(2, "0");
  const clk = secLeft <= 15 ? ((gtick >> 2) & 1 ? COL.bad : COL.amber) : COL.cheese;   // flashes in the last 15s
  txt("SERVICE", MID, 30, 12, COL.amber, "center", 700);
  txt(`${mm}:${ss}`, MID, 58, 30, clk, "center", 800);
  txt("VS", MID, 270, 34, "#d24632", "center", 800);
  txt("MELT", MID, 300, 17, COL.cheese, "center", 800);
  txt("DOME", MID, 320, 17, COL.cheese, "center", 800);
  const lead = sides[0].g.score - sides[1].g.score;
  txt(lead === 0 ? "DEAD HEAT" : (lead > 0 ? "◀ PATTY" : "CHRISSY ▶"),
      MID, 344, 13, COL.amber, "center", 700);
  if (matchOver && winner) {
    winT++;
    const conf = [COL.cheese, COL.bad, "#6fb0e0", COL.good, COL.amber];   // confetti — have fun!
    for (let i = 0; i < 56; i++) {
      const x = (i * 137) % W, spd = 1.2 + (i % 5) * 0.7, y = ((winT * spd + i * 53) % (H + 40)) - 20;
      ctx.save(); ctx.translate(x, y); ctx.rotate((winT * 0.08 + i) % 6.283);
      ctx.fillStyle = conf[i % 5]; ctx.fillRect(-4, -4, 8, 8); ctx.restore();
    }
    ctx.fillStyle = "rgba(10,5,4,0.72)"; ctx.fillRect(0, H / 2 - 96, W, 200);
    txt("🔔 SERVICE! — THE BELL RINGS", MID, H / 2 - 58, 18, COL.amber, "center", 800);
    txt(`${winner.name} WINS SERVICE`, MID, H / 2 - 20, 40, winner.color, "center", 800);
    // the SERVICE REPORT — each side's numbers, Hell's-Kitchen style
    const card = (s, x) => { const g = s.g, clean = Math.max(0, g.served - g.sent_back);
      txt(s.name, x, H / 2 + 14, 16, s.color, "center", 800);
      txt(`SCORE ${g.score}`, x, H / 2 + 36, 14, COL.cream, "center", 700);
      txt(`${clean} clean · ${g.fails} burnt/lost${s.eightySixed ? ` · 86×${s.eightySixed}` : ""}`, x, H / 2 + 56, 12, COL.amber, "center", 600); };
    card(sides[0], MID - 240); card(sides[1], MID + 240);
    txt("(a friendly grill-off — nobody melts) · press R for a rematch" + (SHELL ? " · SPACE = results" : ""), MID, H / 2 + 84, 13, COL.dim, "center", 600);
  }
}

// ---------- input: each stick drives its own grill; grabbing a stick stops that side's autopilot ----------
const P1 = { a:"l", d:"r", f:"flip", c:"cheese", v:"billy" };
const P2 = { j:"l", l:"r", i:"flip", k:"cheese", m:"billy" };
function act(side, a) {
  const g = side.g; side.auto = false;
  if (a === "l") { PM.move(g, -1, 0); return; }
  if (a === "r") { PM.move(g, 1, 0); return; }
  // a is flip/cheese/billy — CUTTHROAT states intercept these (they steal the cooking beat)
  if (side.incoming) { resolveSab(side.incoming.atk, side, side.incoming.play, a); side.incoming = null; return; }
  if (side.primeT > 0) { launchSab(side, a); return; }
  if (a === "billy") {                              // double-tap BILLY (when charged) primes a sabotage (CUTTHROAT only)
    if (CUTTHROAT && side.sab >= SAB_READY && (gtick - side.lastBilly) <= DBL_TAP) { side.primeT = PRIME_TICKS; side.lastBilly = -99; sflash(side, "PRIMED!"); return; }
    side.lastBilly = gtick; PM.hey_billy(g, 0); sideSfx(side); return;
  }
  if (a === "flip") PM.flip(g, 0);
  else if (a === "cheese") PM.add_cheese(g, 0);
  sideSfx(side);
}
addEventListener("keydown", (e) => {
  const k = e.key.toLowerCase();
  wakeAudio();
  if (k === "s") { audio.setMuted(!audio.muted); return; }   // S = speaker toggle
  if (SHELL && k === "escape") { toFront(null); return; }
  if (SHELL && matchOver && winner && (k === " " || k === "enter")) { toFront(battleResult()); return; }
  if (k === "r") { reset(); return; }
  if (matchOver) return;
  if (P1[k]) { act(sides[0], P1[k]); e.preventDefault(); }
  else if (P2[k]) { act(sides[1], P2[k]); e.preventDefault(); }
});

// QA/demo hook: ?warm=<ticks> pre-runs the autopilot race so a screenshot shows mid-action.
const warm = parseInt(Q.get("warm") || "0", 10);
for (let i = 0; i < warm; i++) step();
requestAnimationFrame(frame);
</script>
</body>
</html>
